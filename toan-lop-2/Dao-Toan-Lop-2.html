        const kq = cong ? h + cc : h - Math.min(cc, h);
        const c2 = cong ? cc : Math.min(cc, h);
        return Q.so(`Lấy hiệu của <b>${a}</b> và <b>${b}</b> rồi ${cong ? 'cộng với' : 'trừ đi'} <b>${c2}</b> được kết quả là:`, kq, { goiY: [{ hoi: `Hiệu của ${a} và ${b} là?`, dap: h }, { hoi: `${h} ${cong ? '+' : '−'} ${c2} = ?`, dap: kq }], loiGiai: [`${a} − ${b} = ${h}`, `${h} ${cong ? '+' : '−'} ${c2} = ${kq}`] });
      },
      () => c([
        () => {
          let A, B, x, s1, s2;
          do { A = c(DB_PLUS); B = c(DB.filter(s => s.gt >= 9 && s.gt <= 30)); x = n(5, 30); s1 = x + A.gt; s2 = s1 + B.gt; } while (s1 + s2 > 100);
          return Q.so(`Số thứ nhất là tổng của ${x} và ${A.ten}. Số thứ hai là tổng của số thứ nhất và ${B.ten}. Tìm tổng của hai số đó.`, s1 + s2, {
            goiY: [{ hoi: hoa(A.ten) + ' là?', dap: A.gt }, { hoi: `Số thứ nhất: ${x} + ${A.gt} = ?`, dap: s1 }, { hoi: hoa(B.ten) + ' là?', dap: B.gt }, { hoi: `Số thứ hai: ${s1} + ${B.gt} = ?`, dap: s2 }, { hoi: `Tổng hai số: ${s1} + ${s2} = ?`, dap: s1 + s2 }],
            loiGiai: [`${hoa(A.ten)} là ${A.gt}.`, `Số thứ nhất: ${x} + ${A.gt} = ${s1}.`, `Số thứ hai: ${s1} + ${B.gt} = ${s2}.`, `Tổng: ${s1} + ${s2} = ${s1 + s2}.`],
            saiThuong: { [s2]: 'Đó mới là số thứ hai. Đề hỏi tổng của hai số.' }
          });
        },
        () => {
          let t, s, d, sh1;
          do { t = n(2, 7); s = n(10, 30); d = n(10, 30); sh1 = t * 10 + s + 1; } while (sh1 + d > 99);
          return Q.so(`Trong một phép cộng, tổng hơn số hạng thứ nhất ${d} đơn vị. Số hạng thứ nhất là tổng của số tròn chục có chữ số hàng chục là ${t} và số liền sau của ${s}. Tính tổng của phép tính đó.`, sh1 + d, {
            goiY: [{ hoi: `Số tròn chục có chữ số hàng chục là ${t} là?`, dap: t * 10 }, { hoi: `Số liền sau của ${s} là?`, dap: s + 1 }, { hoi: `Số hạng thứ nhất: ${t * 10} + ${s + 1} = ?`, dap: sh1 }, `Tổng hơn số hạng thứ nhất ${d} đơn vị nghĩa là tổng = số hạng thứ nhất + ${d}.`],
            loiGiai: [`Số tròn chục: ${t * 10}. Liền sau của ${s}: ${s + 1}.`, `Số hạng thứ nhất: ${t * 10} + ${s + 1} = ${sh1}.`, `Tổng: ${sh1} + ${d} = ${sh1 + d}.`],
            saiThuong: { [sh1]: 'Đó là số hạng thứ nhất. Tổng còn hơn nó ' + d + ' đơn vị nữa.', [sh1 - d]: 'Tổng hơn số hạng thứ nhất, vậy phải cộng thêm.' }
          });
        },
        () => {
          const d = n(11, 40), a = n(10, 50);
          return Q.so(`Trong một phép cộng, tổng hơn số hạng thứ nhất <b>${d}</b> đơn vị. Số hạng thứ hai là:`, d, {
            goiY: ['Tổng = số hạng thứ nhất + số hạng thứ hai.', `Phần tổng hơn số hạng thứ nhất chính là số hạng thứ hai.`],
            hinh: { kieu: 'thanh', hang: [{ nhan: 'Tổng', doan: [{ dai: a, chu: 'Số hạng thứ nhất' }, { dai: d, chu: '?', loai: 'nhan-manh' }] }], ghiChu: `Phần tô đậm chính là ${d} đơn vị.` },
            loiGiai: [`Số hạng thứ hai = tổng − số hạng thứ nhất = ${d}.`]
          });
        }
      ])()
    ]
  });
})();

</script>
<script>
/* ---- js/de-qua-10.js ---- */
/* Đảo Qua Mười — Chủ đề 2: Phép cộng, phép trừ trong phạm vi 20; bài toán thêm, bớt; nhiều hơn, ít hơn;
   cùng các dạng nâng cao trên phiếu: tìm số ban đầu, thay đổi thành phần của phép tính. */
(function () {
  'use strict';
  const { n, c, tron, lap } = T;

  /* ================= 1. Cộng qua 10 ================= */
  const capCongQua10 = () => { const a = n(2, 9), b = n(11 - a, 9); return [a, b]; };
  CT.them({
    id: 'cong-qua-10', dao: 'qua10', ten: 'Cộng qua 10', bieu: '🔟',
    ghiNho: `<p><b>Tách để làm tròn 10:</b> 8 + 5 = 8 + 2 + 3 = 10 + 3 = 13.</p>
      <p>Thuộc các cặp cộng lại bằng 10: 1 + 9, 2 + 8, 3 + 7, 4 + 6, 5 + 5.</p>
      <p>Đổi chỗ các số hạng thì tổng không đổi: 5 + 8 = 8 + 5.</p>`,
    cap: [
      () => {
        const [a, b] = capCongQua10(), can = 10 - a, du = b - can;
        return c([
          () => Q.so(`<div class="dong-tinh">${a} + ${b} = [[0]]</div>`, a + b, {
            hinh: { kieu: 'khung10', a, b },
            goiY: [{ hoi: `${a} cần thêm mấy để được 10?`, dap: can }, { hoi: `Tách ${b} thành ${can} và mấy?`, dap: du }, { hoi: `10 + ${du} = ?`, dap: 10 + du }],
            loiGiai: [`${a} + ${b} = ${a} + ${can} + ${du} = 10 + ${du} = ${a + b}`]
          }),
          () => Q.o(`Tách số để tính:<div class="dong-tinh">${a} + ${b} = ${a} + [[0]] + [[1]] = [[2]]</div>`, [can, du, a + b], {
            goiY: [`${a} cộng mấy thì được 10?`], loiGiai: [`${a} + ${b} = ${a} + ${can} + ${du} = 10 + ${du} = ${a + b}`]
          })
        ])();
      },
      () => c([
        () => {
          const a = n(6, 9), bs = tron(lap(9, i => i + 1).filter(b => a + b > 10)).slice(0, 4);
          return Q.o(`Điền kết quả bảng cộng ${a}:`, bs.map(b => a + b), {
            hinh: { kieu: 'bang', hang: [['Phép tính'].concat(bs.map(b => `${a} + ${b}`)), ['Kết quả'].concat(bs.map((_, i) => `[[${i}]]`))] },
            goiY: [`${a} + ${10 - a} = 10, từ đó đếm thêm.`], loiGiai: bs.map(b => `${a} + ${b} = ${a + b}`)
          });
        },
        () => {
          const k = n(11, 16), ds = [];
          const dung = []; while (dung.length < 3) { const a = n(k - 9, 9), s = `${a} + ${k - a}`; if (!dung.includes(s)) dung.push(s); }
          const sai = []; while (sai.length < 3) { const [a, b] = capCongQua10(); const s = `${a} + ${b}`; if (a + b !== k && !sai.includes(s)) sai.push(s); }
          dung.concat(sai).forEach(x => ds.push(x));
          const ts = tron(ds);
          return Q.nhieu(`Chọn <b>tất cả</b> các phép tính có kết quả bằng <b>${k}</b>:`, ts, ts.map((x, i) => dung.includes(x) ? i : -1).filter(i => i >= 0), { luoi: 3, goiY: ['Tính từng phép rồi so với ' + k + '.'], loiGiai: dung.map(s => `${s} = ${k}`) });
        }
      ])(),
      () => c([
        () => {
          let a, b, t, x; do { [a, b] = capCongQua10(); t = a + b; x = n(t - 9, 9); } while (x === a || x === b || t - x < 2 || t - x > 9);
          return Q.so(`<div class="dong-tinh">${x} + [[0]] = ${a} + ${b}</div>`, t - x, { goiY: [{ hoi: `Vế phải: ${a} + ${b} = ?`, dap: t }, { hoi: `${x} + mấy = ${t}?`, dap: t - x }], loiGiai: [`${a} + ${b} = ${t}`, `${x} + ${t - x} = ${t}`] });
        },
        () => {
          const k = n(5, 9), s = 2 * k + 1;
          return Q.o(`Tìm hai số liên tiếp có tổng bằng <b>${s}</b>:<div class="dong-tinh">[[0]] + [[1]] = ${s}</div>`, [k, k + 1], {
            dapAnKhac: [[k + 1, k]], goiY: ['Hai số liên tiếp hơn kém nhau 1 đơn vị, ví dụ 6 và 7.', 'Hai số đó gần bằng nhau, mỗi số khoảng một nửa của ' + s + '.', { hoi: `Số bé là?`, dap: k }],
            loiGiai: [`${k} và ${k + 1} là hai số liên tiếp.`, `${k} + ${k + 1} = ${s}`]
          });
        },
        () => {
          const a = n(1, 9), cc = 10 - a, b = n(2, 9);
          const thu = tron([a, b, cc]);
          return Q.so(`Tính nhanh:<div class="dong-tinh">${thu.join(' + ')} = [[0]]</div>`, 10 + b, {
            goiY: ['Tìm hai số cộng lại bằng 10 rồi cộng trước.', { hoi: `${a} + ${cc} = ?`, dap: 10 }],
            loiGiai: [`${a} + ${cc} = 10`, `10 + ${b} = ${10 + b}`]
          });
        }
      ])()
    ]
  });

  /* ================= 2. Trừ qua 10 ================= */
  const capTruQua10 = () => { const a = n(11, 18), b = n(a - 9, 9); return [a, b]; };
  CT.them({
    id: 'tru-qua-10', dao: 'qua10', ten: 'Trừ qua 10', bieu: '➖',
    ghiNho: `<p><b>Cách 1 – tách số trừ:</b> 15 − 7: tách 7 = 5 + 2. 15 − 5 = 10, 10 − 2 = 8.</p>
      <p><b>Cách 2 – nghĩ phép cộng:</b> 7 + mấy = 15? Vì 7 + 8 = 15 nên 15 − 7 = 8.</p>`,
    cap: [
      () => {
        const [a, b] = capTruQua10(), le = a - 10, con = b - le;
        return c([
          () => Q.so(`<div class="dong-tinh">${a} − ${b} = [[0]]</div>`, a - b, {
            hinh: { kieu: 'khung10', a },
            goiY: [{ hoi: `${a} trừ mấy thì được 10?`, dap: le }, { hoi: `Tách ${b} thành ${le} và mấy?`, dap: con }, { hoi: `10 − ${con} = ?`, dap: 10 - con }],
            loiGiai: [`${a} − ${b} = ${a} − ${le} − ${con} = 10 − ${con} = ${a - b}`]
          }),
          () => Q.o(`Tách số để tính:<div class="dong-tinh">${a} − ${b} = ${a} − [[0]] − [[1]] = [[2]]</div>`, [le, con, a - b], { goiY: [`${a} trừ mấy được 10?`], loiGiai: [`${a} − ${le} = 10, 10 − ${con} = ${a - b}`] })
        ])();
      },
      () => c([
        () => {
          const ps = lap(3, capTruQua10);
          return Q.o('Điền số thích hợp vào ô trống:', ps.map(p => p[0] - p[1]), {
            hinh: { kieu: 'bang', hang: [['Số bị trừ'].concat(ps.map(p => p[0])), ['Số trừ'].concat(ps.map(p => p[1])), ['Hiệu', '[[0]]', '[[1]]', '[[2]]']] },
            goiY: ['Hiệu = số bị trừ − số trừ.'], loiGiai: ps.map(p => `${p[0]} − ${p[1]} = ${p[0] - p[1]}`)
          });
        },
        () => {
          const k = n(4, 8), dung = [], sai = [];
          while (dung.length < 3) { const a = n(Math.max(11, k + 1), Math.min(18, k + 9)), s = `${a} − ${a - k}`; if (a - k <= 9 && !dung.includes(s)) dung.push(s); }
          while (sai.length < 3) { const [a, b] = capTruQua10(); const s = `${a} − ${b}`; if (a - b !== k && !sai.includes(s)) sai.push(s); }
          const ts = tron(dung.concat(sai));
          return Q.nhieu(`Chọn <b>tất cả</b> các phép tính có kết quả bằng <b>${k}</b>:`, ts, ts.map((x, i) => dung.includes(x) ? i : -1).filter(i => i >= 0), { luoi: 3, loiGiai: dung.map(s => `${s} = ${k}`) });
        }
      ])(),
      () => c([
        () => {
          const cap = lap(3, () => { const [a, b] = capTruQua10(); const [x, y] = capTruQua10(); return [a, b, x, y]; });
          const d = p => (p[0] - p[1]) < (p[2] - p[3]) ? '<' : (p[0] - p[1]) > (p[2] - p[3]) ? '>' : '=';
          return Q.tha('Kéo dấu &lt;, &gt;, = vào ô trống:<div class="cot-ss">' + cap.map((p, i) => `<div>${p[0]} − ${p[1]} {{${i}}} ${p[2]} − ${p[3]}</div>`).join('') + '</div>',
            ['<', '>', '='], cap.map(d), { dungLai: true, goiY: ['Tính kết quả mỗi bên trước rồi so sánh.'], loiGiai: cap.map(p => `${p[0] - p[1]} ${d(p)} ${p[2] - p[3]}`) });
        },
        () => {
          const x = n(2, 7), y = n(2, 9 - x), v = x + y, a = n(Math.max(11, v + 2), Math.min(18, v + 9));
          return Q.so(`<div class="dong-tinh">${a} − [[0]] = ${x} + ${y}</div>`, a - v, { goiY: [{ hoi: `${x} + ${y} = ?`, dap: v }, { hoi: `${a} − mấy = ${v}?`, dap: a - v }], loiGiai: [`${x} + ${y} = ${v}`, `${a} − ${a - v} = ${v}`] });
        }
      ])()
    ]
  });

  /* ================= 3. Tìm số còn thiếu ================= */
  CT.them({
    id: 'tim-thanh-phan', dao: 'qua10', ten: 'Tìm số còn thiếu', bieu: '❓',
    ghiNho: `<p><b>? + 7 = 15</b> → số hạng = tổng − số hạng kia: 15 − 7 = 8.</p>
      <p><b>? − 6 = 9</b> → số bị trừ = hiệu + số trừ: 9 + 6 = 15.</p>
      <p><b>14 − ? = 5</b> → số trừ = số bị trừ − hiệu: 14 − 5 = 9.</p>
      <p>Làm xong con <b>thử lại</b>: điền số vừa tìm vào phép tính xem có đúng không.</p>`,
    cap: [
      () => {
        const [a, b] = capCongQua10(), t = a + b;
        return c([
          () => Q.so(`<div class="dong-tinh">[[0]] + ${b} = ${t}</div>`, a, { goiY: ['Số hạng chưa biết = tổng − số hạng kia.', { hoi: `${t} − ${b} = ?`, dap: a }], loiGiai: [`${t} − ${b} = ${a}`], saiThuong: { [t + b]: 'Muốn tìm số hạng, con lấy tổng trừ đi số hạng kia.' } }),
          () => Q.so(`<div class="dong-tinh">[[0]] − ${b} = ${a}</div>`, t, { goiY: ['Số bị trừ = hiệu + số trừ.', { hoi: `${a} + ${b} = ?`, dap: t }], loiGiai: [`${a} + ${b} = ${t}`], saiThuong: { [Math.abs(a - b)]: 'Muốn tìm số bị trừ, con lấy hiệu cộng với số trừ.' } }),
          () => Q.so(`<div class="dong-tinh">${t} − [[0]] = ${a}</div>`, b, { goiY: ['Số trừ = số bị trừ − hiệu.', { hoi: `${t} − ${a} = ?`, dap: b }], loiGiai: [`${t} − ${a} = ${b}`] })
        ])();
      },
      () => {
        const a = n(12, 60), b = n(11, 39), t = a + b;
        return c([
          () => Q.so(`<div class="dong-tinh">${a} + [[0]] = ${t}</div>`, b, { goiY: ['Số hạng chưa biết = tổng − số hạng kia.'], loiGiai: [`${t} − ${a} = ${b}`] }),
          () => Q.so(`<div class="dong-tinh">[[0]] − ${a} = ${b}</div>`, t, { goiY: ['Số bị trừ = hiệu + số trừ.'], loiGiai: [`${b} + ${a} = ${t}`] }),
          () => Q.so(`<div class="dong-tinh">${t} − [[0]] = ${b}</div>`, a, { goiY: ['Số trừ = số bị trừ − hiệu.'], loiGiai: [`${t} − ${b} = ${a}`] })
        ])();
      },
      () => {
        const x = n(10, 50), a = n(5, 30), b = n(3, x + a - 1), kq = x + a - b;
        return Q.so(`Tìm một số, biết rằng lấy số đó cộng với <b>${a}</b> rồi trừ đi <b>${b}</b> thì được <b>${kq}</b>.`, x, {
          hinh: { kieu: 'coMay', dau: '?', buoc: [`+ ${a}`, `− ${b}`], cuoi: kq },
          goiY: ['Đi ngược từ cuối: phép trừ đổi thành phép cộng, phép cộng đổi thành phép trừ.', { hoi: `Trước khi trừ ${b}, số đó là ${kq} + ${b} = ?`, dap: kq + b }, { hoi: `Trước khi cộng ${a}: ${kq + b} − ${a} = ?`, dap: x }],
          loiGiai: [`${kq} + ${b} = ${kq + b}`, `${kq + b} − ${a} = ${x}`, `Thử lại: ${x} + ${a} − ${b} = ${kq} ✓`]
        });
      }
    ]
  });

  /* ================= 4. Bài toán thêm, bớt ================= */
  const THEM = [
    { vat: 'con chim', bieu: '🐦', chu: (a, b) => `Trên cành có ${a} con chim, có thêm ${b} con chim bay đến. Hỏi trên cành có tất cả bao nhiêu con chim?`, hoi: 'số con chim trên cành có tất cả' },
    { vat: 'quả bóng', bieu: '🎈', chu: (a, b) => `Lan có ${a} quả bóng bay, mẹ mua thêm cho Lan ${b} quả. Hỏi Lan có tất cả bao nhiêu quả bóng bay?`, hoi: 'số quả bóng bay Lan có', dv: 'quả bóng bay' },
    { vat: 'viên bi', bieu: '🔵', chu: (a, b) => `Hùng và Dũng có ${a} viên bi. Nếu Hùng có thêm ${b} viên bi thì tổng số viên bi của hai bạn là bao nhiêu?`, hoi: 'tổng số viên bi của hai bạn', dv: 'viên bi' },
    { vat: 'quyển truyện', bieu: '📚', chu: (a, b) => `Giá sách có ${a} quyển truyện. Cô thư viện xếp thêm ${b} quyển truyện. Hỏi giá sách có bao nhiêu quyển truyện?`, hoi: 'số quyển truyện trên giá sách', dv: 'quyển truyện' }
  ];
  const BOT = [
    { vat: 'quả cam', bieu: '🍊', chu: (a, b) => `Mẹ có ${a} quả cam, mẹ biếu bà ${b} quả. Hỏi mẹ còn lại bao nhiêu quả cam?`, hoi: 'số quả cam mẹ còn lại', dv: 'quả cam' },
    { vat: 'con vịt', bieu: '🦆', chu: (a, b) => `Dưới ao có ${a} con vịt, có ${b} con vịt lên bờ. Hỏi dưới ao còn lại bao nhiêu con vịt?`, hoi: 'số con vịt dưới ao còn lại', dv: 'con vịt' },
    { vat: 'cái bánh', bieu: '🧁', chu: (a, b) => `Cửa hàng có ${a} cái bánh, đã bán ${b} cái bánh. Hỏi cửa hàng còn lại bao nhiêu cái bánh?`, hoi: 'số cái bánh cửa hàng còn lại', dv: 'cái bánh' },
    { vat: 'ô tô', bieu: '🚗', chu: (a, b) => `Bến xe có ${a} ô tô, có ${b} ô tô rời bến. Hỏi bến xe còn lại bao nhiêu ô tô?`, hoi: 'số ô tô còn lại ở bến', dv: 'ô tô' }
  ];
  function baiThemBot(lon) {
    const them = Math.random() < 0.5, ng = c(them ? THEM : BOT);
    let a, b;
    if (lon) { if (them) { a = n(20, 70); b = n(5, 99 - a); } else { a = n(30, 99); b = n(5, a - 10); } }
    else if (them) { const p = capCongQua10(); a = Math.max(p[0], p[1]); b = Math.min(p[0], p[1]); }
    else { [a, b] = capTruQua10(); }
    const kq = them ? a + b : a - b;
    return Q.giaiToan({
      de: ng.chu(a, b), phep: [{ hoi: ng.hoi, a, dau: them ? '+' : '−', b, kq }], donVi: ng.dv || ng.vat,
      goiYPhep: [them ? 'Có thêm vào thì nhiều lên hay ít đi?' : 'Bớt đi (cho, bán, rời đi) thì nhiều lên hay ít đi?']
    });
  }
  CT.them({
    id: 'them-bot', dao: 'qua10', ten: 'Bài toán thêm, bớt', bieu: '🛒',
    ghiNho: `<p><b>Cách trình bày bài giải</b> (như trong vở):</p>
      <div class="vo-mau"><b>Bài giải</b><br>Số viên bi của hai bạn là:<br>16 + 3 = 19 (viên bi)<br>Đáp số: 19 viên bi.</div>
      <p><b>Thêm</b> (cho thêm, mua thêm, bay đến) → phép cộng. <b>Bớt</b> (cho đi, bán đi, bay đi, ăn mất) → phép trừ.</p>
      <p>Câu lời giải lấy từ câu hỏi: “Hỏi … bao nhiêu …?” → “Số … là:”.</p>`,
    cap: [
      () => baiThemBot(false),
      () => baiThemBot(true),
      () => {
        const a = n(20, 60), b = n(5, a - 5), cc = n(5, 30), kq = a - b + cc;
        return Q.giaiToan({
          de: `Bến xe có ${a} ô tô. Có ${b} ô tô rời bến, sau đó có thêm ${cc} ô tô vào bến. Hỏi lúc này bến xe có bao nhiêu ô tô?`,
          phep: [{ hoi: `số ô tô còn lại sau khi ${b} ô tô rời bến`, a, dau: '−', b, kq: a - b }, { hoi: 'số ô tô lúc này ở bến', a: a - b, dau: '+', b: cc, kq }],
          donVi: 'ô tô', goiY: ['Bài này có hai việc xảy ra lần lượt. Tính việc thứ nhất trước.']
        });
      }
    ]
  });

  /* ================= 5. Nhiều hơn, ít hơn ================= */
  const NGUOI = [['An', 'Bình'], ['Lan', 'Mai'], ['Nam', 'Hà'], ['Hoa', 'Minh']];
  const DO = [['nhãn vở', '🏷️'], ['quả táo', '🍎'], ['cái kẹo', '🍬'], ['bông hoa', '🌸'], ['viên bi', '🔵']];
  CT.them({
    id: 'nhieu-hon-it-hon', dao: 'qua10', ten: 'Nhiều hơn, ít hơn', bieu: '📊',
    ghiNho: `<p>Tìm số <b>nhiều hơn</b> → làm phép cộng. Tìm số <b>ít hơn</b> → làm phép trừ.</p>
      <p><b>Cẩn thận đọc đề:</b> “Lan có 15 kẹo, Lan có nhiều hơn Mai 4 kẹo. Hỏi Mai có mấy kẹo?” → Mai có <b>ít hơn</b> Lan, nên làm 15 − 4 = 11.</p>
      <p>Vẽ sơ đồ đoạn thẳng: đoạn dài là người có nhiều hơn.</p>`,
    cap: [
      () => {
        const [A, B] = c(NGUOI), [vat] = c(DO), nhieu = Math.random() < 0.5;
        const a = n(8, 15), d = n(2, 6), kq = nhieu ? a + d : a - d;
        return Q.giaiToan({
          de: `${A} có ${a} ${vat}. ${B} có ${nhieu ? 'nhiều' : 'ít'} hơn ${A} ${d} ${vat}. Hỏi ${B} có bao nhiêu ${vat}?`,
          hinh: { kieu: 'thanh', hang: [{ nhan: A, doan: [{ dai: a, chu: a }] }, { nhan: B, doan: nhieu ? [{ dai: a, chu: '' }, { dai: d, chu: d, loai: 'nhan-manh' }] : [{ dai: a - d, chu: '?' }], sau: nhieu ? '' : `<span class="thieu">ít hơn ${d}</span>` }] },
          phep: [{ hoi: `số ${vat} ${B} có`, a, dau: nhieu ? '+' : '−', b: d, kq }], donVi: vat
        });
      },
      () => {
        const [A, B] = c(NGUOI), [vat] = c(DO), nhieu = Math.random() < 0.5;
        const a = n(25, 70), d = n(11, 25), kq = nhieu ? a + d : a - d;
        return Q.giaiToan({ de: `${A} có ${a} ${vat}. ${B} có ${nhieu ? 'nhiều' : 'ít'} hơn ${A} ${d} ${vat}. Hỏi ${B} có bao nhiêu ${vat}?`, phep: [{ hoi: `số ${vat} ${B} có`, a, dau: nhieu ? '+' : '−', b: d, kq }], donVi: vat });
      },
      () => {
        const [A, B] = c(NGUOI), [vat] = c(DO), nhieu = Math.random() < 0.5;
        const a = n(20, 60), d = n(4, 15), kq = nhieu ? a - d : a + d;
        if (Math.random() < 0.6) {
          return Q.giaiToan({
            de: `${A} có ${a} ${vat}. ${A} có <b>${nhieu ? 'nhiều' : 'ít'}</b> hơn ${B} ${d} ${vat}. Hỏi ${B} có bao nhiêu ${vat}?`,
            phep: [{ hoi: `số ${vat} ${B} có`, a, dau: nhieu ? '−' : '+', b: d, kq, saiPhep: { [nhieu ? 0 : 1]: `Đọc kĩ: ${A} ${nhieu ? 'nhiều' : 'ít'} hơn ${B}, vậy ${B} ${nhieu ? 'ít' : 'nhiều'} hơn ${A}.` } }], donVi: vat,
            goiY: [`${A} ${nhieu ? 'nhiều' : 'ít'} hơn ${B}. Vậy ${B} nhiều hơn hay ít hơn ${A}?`],
            hinh: { kieu: 'thanh', hang: nhieu ? [{ nhan: A, doan: [{ dai: a - d, chu: '' }, { dai: d, chu: d, loai: 'nhan-manh' }], sau: a }, { nhan: B, doan: [{ dai: a - d, chu: '?' }] }] : [{ nhan: A, doan: [{ dai: a, chu: a }] }, { nhan: B, doan: [{ dai: a, chu: '' }, { dai: d, chu: d, loai: 'nhan-manh' }], sau: '?' }] }
          });
        }
        const d2 = n(4, Math.min(15, a - 5)), b = a - d2;
        return Q.giaiToan({
          de: `Giỏ thứ nhất có ${a} ${vat}. Giỏ thứ hai có ít hơn giỏ thứ nhất ${d2} ${vat}. Hỏi cả hai giỏ có bao nhiêu ${vat}?`,
          phep: [{ hoi: `số ${vat} giỏ thứ hai có`, a, dau: '−', b: d2, kq: b }, { hoi: `số ${vat} cả hai giỏ có`, a, dau: '+', b, kq: a + b }], donVi: vat,
          goiY: ['Muốn tìm cả hai giỏ, trước hết phải biết giỏ thứ hai có bao nhiêu.']
        });
      }
    ]
  });

  /* ================= 6. Tìm số ban đầu (Phiếu Tuần 1 – tự luận) ================= */
  CT.them({
    id: 'tinh-nguoc', dao: 'qua10', ten: 'Tìm số ban đầu', bieu: '⏪',
    ghiNho: `<p><b>Đi ngược từ cuối về đầu:</b> phần nào đã <b>thêm vào</b> thì <b>bớt đi</b>; phần nào đã <b>bớt đi</b> thì <b>thêm vào</b>.</p>
      <p>Ví dụ: Mẹ bán đi 5 con gà thì còn lại 43 con. Trước khi bán: 43 + 5 = 48 con gà.</p>
      <p>Ví dụ: Bán 15 con vịt, rồi bà cho thêm 7 con thì có 47 con. Trước khi bà cho: 47 − 7 = 40. Trước khi bán: 40 + 15 = 55 con.</p>`,
    cap: [
      () => {
        const ban = Math.random() < 0.5, a = n(3, 15), con = n(10, 80 - a);
        if (ban) return Q.giaiToan({ de: `Nhà bạn Tú có một đàn gà. Sau khi mẹ bán đi ${a} con gà thì còn lại ${con} con gà. Hỏi trước khi bán, nhà bạn Tú có bao nhiêu con gà?`, hinh: { kieu: 'coMay', dau: '?', buoc: [`− ${a}`], cuoi: con }, phep: [{ hoi: 'số con gà nhà bạn Tú có trước khi bán', a: con, dau: '+', b: a, kq: con + a, saiPhep: { 1: 'Đã bán đi thì lúc đầu phải nhiều hơn bây giờ.' } }], donVi: 'con gà', goiYPhep: ['Lúc đầu nhiều hơn hay ít hơn lúc sau?'] });
        const co = con + a;
        return Q.giaiToan({ de: `Mai được mẹ cho thêm ${a} cái kẹo thì Mai có tất cả ${co} cái kẹo. Hỏi lúc đầu Mai có bao nhiêu cái kẹo?`, hinh: { kieu: 'coMay', dau: '?', buoc: [`+ ${a}`], cuoi: co }, phep: [{ hoi: 'số cái kẹo Mai có lúc đầu', a: co, dau: '−', b: a, kq: con, saiPhep: { 0: 'Được cho thêm thì lúc đầu phải ít hơn bây giờ.' } }], donVi: 'cái kẹo' });
      },
      () => {
        const chuc = n(1, 3), them = Math.random() < 0.5, kq = n(2, 6) * 10 + n(0, 9) * (Math.random() < 0.5 ? 1 : 0);
        if (them) {
          const cuoi = kq + chuc * 10;
          return Q.so(`Nếu cho Lan thêm ${chuc} chục nhãn vở thì Lan có ${cuoi} nhãn vở. Hỏi lúc đầu Lan có bao nhiêu nhãn vở?`, kq, {
            donVi: 'nhãn vở', hinh: { kieu: 'coMay', dau: '?', buoc: [`+ ${chuc} chục`], cuoi },
            goiY: [{ hoi: `${chuc} chục là bao nhiêu?`, dap: chuc * 10 }, { hoi: `Lúc đầu: ${cuoi} − ${chuc * 10} = ?`, dap: kq }],
            loiGiai: [`${chuc} chục = ${chuc * 10}.`, `Lúc đầu Lan có: ${cuoi} − ${chuc * 10} = ${kq} (nhãn vở).`], saiThuong: { [cuoi + chuc * 10]: 'Được cho thêm thì lúc đầu phải ít hơn.', [cuoi - chuc]: `${chuc} chục là ${chuc * 10} chứ không phải ${chuc}.` }
          });
        }
        const conLai = kq, dau = conLai + chuc * 10;
        return Q.so(`Tâm có một số nhãn vở. Tâm cho Hà ${chuc} chục nhãn vở thì Tâm còn lại ${conLai} nhãn vở. Hỏi lúc đầu Tâm có bao nhiêu nhãn vở?`, dau, {
          donVi: 'nhãn vở', hinh: { kieu: 'coMay', dau: '?', buoc: [`− ${chuc} chục`], cuoi: conLai },
          goiY: [{ hoi: `${chuc} chục là bao nhiêu?`, dap: chuc * 10 }, { hoi: `Lúc đầu: ${conLai} + ${chuc * 10} = ?`, dap: dau }],
          loiGiai: [`${chuc} chục = ${chuc * 10}.`, `Lúc đầu Tâm có: ${conLai} + ${chuc * 10} = ${dau} (nhãn vở).`], saiThuong: { [conLai - chuc * 10]: 'Đã cho đi thì lúc đầu phải nhiều hơn.' }
        });
      },
      () => c([
        () => {
          const a = n(2, 6), b = n(2, 6), cuoi = n(a + b + 3, 30), dau = cuoi - a - b;
          return Q.so(`Nếu mẹ cho Dũng thêm ${a} chiếc kẹo, anh cho Dũng thêm ${b} chiếc kẹo thì Dũng có tất cả ${cuoi} chiếc kẹo. Hỏi ban đầu Dũng có bao nhiêu chiếc kẹo?`, dau, {
            donVi: 'chiếc kẹo', hinh: { kieu: 'coMay', dau: '?', buoc: [`+ ${a}`, `+ ${b}`], cuoi },
            goiY: ['Đi ngược từ cuối.', { hoi: `Trước khi anh cho: ${cuoi} − ${b} = ?`, dap: cuoi - b }, { hoi: `Trước khi mẹ cho: ${cuoi - b} − ${a} = ?`, dap: dau }],
            loiGiai: [`Trước khi anh cho, Dũng có: ${cuoi} − ${b} = ${cuoi - b} (chiếc kẹo)`, `Ban đầu Dũng có: ${cuoi - b} − ${a} = ${dau} (chiếc kẹo)`, `Hoặc: cả mẹ và anh cho ${a} + ${b} = ${a + b}; ${cuoi} − ${a + b} = ${dau}.`]
          });
        },
        () => {
          const ban = n(8, 20), them = n(3, 12), cuoi = n(ban + 10, 70), giua = cuoi - them, dau = giua + ban;
          return Q.so(`Nhà Lan có một số con vịt. Mẹ Lan bán đi ${ban} con vịt, sau đó bà lại cho nhà Lan thêm ${them} con vịt thì nhà Lan có tất cả ${cuoi} con vịt. Hỏi lúc đầu nhà Lan có bao nhiêu con vịt?`, dau, {
            donVi: 'con vịt', hinh: { kieu: 'coMay', dau: '?', buoc: [`− ${ban}`, `+ ${them}`], cuoi },
            goiY: ['Đi ngược: việc xảy ra sau cùng thì tính ngược trước.', { hoi: `Trước khi bà cho thêm ${them} con: ${cuoi} − ${them} = ?`, dap: giua }, { hoi: `Trước khi bán ${ban} con: ${giua} + ${ban} = ?`, dap: dau }],
            loiGiai: [`Trước khi bà cho: ${cuoi} − ${them} = ${giua} (con vịt)`, `Lúc đầu: ${giua} + ${ban} = ${dau} (con vịt)`],
            saiThuong: { [cuoi + them - ban]: 'Con đổi ngược phép tính chưa đúng: bà cho thêm thì phải trừ đi, đã bán thì phải cộng vào.' }
          });
        },
        () => {
          const cho = n(3, 9), nhan = n(2, 9), cuoi = n(cho + 6, 30), giua = cuoi - nhan, dau = giua + cho;
          return Q.so(`Hà cho Hùng ${cho} quả bóng bay, Lan lại cho Hà ${nhan} quả bóng bay thì Hà có ${cuoi} quả bóng bay. Hỏi lúc đầu, Hà có bao nhiêu quả bóng bay?`, dau, {
            donVi: 'quả bóng bay', hinh: { kieu: 'coMay', dau: '?', buoc: [`− ${cho}`, `+ ${nhan}`], cuoi },
            goiY: ['Hà cho đi thì số bóng của Hà ít đi; Hà được cho thì nhiều lên.', { hoi: `Trước khi Lan cho: ${cuoi} − ${nhan} = ?`, dap: giua }, { hoi: `Trước khi Hà cho Hùng: ${giua} + ${cho} = ?`, dap: dau }],
            loiGiai: [`${cuoi} − ${nhan} = ${giua}`, `${giua} + ${cho} = ${dau}`, `Lúc đầu Hà có ${dau} quả bóng bay.`]
          });
        }
      ])()
    ]
  });

  /* ================= 7. Thay đổi thành phần (Phiếu Tuần 5 bài 7, 8, 9) ================= */
  CT.them({
    id: 'thay-doi', dao: 'qua10', ten: 'Thay đổi số hạng, số trừ', bieu: '🔄',
    ghiNho: `<p><b>Phép cộng:</b> giữ nguyên một số hạng, số hạng kia <b>thêm</b> (bớt) bao nhiêu thì tổng cũng <b>thêm</b> (bớt) bấy nhiêu.</p>
      <p><b>Phép trừ:</b> số bị trừ thêm bao nhiêu thì hiệu thêm bấy nhiêu. Nhưng <b>số trừ thêm</b> bao nhiêu thì <b>hiệu bớt</b> bấy nhiêu (trừ nhiều hơn thì còn ít hơn).</p>
      <p>Ví dụ: Hai số có hiệu 56. Giữ nguyên số bị trừ, thêm vào số trừ 3 → hiệu mới 56 − 3 = 53.</p>`,
    cap: [
      () => {
        const a = n(11, 40), b = n(11, 40), k = n(2, 9), them = Math.random() < 0.5;
        const t = a + b, moi = them ? t + k : t - k;
        return Q.so(`<div class="dong-tinh">${a} + ${b} = ${t}</div>Nếu giữ nguyên ${a} và ${them ? `thêm ${k} đơn vị vào số ${b}` : `bớt ${k} đơn vị ở số ${b}`} thì tổng mới là:`, moi, {
          hinh: { kieu: 'thanh', hang: [{ nhan: 'Tổng cũ', doan: [{ dai: a, chu: a }, { dai: b, chu: b }] }, { nhan: 'Tổng mới', doan: [{ dai: a, chu: a }, { dai: them ? b + k : b - k, chu: them ? `${b} + ${k}` : `${b} − ${k}`, loai: 'nhan-manh' }] }] },
          goiY: [{ hoi: `Số hạng mới: ${b} ${them ? '+' : '−'} ${k} = ?`, dap: them ? b + k : b - k }, { hoi: `Tổng mới: ${a} + ${them ? b + k : b - k} = ?`, dap: moi }],
          loiGiai: [`${a} + ${them ? b + k : b - k} = ${moi}`, `Nhận xét: tổng cũng ${them ? 'thêm' : 'bớt'} ${k} đơn vị: ${t} ${them ? '+' : '−'} ${k} = ${moi}.`]
        });
      },
      () => {
        const cong = Math.random() < 0.5, t = n(30, 90), k = n(3, 15), them = Math.random() < 0.5;
        if (cong) {
          const moi = them ? t + k : t - k;
          return Q.so(`Hai số có tổng là <b>${t}</b>. Nếu giữ nguyên số hạng thứ nhất và ${them ? 'thêm vào' : 'giảm bớt'} số hạng thứ hai <b>${k}</b> đơn vị thì tổng mới bằng bao nhiêu?`, moi, {
            goiY: [`Số hạng thứ hai ${them ? 'thêm' : 'bớt'} ${k} thì tổng cũng ${them ? 'thêm' : 'bớt'} ${k}.`, { hoi: `${t} ${them ? '+' : '−'} ${k} = ?`, dap: moi }],
            loiGiai: [`Tổng mới: ${t} ${them ? '+' : '−'} ${k} = ${moi}`], saiThuong: { [them ? t - k : t + k]: 'Ngược rồi. Số hạng thêm thì tổng thêm, số hạng bớt thì tổng bớt.' }
          });
        }
        const moi = them ? t - k : t + k;
        return Q.so(`Hai số có hiệu bằng <b>${t}</b>. Nếu giữ nguyên số bị trừ và ${them ? 'thêm vào' : 'bớt đi ở'} số trừ <b>${k}</b> đơn vị thì hiệu mới bằng bao nhiêu?`, moi, {
          goiY: [them ? 'Trừ đi nhiều hơn thì còn lại nhiều hơn hay ít hơn?' : 'Trừ đi ít hơn thì còn lại nhiều hơn hay ít hơn?', `Ví dụ: 10 − 3 = 7; 10 − ${them ? 5 : 1} = ${them ? 5 : 9}.`],
          loiGiai: [`Số trừ ${them ? 'thêm' : 'bớt'} ${k} thì hiệu ${them ? 'bớt' : 'thêm'} ${k}.`, `Hiệu mới: ${t} ${them ? '−' : '+'} ${k} = ${moi}`],
          saiThuong: { [them ? t + k : t - k]: 'Cẩn thận! Số trừ thêm thì hiệu lại bớt đi.' }
        });
      },
      () => c([
        () => {
          const t = n(30, 80), a = n(3, 12), b = n(2, 12), kq = t + a - b;
          return Q.so(`Hai số có tổng là <b>${t}</b>. Nếu thêm vào số hạng thứ nhất <b>${a}</b> đơn vị và bớt ở số hạng thứ hai <b>${b}</b> đơn vị thì tổng mới là bao nhiêu?`, kq, {
            goiY: [{ hoi: `Thêm ${a} vào số hạng thứ nhất: tổng thành ${t} + ${a} = ?`, dap: t + a }, { hoi: `Bớt ${b} ở số hạng thứ hai: ${t + a} − ${b} = ?`, dap: kq }],
            loiGiai: [`${t} + ${a} = ${t + a}`, `${t + a} − ${b} = ${kq}`]
          });
        },
        () => {
          const h = n(20, 70), k = n(3, 15);
          return Q.so(`Hai số có hiệu là <b>${h}</b>. Nếu thêm vào số bị trừ <b>${k}</b> đơn vị và thêm vào số trừ <b>${k}</b> đơn vị thì hiệu mới là bao nhiêu?`, h, {
            goiY: [`Số bị trừ thêm ${k} → hiệu thêm ${k}. Số trừ thêm ${k} → hiệu bớt ${k}.`, 'Thêm rồi lại bớt cùng một số thì sao?', 'Thử với số nhỏ: 10 − 4 = 6; (10 + 2) − (4 + 2) = ?'],
            loiGiai: [`${h} + ${k} − ${k} = ${h}`, 'Hiệu không thay đổi.'], saiThuong: { [h + 2 * k]: 'Số trừ thêm thì hiệu bớt đi. Hai việc bù cho nhau.', [h + k]: 'Còn việc thêm vào số trừ nữa.' }
          });
        },
        () => {
          const t = n(40, 95), sh1 = n(10, t - 10);
          return Q.so(`Trong một phép cộng, tổng hơn số hạng thứ nhất <b>${t - sh1}</b> đơn vị. Nếu số hạng thứ nhất là <b>${sh1}</b> thì tổng là:`, t, {
            goiY: ['Tổng hơn số hạng thứ nhất bao nhiêu thì cộng thêm bấy nhiêu.', { hoi: `${sh1} + ${t - sh1} = ?`, dap: t }],
            loiGiai: [`Tổng = ${sh1} + ${t - sh1} = ${t}`]
          });
        }
      ])()
    ]
  });
})();

</script>
<script>
/* ---- js/de-can-conho.js ---- */
/* Đảo Cân và Bình (Chủ đề 3: ki-lô-gam, lít) và Đảo Có Nhớ (Chủ đề 4: cộng, trừ có nhớ trong phạm vi 100). */
(function () {
  'use strict';
  const { n, c, tron, lap } = T;
  const VAT_CAN = [['🍉', 'quả dưa hấu'], ['🎃', 'quả bí'], ['🍍', 'quả dứa'], ['🐱', 'con mèo'], ['🎒', 'cái cặp']];

  /* ================= Cộng có nhớ ================= */
  function congCoNho(hai) {
    let a, b;
    do { a = n(11, 89); b = hai ? n(11, 89) : n(2, 9); } while (a % 10 + b % 10 < 10 || a + b > 100);
    return [a, b];
  }
  function truCoNho(hai) {
    let a, b;
    do { a = n(20, 99); b = hai ? n(11, a - 1) : n(2, 9); } while (a % 10 >= b % 10 || a - b < 1);
    return [a, b];
  }
  function cotTinh(a, b, dau) {
    const kq = dau === '+' ? a + b : a - b;
    const dv = dau === '+' ? a % 10 + b % 10 : a % 10 + 10 - b % 10;
    const chA = Math.floor(a / 10), chB = Math.floor(b / 10);
    const goiY = dau === '+'
      ? [{ hoi: `Hàng đơn vị: ${a % 10} + ${b % 10} = ?`, dap: dv }, `Viết ${dv % 10}, nhớ 1 sang hàng chục.`, { hoi: `Hàng chục: ${chA} + ${chB} + 1 (nhớ) = ?`, dap: chA + chB + 1 }]
      : [`Hàng đơn vị: ${a % 10} không trừ được ${b % 10}, lấy ${a % 10 + 10} trừ ${b % 10}.`, { hoi: `${a % 10 + 10} − ${b % 10} = ?`, dap: dv }, `Viết ${dv}, nhớ 1 sang hàng chục.`, { hoi: `Hàng chục: ${chB} thêm 1 là ${chB + 1}; ${chA} − ${chB + 1} = ?`, dap: chA - chB - 1 }];
    const loiGiai = dau === '+'
      ? [`${a % 10} + ${b % 10} = ${dv}, viết ${dv % 10} nhớ 1.`, `${chA} + ${chB} = ${chA + chB}, thêm 1 bằng ${chA + chB + 1}, viết ${chA + chB + 1}.`, `${a} + ${b} = ${kq}`]
      : [`${a % 10 + 10} − ${b % 10} = ${dv}, viết ${dv} nhớ 1.`, chA - chB - 1 ? `${chB} thêm 1 bằng ${chB + 1}; ${chA} − ${chB + 1} = ${chA - chB - 1}, viết ${chA - chB - 1}.` : `${chB} thêm 1 bằng ${chB + 1}; ${chA} − ${chB + 1} = 0, không cần viết.`, `${a} − ${b} = ${kq}`];
    return { kq, goiY, loiGiai };
  }
  function datTinhCau(a, b, dau) {
    const r = cotTinh(a, b, dau), sk = String(r.kq).split('');
    return Q.o('Đặt tính rồi tính (điền chữ số vào kết quả):', sk.map(Number), { hinh: CT.datTinh(a, b, dau, r.kq, true), goiY: r.goiY, loiGiai: r.loiGiai });
  }
  function thieuChuSo(dau) {
    // a = x?  b = ?y ; một chữ số ẩn ở mỗi số, phép tính có nhớ, đáp án duy nhất
    for (; ;) {
      const [a, b] = dau === '+' ? congCoNho(true) : truCoNho(true);
      const kq = dau === '+' ? a + b : a - b;
      if (kq >= 100 || kq < 10) continue;
      const anA = Math.random() < 0.5 ? 0 : 1, anB = 1 - anA;
      const sa = String(a).split(''), sb = String(b).split('');
      // kiểm tra đáp án duy nhất
      let dem = 0;
      for (let x = 0; x <= 9; x++) for (let y = 0; y <= 9; y++) {
        const ta = sa.slice(), tb = sb.slice(); ta[anA] = String(x); tb[anB] = String(y);
        if (ta[0] === '0' || tb[0] === '0') continue;
        const A = Number(ta.join('')), B = Number(tb.join(''));
        if ((dau === '+' ? A + B : A - B) === kq) dem++;
      }
      if (dem !== 1) continue;
      const ha = sa.slice(), hb = sb.slice(); ha[anA] = '[[0]]'; hb[anB] = '[[1]]';
      return Q.o('Điền chữ số thích hợp vào ô trống:', [Number(sa[anA]), Number(sb[anB])], {
        hinh: { kieu: 'datTinh', dong: [ha, [dau].concat(hb)], kq: String(kq).split('') },
        goiY: ['Bắt đầu từ hàng đơn vị. Nhớ xem có “nhớ 1” sang hàng chục không.', dau === '+' ? 'Hàng đơn vị cộng lại có tận cùng là chữ số hàng đơn vị của kết quả.' : 'Thử từng chữ số rồi kiểm tra lại.'],
        loiGiai: [`${a} ${dau} ${b} = ${kq}`, 'Thử lại bằng cách tính lại cả phép tính.']
      });
    }
  }

        if (them) { const [a, b] = congCoNho(true); return Q.giaiToan({ de: `Lớp 2A có ${a} bạn, lớp 2B có ${b} bạn tham gia trồng cây. Hỏi cả hai lớp có bao nhiêu bạn tham gia trồng cây?`, phep: [{ hoi: 'số bạn cả hai lớp tham gia trồng cây', a, dau: '+', b, kq: a + b }], donVi: 'bạn' }); }
        const [a, b] = truCoNho(true);
        return Q.giaiToan({ de: `Một cửa hàng có ${a} quả bóng, đã bán ${b} quả bóng. Hỏi cửa hàng còn lại bao nhiêu quả bóng?`, phep: [{ hoi: 'số quả bóng cửa hàng còn lại', a, dau: '−', b, kq: a - b }], donVi: 'quả bóng' });
      },
      () => {
        const nhieu = Math.random() < 0.5;
        if (nhieu) { const [a, b] = congCoNho(true); return Q.giaiToan({ de: `Đàn gà có ${a} con. Đàn vịt nhiều hơn đàn gà ${b} con. Hỏi đàn vịt có bao nhiêu con?`, phep: [{ hoi: 'số con vịt', a, dau: '+', b, kq: a + b }], donVi: 'con' }); }
        const [a, b] = truCoNho(true);
        return Q.giaiToan({ de: `Sợi dây dài ${a} cm. Bố cắt đi ${b} cm để buộc hàng. Hỏi sợi dây còn lại dài bao nhiêu xăng-ti-mét?`, phep: [{ hoi: 'sợi dây còn lại dài', a, dau: '−', b, kq: a - b }], donVi: 'cm' });
      },
      () => {
        if (Math.random() < 0.5) {
          const x = n(15, 40), y = n(10, Math.max(11, 99 - x - 10)), tong = Math.min(99, x + y + n(10, 30));
          const z = tong - x - y;
          return Q.giaiToan({
            de: `Ba bạn hái được ${tong} bông hoa. Lan hái được ${x} bông, Huệ hái được ${y} bông, còn lại là của Cúc. Hỏi Cúc hái được bao nhiêu bông hoa?`,
            phep: [{ hoi: 'số bông hoa Lan và Huệ hái được', a: x, dau: '+', b: y, kq: x + y }, { hoi: 'số bông hoa Cúc hái được', a: tong, dau: '−', b: x + y, kq: z }],
            donVi: 'bông hoa', goiY: ['Tìm số hoa của Lan và Huệ trước.']
          });
        }
        let x, d;
        do { x = n(30, 60); d = n(5, x - 10); } while (x + (x - d) > 100 || (x % 10) >= (d % 10));
        return Q.giaiToan({
          de: `Thùng thứ nhất có ${x} l dầu. Thùng thứ hai có ít hơn thùng thứ nhất ${d} l dầu. Hỏi cả hai thùng có bao nhiêu lít dầu?`,
          phep: [{ hoi: 'số lít dầu thùng thứ hai có', a: x, dau: '−', b: d, kq: x - d }, { hoi: 'số lít dầu cả hai thùng có', a: x, dau: '+', b: x - d, kq: 2 * x - d }],
          donVi: 'l', goiY: ['Tìm thùng thứ hai trước.']
        });
      }
    ]
  });

  /* ================= Điền dấu + − và so sánh ================= */
  function dienDau(soSo) {
    for (; ;) {
      const ds = lap(soSo, () => n(2, 30)), dau = lap(soSo - 1, () => c(['+', '−']));
      let kq = ds[0], ok = true;
      dau.forEach((d, i) => { kq = d === '+' ? kq + ds[i + 1] : kq - ds[i + 1]; if (kq < 0 || kq > 100) ok = false; });
      if (!ok) continue;
      // đáp án duy nhất
      let dem = 0; const tat = soSo === 2 ? [['+'], ['−']] : [['+', '+'], ['+', '−'], ['−', '+'], ['−', '−']];
      tat.forEach(t => { let v = ds[0]; t.forEach((d, i) => { v = d === '+' ? v + ds[i + 1] : v - ds[i + 1]; }); if (v === kq) dem++; });
      if (dem !== 1) continue;
      const de = ds.map((x, i) => i < soSo - 1 ? `${x} {{${i}}}` : `${x}`).join(' ') + ` = ${kq}`;
      return Q.tha(`Kéo dấu + hoặc − vào ô trống cho đúng:<div class="dong-tinh">${de}</div>`, ['+', '−'], dau, { dungLai: true, goiY: ['Thử dấu + trước, tính xem có ra đúng kết quả không. Nếu không, đổi sang dấu −.'], loiGiai: [ds.map((x, i) => i < soSo - 1 ? `${x} ${dau[i]}` : `${x}`).join(' ') + ` = ${kq}`] });
    }
  }
  CT.them({
    id: 'dien-dau', dao: 'conho', ten: 'Điền dấu, so sánh', bieu: '🎯',
    ghiNho: `<p>Điền dấu + hay −: <b>thử</b> từng dấu, tính ra rồi so với kết quả.</p>
      <p>Kết quả lớn hơn số đầu thì thường có dấu +; nhỏ hơn thì thường có dấu −.</p>
      <p>So sánh hai phép tính: tính kết quả từng bên rồi mới so sánh.</p>`,
    cap: [() => dienDau(2), () => dienDau(3),
      () => {
        const cap = lap(3, () => { const [a, b] = congCoNho(true); const [x, y] = truCoNho(true); return [a, b, x, y]; });
        const d = p => (p[0] + p[1]) < (p[2] - p[3]) ? '<' : (p[0] + p[1]) > (p[2] - p[3]) ? '>' : '=';
        return Q.tha('Kéo dấu &lt;, &gt;, = vào ô trống:<div class="cot-ss">' + cap.map((p, i) => `<div>${p[0]} + ${p[1]} {{${i}}} ${p[2]} − ${p[3]}</div>`).join('') + '</div>',
          ['<', '>', '='], cap.map(d), { dungLai: true, goiY: ['Tính từng bên ra nháp rồi so sánh.'], loiGiai: cap.map(p => `${p[0] + p[1]} ${d(p)} ${p[2] - p[3]}`) });
      }]
  });
})();

</script>
<script>
/* ---- js/de-hinh-gio.js ---- */
/* Đảo Hình Học (Chủ đề 5, 9) và Đảo Thời Gian (Chủ đề 6). */
(function () {
  'use strict';
  const { n, c, tron, lap } = T;
  const TEN_HINH = { tamGiac: 'hình tam giác', tuGiac: 'hình tứ giác', tron: 'hình tròn', vuong: 'hình vuông', chuNhat: 'hình chữ nhật', nguGiac: 'hình có 5 cạnh' };
  const TEN_DUONG = { doanThang: 'đoạn thẳng', duongThang: 'đường thẳng', duongCong: 'đường cong', gapKhuc: 'đường gấp khúc' };
  const hoa = s => s.charAt(0).toUpperCase() + s.slice(1);

  /* ================= Nhận dạng hình phẳng ================= */
  CT.them({
    id: 'nhan-dang-hinh', dao: 'hinh', ten: 'Nhận dạng hình', bieu: '🔺',
    ghiNho: `<p><b>Hình tam giác</b> có 3 cạnh. <b>Hình tứ giác</b> có 4 cạnh.</p>
      <p>Hình vuông và hình chữ nhật cũng có 4 cạnh, nên cũng là <b>hình tứ giác</b>.</p>
      <p><b>Đoạn thẳng</b> có hai đầu (hai điểm). <b>Đường thẳng</b> kéo dài mãi về hai phía. <b>Đường cong</b> không thẳng. <b>Đường gấp khúc</b> gồm nhiều đoạn thẳng nối tiếp nhau.</p>`,
    cap: [
      () => {

        }

      },
      () => {
        const tat = tron(['tamGiac', 'tuGiac', 'tron', 'vuong', 'chuNhat', 'nguGiac', 'tamGiac', 'tuGiac']);
        return Q.nhieu('Chọn <b>tất cả</b> các hình tứ giác:', tat.map((t, i) => ({ nhan: HV.hinhPhang(t, 64), gt: i })), tat.map((t, i) => ['tuGiac', 'vuong', 'chuNhat'].includes(t) ? i : -1).filter(i => i >= 0), {
          luoi: 4, goiY: ['Đếm số cạnh của từng hình.', 'Hình vuông, hình chữ nhật có 4 cạnh nên cũng là tứ giác.'], loiGiai: ['Hình có đúng 4 cạnh là tứ giác: hình vuông, hình chữ nhật và các hình 4 cạnh khác.']
        });
      },
      () => {
        const k = n(3, 5), so = k * (k - 1) / 2;
        const ten = 'ABCDEFG'.slice(0, k).split('');
        return Q.so(`Trên một đường thẳng có ${k} điểm ${ten.join(', ')}. Có bao nhiêu đoạn thẳng nối hai trong các điểm đó?`, so, {
          hinh: { kieu: 'diem', cao: 70, diem: ten.map((t, i) => ({ x: 30 + i * 240 / (k - 1), y: 40, ten: t })), doan: [[0, k - 1]] },
          goiY: [{ hoi: `Từ điểm ${ten[0]} nối được với mấy điểm còn lại?`, dap: k - 1 }, { hoi: `Từ ${ten[1]} nối thêm được mấy đoạn mới (không tính ${ten[1]}${ten[0]} nữa)?`, dap: k - 2 }, 'Cứ thế đến điểm gần cuối rồi cộng lại.'],
          loiGiai: [lap(k - 1, i => k - 1 - i).join(' + ') + ` = ${so}`, `Có ${so} đoạn thẳng.`]
        });
      }
    ]
  });

  /* ================= Ba điểm thẳng hàng ================= */
  CT.them({
    id: 'thang-hang', dao: 'hinh', ten: 'Ba điểm thẳng hàng', bieu: '📍',
    ghiNho: `<p>Ba điểm <b>thẳng hàng</b> là ba điểm cùng nằm trên một đường thẳng.</p>
      <p>Cách kiểm tra: đặt thước kẻ qua hai điểm, xem điểm thứ ba có nằm sát mép thước không.</p>`,
    cap: [
      () => {
        const dung = Math.random() < 0.5;
        const pts = dung ? [{ x: 40, y: 120, ten: 'A' }, { x: 150, y: 80, ten: 'B' }, { x: 260, y: 40, ten: 'C' }] : [{ x: 40, y: 120, ten: 'A' }, { x: 150, y: 40, ten: 'B' }, { x: 260, y: 110, ten: 'C' }];
        return Q.chon('Ba điểm A, B, C có thẳng hàng không?', ['Có, thẳng hàng', 'Không thẳng hàng'], dung ? 0 : 1, { giuThuTu: true, hinh: { kieu: 'diem', diem: pts }, goiY: ['Tưởng tượng đặt thước qua A và C. Điểm B có nằm trên mép thước không?'], loiGiai: [dung ? 'A, B, C cùng nằm trên một đường thẳng.' : 'B nằm lệch ra ngoài đường thẳng qua A và C.'] });
      },
      () => {
        // lưới 3x3, chọn bộ ba thẳng hàng
        const luoi = lap(9, i => ({ x: 60 + (i % 3) * 90, y: 25 + Math.floor(i / 3) * 55 }));
        const bo = [[0, 1, 2], [3, 4, 5], [6, 7, 8], [0, 3, 6], [1, 4, 7], [2, 5, 8], [0, 4, 8], [2, 4, 6]];
        const chon = tron(lap(9, i => i)).slice(0, 5);
        let dungBo = bo.find(b => b.every(i => chon.includes(i)));
        if (!dungBo) { dungBo = c(bo); dungBo.forEach(i => { if (!chon.includes(i)) chon[chon.findIndex(x => !dungBo.includes(x))] = i; }); }
        const ten = 'ABCDE'.split('');
        const pts = chon.map((i, k) => ({ x: luoi[i].x, y: luoi[i].y, ten: ten[k] }));
        const thangHang = (a, b, cc) => (pts[b].x - pts[a].x) * (pts[cc].y - pts[a].y) === (pts[cc].x - pts[a].x) * (pts[b].y - pts[a].y);
        const tat = []; for (let a = 0; a < 5; a++) for (let b = a + 1; b < 5; b++) for (let cc = b + 1; cc < 5; cc++) tat.push([a, b, cc]);
        const dung = tat.filter(t => thangHang(...t)), sai = tron(tat.filter(t => !thangHang(...t))).slice(0, 3);
        const ds = [dung[0]].concat(sai);
        return Q.chon('Ba điểm nào <b>thẳng hàng</b>?', ds.map(t => t.map(i => ten[i]).join(', ')), 0, { hinh: { kieu: 'diem', diem: pts }, goiY: ['Thử đặt thước qua từng cặp điểm.'], loiGiai: [`${dung.map(t => t.map(i => ten[i]).join(', ')).join(' và ')} thẳng hàng.`] });
      },
      () => {
        const k = n(4, 6), ten = 'ABCDEFG'.slice(0, k).split('');
        return Q.so(`Có ${k} điểm, trong đó không có ba điểm nào thẳng hàng. Kẻ đoạn thẳng nối từng cặp hai điểm. Kẻ được tất cả bao nhiêu đoạn thẳng?`, k * (k - 1) / 2, {
          hinh: { kieu: 'diem', diem: ten.map((t, i) => ({ x: 150 + 100 * Math.cos(2 * Math.PI * i / k - Math.PI / 2), y: 82 + 62 * Math.sin(2 * Math.PI * i / k - Math.PI / 2), ten: t })) },
          goiY: [{ hoi: `Từ ${ten[0]} kẻ được mấy đoạn?`, dap: k - 1 }, { hoi: `Từ ${ten[1]} kẻ thêm được mấy đoạn mới?`, dap: k - 2 }, 'Tiếp tục rồi cộng lại.'],
          loiGiai: [lap(k - 1, i => k - 1 - i).join(' + ') + ` = ${k * (k - 1) / 2}`]
        });
      }
    ]
  });

  /* ================= Đường gấp khúc ================= */
  const ENG = 'ABCDE';
  function gapKhuc(dai) {
    const pts = dai.length + 1, ds = lap(pts, i => ({ x: 25 + i * 250 / (pts - 1), y: i % 2 ? 40 : 125, ten: ENG[i], dy: i % 2 ? -12 : 26 }));
    return { kieu: 'diem', diem: ds, doan: dai.map((d, i) => [i, i + 1, d == null ? '?' : d + ' cm']) };
  }
  CT.them({
    id: 'duong-gap-khuc', dao: 'hinh', ten: 'Đường gấp khúc', bieu: '〰️',
    ghiNho: `<p><b>Độ dài đường gấp khúc</b> bằng tổng độ dài các đoạn thẳng của nó.</p>
      <p>Ví dụ: đường gấp khúc ABCD có AB = 3 cm, BC = 4 cm, CD = 5 cm. Độ dài là 3 + 4 + 5 = 12 (cm).</p>`,
    cap: [
      () => { const d = lap(n(2, 3), () => n(2, 9)), ten = ENG.slice(0, d.length + 1); return Q.so(`Tính độ dài đường gấp khúc ${ten}.`, T.tong(d), { donVi: 'cm', hinh: gapKhuc(d), loiGiai: [`${d.join(' + ')} = ${T.tong(d)} (cm)`] }); },
      () => {
        if (Math.random() < 0.5) { const k = n(3, 4), m = n(2, 9), ten = ENG.slice(0, k + 1); return Q.so(`Đường gấp khúc ${ten} gồm ${k} đoạn thẳng, mỗi đoạn dài ${m} cm. Độ dài đường gấp khúc là:`, k * m, { donVi: 'cm', hinh: gapKhuc(lap(k, () => m)), loiGiai: [`${lap(k, () => m).join(' + ')} = ${k * m} (cm)`] }); }
        const d = lap(3, () => n(3, 15)), tong = T.tong(d), an = n(0, 2), hien = d.map((x, i) => i === an ? null : x);
        return Q.so(`Đường gấp khúc ABCD dài ${tong} cm. Tìm độ dài đoạn còn thiếu.`, d[an], { donVi: 'cm', hinh: gapKhuc(hien), goiY: [{ hoi: 'Tổng hai đoạn đã biết là?', dap: tong - d[an] }, 'Lấy độ dài cả đường trừ đi tổng hai đoạn đã biết.'], loiGiai: [`${hien.filter(x => x != null).join(' + ')} = ${tong - d[an]}`, `${tong} − ${tong - d[an]} = ${d[an]} (cm)`] });

      () => {

          loiGiai: [`Đường kiến: ${d.join(' + ')} = ${T.tong(d)} (cm)`, `${T.tong(d)} − ${dt} = ${T.tong(d) - dt} (cm)`]
        });
      }
    ]
  });

  /* ================= Đếm hình ================= */
  CT.them({
    id: 'dem-hinh', dao: 'hinh', ten: 'Đếm hình', bieu: '🔍',
    ghiNho: `<p>Đếm hình <b>có thứ tự</b> để không sót:</p>
      <p>1. Đếm các hình <b>đơn</b> (nhỏ nhất).<br>2. Đếm hình ghép từ <b>2</b> hình đơn.<br>3. Đếm hình ghép từ <b>3</b> hình đơn… rồi cộng tất cả lại.</p>
      <p>Ví dụ hình có 3 hình đơn xếp liền nhau: 3 + 2 + 1 = 6 hình.</p>`,
    cap: [
      () => Q.so('Hình dưới đây có bao nhiêu hình tam giác?', 3, { hinh: { kieu: 'quat', k: 3 }, goiY: [{ hoi: 'Có mấy tam giác nhỏ (đơn)?', dap: 2 }, { hoi: 'Có mấy tam giác ghép từ 2 tam giác nhỏ?', dap: 1 }], loiGiai: ['Tam giác đơn: ABC, ACD → 2.', 'Tam giác ghép: ABD → 1.', '2 + 1 = 3 hình tam giác.'] }),
      () => {
        if (Math.random() < 0.5) return Q.so('Hình dưới đây có bao nhiêu hình tam giác?', 6, { hinh: { kieu: 'quat', k: 4 }, goiY: [{ hoi: 'Có mấy tam giác đơn?', dap: 3 }, { hoi: 'Ghép 2 tam giác đơn được mấy hình?', dap: 2 }, { hoi: 'Ghép 3 tam giác đơn được mấy hình?', dap: 1 }], loiGiai: ['3 + 2 + 1 = 6 hình tam giác.'] });
        const k = 3; return Q.so('Hình dưới đây có bao nhiêu hình tứ giác?', 6, { hinh: { kieu: 'oDoc', k }, goiY: [{ hoi: 'Có mấy hình đơn?', dap: 3 }, { hoi: 'Ghép 2 hình đơn liền nhau được mấy hình?', dap: 2 }, { hoi: 'Ghép cả 3 được mấy hình?', dap: 1 }], loiGiai: ['3 + 2 + 1 = 6 hình tứ giác.'] });
      },
      () => {
        const k = n(4, 5), tg = Math.random() < 0.5, soDon = tg ? k : k;
        const kq = soDon * (soDon + 1) / 2;
        const goi = lap(soDon, i => ({ hoi: i === 0 ? 'Có mấy hình đơn?' : `Ghép ${i + 1} hình đơn liền nhau được mấy hình?`, dap: soDon - i }));
        return Q.so(`Hình dưới đây có bao nhiêu hình ${tg ? 'tam giác' : 'tứ giác'}?`, kq, { hinh: tg ? { kieu: 'quat', k: k + 1 } : { kieu: 'oDoc', k }, goiY: goi.slice(0, 3).concat(['Cộng tất cả lại.']), loiGiai: [lap(soDon, i => soDon - i).join(' + ') + ` = ${kq}`], saiThuong: { [soDon]: 'Con mới đếm hình đơn thôi. Còn các hình ghép nữa.' } });
      }
    ]
  });

        if (a + b >= dua) return Q.so(`Mai mua một cái bút giá ${a} đồng. Mai đưa cô bán hàng tờ 1 000 đồng. Hỏi cô bán hàng phải trả lại Mai bao nhiêu tiền?`, dua - a, { donVi: 'đồng', loiGiai: [`1 000 − ${a} = ${dua - a} (đồng)`] });
        return Q.giaiToan({ de: `Mai mua một cái bút giá ${a} đồng và một quyển vở giá ${b} đồng. Mai đưa cô bán hàng tờ 1 000 đồng. Hỏi cô bán hàng phải trả lại Mai bao nhiêu tiền?`, phep: [{ hoi: 'số tiền Mai phải trả', a, dau: '+', b, kq: a + b }, { hoi: 'số tiền cô trả lại Mai', a: dua, dau: '−', b: a + b, kq: dua - a - b }], donVi: 'đồng', goiY: ['Tính số tiền phải trả trước.'] });
      }
    ]
  });

  /* ================= Cộng, trừ trong phạm vi 1000 ================= */
  function capTron(cong) { const a = n(1, 8) * 100, b = n(1, cong ? 9 - a / 100 : a / 100) * 100; return cong ? [a, b] : [Math.max(a, b), Math.min(a, b)]; }
  function cap3(cong, nho) {
    for (; ;) {
      const a = n(110, 899), b = n(10, cong ? 999 - a : a - 1);
      const dv = cong ? a % 10 + b % 10 >= 10 : a % 10 < b % 10;
      const ch = cong ? Math.floor(a / 10) % 10 + Math.floor(b / 10) % 10 + (dv ? 1 : 0) >= 10 : (Math.floor(a / 10) % 10) - (dv ? 1 : 0) < Math.floor(b / 10) % 10;
      if (ch) continue;                // lớp 2 chỉ nhớ một lần (hàng đơn vị sang hàng chục)
      if (nho !== dv) continue;
      if (cong && a + b > 999) continue;
      return [a, b];
    }
  }
  function tinh1000(cong) {
    return [
      () => { const [a, b] = capTron(cong); return Q.so(`<div class="dong-tinh">${a} ${cong ? '+' : '−'} ${b} = [[0]]</div>`, cong ? a + b : a - b, { goiY: [`${a / 100} trăm ${cong ? '+' : '−'} ${b / 100} trăm = ? trăm`], loiGiai: [`${a / 100} trăm ${cong ? '+' : '−'} ${b / 100} trăm = ${(cong ? a + b : a - b) / 100} trăm = ${cong ? a + b : a - b}`] }); },
      () => { const [a, b] = cap3(cong, false), kq = cong ? a + b : a - b; return Q.o('Đặt tính rồi tính:', String(kq).split('').map(Number), { hinh: CT.datTinh(a, b, cong ? '+' : '−', kq, true), goiY: ['Tính từ hàng đơn vị, đến hàng chục, rồi hàng trăm.'], loiGiai: [`${a} ${cong ? '+' : '−'} ${b} = ${kq}`] }); },
      () => {
        const [a, b] = cap3(cong, true), kq = cong ? a + b : a - b;
        if (Math.random() < 0.5) return Q.o('Đặt tính rồi tính (có nhớ):', String(kq).split('').map(Number), { hinh: CT.datTinh(a, b, cong ? '+' : '−', kq, true), goiY: [cong ? `Hàng đơn vị: ${a % 10} + ${b % 10} = ${a % 10 + b % 10}, viết ${(a % 10 + b % 10) % 10} nhớ 1.` : `Hàng đơn vị: ${a % 10} không trừ được ${b % 10}, lấy ${a % 10 + 10} − ${b % 10} = ${a % 10 + 10 - b % 10}, nhớ 1.`], loiGiai: [`${a} ${cong ? '+' : '−'} ${b} = ${kq}`] });
        return cong ? Q.giaiToan({ de: `Trường em có ${a} học sinh nam và ${b} học sinh nữ. Hỏi trường em có tất cả bao nhiêu học sinh?`, phep: [{ hoi: 'số học sinh của trường em', a, dau: '+', b, kq }], donVi: 'học sinh' })
          : Q.giaiToan({ de: `Một cửa hàng có ${a} kg gạo, đã bán ${b} kg gạo. Hỏi cửa hàng còn lại bao nhiêu ki-lô-gam gạo?`, phep: [{ hoi: 'số ki-lô-gam gạo còn lại', a, dau: '−', b, kq }], donVi: 'kg' });
      }
    ];
  }
  CT.them({ id: 'cong-1000', dao: 'cong1000', ten: 'Phép cộng trong phạm vi 1000', bieu: '➕', ghiNho: `<p>Đặt tính thẳng hàng: trăm dưới trăm, chục dưới chục, đơn vị dưới đơn vị.</p><p>Tính từ phải sang trái. Hàng nào cộng được 10 trở lên thì <b>viết chữ số hàng đơn vị, nhớ 1</b> sang hàng bên trái.</p><p>Cộng số tròn trăm: 300 + 400 = 3 trăm + 4 trăm = 7 trăm = 700.</p>`, cap: tinh1000(true) });
  CT.them({ id: 'tru-1000', dao: 'cong1000', ten: 'Phép trừ trong phạm vi 1000', bieu: '➖', ghiNho: `<p>Đặt tính thẳng hàng rồi trừ từ phải sang trái.</p><p>Hàng đơn vị không trừ được thì <b>mượn 1 chục</b> (thêm 10), rồi <b>nhớ 1</b> vào số trừ ở hàng chục.</p><p>Thử lại: hiệu + số trừ = số bị trừ.</p>`, cap: tinh1000(false) });

  /* ================= Biểu đồ tranh ================= */
  const LOAI_BD = [{ ten: ['Táo', 'Cam', 'Chuối', 'Lê'], bieu: ['🍎', '🍊', '🍌', '🍐'], de: 'Số quả mỗi loại trong giỏ', dv: 'quả' }, { ten: ['Thỏ', 'Gà', 'Vịt', 'Mèo'], bieu: ['🐰', '🐔', '🦆', '🐱'], de: 'Số con vật trong vườn', dv: 'con' }];
  CT.them({

    cap: [
      () => { const L = c(LOAI_BD), so = lap(4, () => n(2, 8)), i = n(0, 3); return Q.so(`Có bao nhiêu ${L.dv} ${L.ten[i].toLowerCase()}?`, so[i], { hinh: { kieu: 'bieuDo', hang: L.ten.map((t, k) => ({ ten: t, bieu: L.bieu[k], so: so[k] })), chuThich: L.de + ' (mỗi hình là 1 ' + L.dv + ')' }, loiGiai: [`Hàng ${L.ten[i]} có ${so[i]} hình.`] }); },
      () => {
        const L = c(LOAI_BD); let so; do { so = lap(4, () => n(2, 9)); } while (new Set(so).size < 4);

        if (Math.random() < 0.5) { const nhieu = Math.random() < 0.5, kq = so.indexOf(nhieu ? Math.max(...so) : Math.min(...so)); return Q.chon(`Loại nào có <b>${nhieu ? 'nhiều' : 'ít'} nhất</b>?`, L.ten, kq, { giuThuTu: true, cot: 4, hinh, loiGiai: [`${L.ten[kq]}: ${so[kq]} ${L.dv}.`] }); }
        const [i, j] = tron([0, 1, 2, 3]).slice(0, 2), lon = so[i] > so[j] ? i : j, be = lon === i ? j : i;
        return Q.so(`${L.ten[lon]} nhiều hơn ${L.ten[be].toLowerCase()} bao nhiêu ${L.dv}?`, so[lon] - so[be], { hinh, goiY: [{ hoi: `Có mấy ${L.ten[lon].toLowerCase()}?`, dap: so[lon] }, { hoi: `Có mấy ${L.ten[be].toLowerCase()}?`, dap: so[be] }], loiGiai: [`${so[lon]} − ${so[be]} = ${so[lon] - so[be]}`] });
      },
      () => {
        const L = c(LOAI_BD), so = lap(4, () => n(2, 9)), hinh = { kieu: 'bieuDo', hang: L.ten.map((t, k) => ({ ten: t, bieu: L.bieu[k], so: so[k] })), chuThich: L.de };
        if (Math.random() < 0.5) return Q.so(`Có tất cả bao nhiêu ${L.dv}?`, T.tong(so), { hinh, goiY: ['Đếm từng hàng rồi cộng lại.'], loiGiai: [`${so.join(' + ')} = ${T.tong(so)}`] });
        const i = n(0, 3), them = n(2, 5);
        return Q.so(`Nếu có thêm ${them} ${L.dv} ${L.ten[i].toLowerCase()} nữa thì ${L.ten[i].toLowerCase()} có tất cả bao nhiêu ${L.dv}?`, so[i] + them, { hinh, goiY: [{ hoi: `Bây giờ có mấy ${L.ten[i].toLowerCase()}?`, dap: so[i] }], loiGiai: [`${so[i]} + ${them} = ${so[i] + them}`] });
      }
    ]
  });

  /* ================= Chắc chắn, có thể, không thể ================= */
  const KN = ['Chắc chắn', 'Có thể', 'Không thể'];
  CT.them({
    id: 'kha-nang', dao: 'thongke', ten: 'Chắc chắn, có thể, không thể', bieu: '🎲',
    ghiNho: `<p><b>Chắc chắn</b>: luôn luôn xảy ra. <b>Có thể</b>: lúc xảy ra, lúc không. <b>Không thể</b>: không bao giờ xảy ra.</p>
      <p>Hộp toàn bi đỏ: lấy 1 viên <b>chắc chắn</b> là bi đỏ, <b>không thể</b> là bi xanh.</p>
      <p><b>Nâng cao</b> – muốn <b>chắc chắn</b> lấy được bi xanh: nghĩ đến trường hợp <b>xui nhất</b> — lấy hết các bi màu khác trước, rồi thêm 1 viên.</p>`,
    cap: [
      () => {
        const loai = n(0, 2), soDo = n(3, 6), soXanh = loai === 0 ? 0 : n(2, 5);
        const bi = loai === 0 ? [['🔴', soDo]] : [['🔴', soDo], ['🔵', soXanh]];
        const hoiMau = loai === 2 ? c(['🔴', '🟡']) : '🔴';
        const kq = loai === 0 ? 0 : loai === 2 && hoiMau === '🟡' ? 2 : 1;
        return Q.chon(`Không nhìn, lấy 1 viên bi trong hộp. ${'Lấy được bi ' + (hoiMau === '🔴' ? 'đỏ' : 'vàng')} là:`, KN, kq, { giuThuTu: true, cot: 3, hinh: { kieu: 'hop', bi }, loiGiai: [kq === 0 ? 'Hộp toàn bi đỏ nên chắc chắn lấy được bi đỏ.' : kq === 1 ? 'Hộp có cả bi đỏ và bi xanh nên có thể lấy được bi đỏ.' : 'Hộp không có bi vàng nên không thể lấy được bi vàng.'] });
      },
      () => {
        const cau = c([['Ngày mai mặt trời mọc ở phía đông.', 0], ['Hôm nay trời có mưa.', 1], ['Con mèo biết bay lên trời.', 2], ['Gieo xúc xắc được mặt 7 chấm.', 2], ['Gieo xúc xắc được mặt 6 chấm.', 1], ['Sau thứ hai là thứ ba.', 0], ['Em được điểm 10 bài kiểm tra tới.', 1], ['Tháng 2 có 32 ngày.', 2]]);
        return Q.chon(`“${cau[0]}” — sự việc này:`, KN, cau[1], { giuThuTu: true, cot: 3, loiGiai: [`${KN[cau[1]]} xảy ra.`] });
      },
      () => {
        const soDo = n(2, 6), soXanh = n(2, 6), muon = c(['xanh', 'đỏ']);
        const kq = (muon === 'xanh' ? soDo : soXanh) + 1;
        return Q.so(`Hộp có ${soDo} bi đỏ và ${soXanh} bi xanh. Không nhìn vào hộp, phải lấy ít nhất bao nhiêu viên bi để <b>chắc chắn</b> có 1 viên bi ${muon}?`, kq, {
          donVi: 'viên bi', hinh: { kieu: 'hop', bi: [['🔴', soDo], ['🔵', soXanh]] },
          goiY: ['Nghĩ đến trường hợp xui nhất: lấy mãi mà chưa được màu mình cần.', { hoi: `Xui nhất là lấy hết bi ${muon === 'xanh' ? 'đỏ' : 'xanh'} trước. Có mấy viên như vậy?`, dap: muon === 'xanh' ? soDo : soXanh }, 'Lấy thêm 1 viên nữa thì chắc chắn được màu cần.'],
          loiGiai: [`Xui nhất: lấy hết ${muon === 'xanh' ? soDo + ' bi đỏ' : soXanh + ' bi xanh'} trước.`, `Lấy thêm 1 viên: ${kq - 1} + 1 = ${kq} (viên bi)`], saiThuong: { 1: 'Lấy 1 viên có thể được, nhưng chưa chắc chắn. Nghĩ trường hợp xui nhất.', [kq - 1]: 'Gần đúng! Lấy hết màu kia rồi, cần thêm 1 viên nữa.' }
        });
      }
    ]
  });
})();

<script>
/* ---- js/de-tham-tu.js ---- */
/* Đảo Thám Tử — các dạng tư duy nâng cao xuất hiện trên phiếu bài tập: suy luận so sánh, khoảng cách (±1),
   quy luật dãy số, bài toán tuổi. */
(function () {
  'use strict';
  const { n, c, tron, lap } = T;
  const hoa = s => s.charAt(0).toUpperCase() + s.slice(1);
  const BA = [['An', 'Bình', 'Căn'], ['Lan', 'Mai', 'Hoa'], ['Nam', 'Minh', 'Hùng']];

  /* ================= Suy luận so sánh ================= */
  CT.them({
    id: 'suy-luan', dao: 'thamtu', ten: 'Suy luận so sánh', bieu: '🧠',

      () => {

          loiGiai: [`${B}: ${a} + ${d1} = ${b} (hòn bi)`, `${C}: ${b} + ${d2} = ${cc} (hòn bi)`], saiThuong: { [a - d1 - d2]: `${A} ít hơn, vậy ${B} và ${C} phải nhiều hơn.` }
        });

        () => {
          const [A, B] = c(BA), k = n(2, 6), tong = k + n(3, 9);

            goiY: [`${A} cho đi ${k} quả thì hết. Vậy lúc đầu ${A} có mấy quả?`, { hoi: `${A} có mấy quả?`, dap: k }, { hoi: `${B}: ${tong} − ${k} = ?`, dap: tong - k }],
            loiGiai: [`${A} cho ${k} quả thì hết → ${A} có ${k} quả.`, `${B} có: ${tong} − ${k} = ${tong - k} (quả)`]
          });
        },
        () => {
          const [A, B] = c(BA), k = n(2, 6), b = n(5, 15), a = b + 2 * k;
          return Q.so(`${A} có ${a} cái kẹo. Nếu ${A} cho ${B} ${k} cái kẹo thì số kẹo của hai bạn bằng nhau. Hỏi lúc đầu ${B} có bao nhiêu cái kẹo?`, b, {
            donVi: 'cái kẹo', goiY: [{ hoi: `Sau khi cho, ${A} còn mấy cái?`, dap: a - k }, `Lúc đó ${B} cũng có ${a - k} cái — sau khi đã nhận thêm ${k} cái.`, { hoi: `Lúc đầu ${B} có: ${a - k} − ${k} = ?`, dap: b }],
            loiGiai: [`${A} còn: ${a} − ${k} = ${a - k} (cái)`, `${B} sau khi nhận có ${a - k} cái.`, `Lúc đầu ${B} có: ${a - k} − ${k} = ${b} (cái kẹo)`], saiThuong: { [a - k]: `Đó là số kẹo của ${B} sau khi đã nhận thêm ${k} cái.` }
          });
        },
        () => {
          const [A, B, C] = c(BA), D = 'Hương', nhieu = Math.random() < 0.5;
          return Q.chon(`Số tuổi của ${A} và ${B} cộng lại bằng số tuổi của ${C} và ${D} cộng lại. ${A} ${nhieu ? 'nhiều' : 'ít'} tuổi hơn ${C}. Hỏi ${B} nhiều tuổi hơn hay ít tuổi hơn ${D}?`, [`${B} nhiều tuổi hơn ${D}`, `${B} ít tuổi hơn ${D}`, `${B} bằng tuổi ${D}`], nhieu ? 1 : 0, {
            giuThuTu: true, goiY: ['Hai tổng bằng nhau giống như cân thăng bằng.', `Bên ${A} nặng hơn bên ${C} thì bên ${B} phải thế nào để hai bên vẫn bằng nhau?`, 'Thử bằng số: 5 + 3 = 4 + 4.'],
            loiGiai: [`${A} + ${B} = ${C} + ${D}.`, `${A} ${nhieu ? 'nhiều' : 'ít'} hơn ${C} nên ${B} phải ${nhieu ? 'ít' : 'nhiều'} hơn ${D}.`]
          });
        },
        () => {
          const ss = c([[9, 'số lớn nhất có một chữ số', 10, 'số nhỏ nhất có hai chữ số khác nhau', 1], [9, 'số lớn nhất có một chữ số', 11, 'số bé nhất có hai chữ số giống nhau', 2], [9, 'số lớn nhất có một chữ số', 10, 'số nhỏ nhất có hai chữ số khác nhau', 2], [8, 'số liền trước của số lớn nhất có một chữ số', 11, 'số bé nhất có hai chữ số giống nhau', 1]]);
          const tuoiAnh = ss[2] - ss[4];
          const kq = ss[0] === tuoiAnh ? 2 : ss[0] > tuoiAnh ? 0 : 1;

  /* ================= Khoảng cách: cầu thang, trồng cây, cưa gỗ (Phiếu Tuần 5 bài 16, 19, 20) ================= */

    cap: [
      () => { const d = n(2, 5), a = n(1, 20), cong = Math.random() < 0.7; const ds = lap(6, i => cong ? a + i * d : a + 5 * d - i * d); return Q.o(`Điền số tiếp theo vào dãy:<div class="dong-tinh">${ds.slice(0, 4).join(', ')}, [[0]], [[1]]</div>`, ds.slice(4), { goiY: [{ hoi: `${ds[1]} ${cong ? '−' : '−'} ${ds[0]} = ? (hai số liền nhau hơn kém bao nhiêu)`, dap: Math.abs(ds[1] - ds[0]) }], loiGiai: [`Mỗi số ${cong ? 'hơn' : 'kém'} số trước ${d} đơn vị: ${ds.join(', ')}`] }); },

        () => { const nhom = c([['🔴', '🔵'], ['🔴', '🔵', '🔵'], ['⭐', '🌙', '☀️'], ['🍎', '🍎', '🍌']]), dai = nhom.length, vt = n(10, 15); const ds = lap(8, i => nhom[i % dai]); const dung = nhom[(vt - 1) % dai]; const lc = [...new Set(nhom)]; return Q.chon(`Các hình xếp theo quy luật. Hình thứ <b>${vt}</b> là hình gì?`, lc.map(x => `<span class="bieu-to">${x}</span>`), lc.indexOf(dung), { giuThuTu: true, cot: lc.length, hinh: { kieu: 'hang', ds: ds.concat(['…']) }, goiY: [`Nhóm lặp lại có ${dai} hình: ${nhom.join('')}.`, 'Đếm tiếp theo từng nhóm cho đến hình thứ ' + vt + '.'], loiGiai: [`Nhóm ${nhom.join('')} lặp lại. Hình thứ ${vt} là ${dung}.`] }); },
        () => { const a = n(1, 5); const ds = [a]; let d = 1; for (let i = 1; i < 6; i++) { ds.push(ds[i - 1] + d); d++; } return Q.o(`Điền số tiếp theo:<div class="dong-tinh">${ds.slice(0, 4).join(', ')}, [[0]], [[1]]</div>`, ds.slice(4), { goiY: ['Xem khoảng cách giữa các số: +1, +2, +3, …'], loiGiai: [`${ds.join(', ')} (cộng thêm 1, 2, 3, 4, 5)`] }); }
      ])(),
      () => c([
        () => { const d = c([2, 3, 5]), a = n(1, 9), vt = n(8, 12), kq = a + (vt - 1) * d; return Q.so(`Dãy số: ${a}, ${a + d}, ${a + 2 * d}, ${a + 3 * d}, … Số thứ ${vt} của dãy là số nào?`, kq, { goiY: [`Mỗi số hơn số trước ${d}.`, 'Viết tiếp dãy số và đếm cho đến số thứ ' + vt + '.'], loiGiai: [lap(vt, i => a + i * d).join(', '), `Số thứ ${vt} là ${kq}.`] }); },
        () => { const d = c([2, 3, 5]), a = n(1, 9), k = n(8, 15), cuoi = a + (k - 1) * d; return Q.so(`Dãy số ${a}, ${a + d}, ${a + 2 * d}, …, ${cuoi} có bao nhiêu số?`, k, { goiY: ['Viết dãy ra rồi đếm.', `Mẹo: (${cuoi} − ${a}) là bao nhiêu lần ${d}? Rồi cộng 1.`], loiGiai: [lap(k, i => a + i * d).join(', '), `Có ${k} số.`], saiThuong: { [k - 1]: 'Con quên đếm số đầu tiên.' } }); }
      ])()
    ]
  });

  /* ================= Bài toán tuổi ================= */
  CT.them({
    id: 'tuoi', dao: 'thamtu', ten: 'Bài toán tuổi', bieu: '🎂',
    ghiNho: `<p>Mỗi năm, <b>ai cũng thêm 1 tuổi</b>. Sau 3 năm, mỗi người thêm 3 tuổi.</p>
      <p>Vì vậy <b>hai người luôn hơn kém nhau một số tuổi không đổi</b>. Mẹ hơn con 25 tuổi thì 10 năm nữa mẹ vẫn hơn con 25 tuổi.</p>`,
    cap: [
      () => { const t = n(6, 9), k = n(2, 5), sau = Math.random() < 0.5; return Q.so(`Năm nay Lan ${t} tuổi. Hỏi ${k} năm ${sau ? 'nữa' : 'trước'} Lan bao nhiêu tuổi?`, sau ? t + k : t - k, { donVi: 'tuổi', goiY: [sau ? 'Năm sau thì thêm tuổi.' : 'Năm trước thì bớt tuổi.'], loiGiai: [`${t} ${sau ? '+' : '−'} ${k} = ${sau ? t + k : t - k} (tuổi)`] }); },
      () => { const con = n(6, 9), me = con + n(22, 30); return Q.so(`Năm nay con ${con} tuổi, mẹ ${me} tuổi. Hỏi mẹ hơn con bao nhiêu tuổi?`, me - con, { donVi: 'tuổi', loiGiai: [`${me} − ${con} = ${me - con} (tuổi)`] }); },
      () => c([
        () => { const con = n(6, 9), hieu = n(22, 30), k = n(3, 9); return Q.so(`Năm nay mẹ hơn con ${hieu} tuổi. Hỏi ${k} năm nữa mẹ hơn con bao nhiêu tuổi?`, hieu, { donVi: 'tuổi', goiY: ['Sau ' + k + ' năm, mẹ thêm ' + k + ' tuổi, con cũng thêm ' + k + ' tuổi.', 'Thử với số: con 7, mẹ ' + (7 + hieu) + '.'], loiGiai: ['Hai người cùng thêm số tuổi như nhau, nên hiệu số tuổi không đổi.', `Mẹ vẫn hơn con ${hieu} tuổi.`], saiThuong: { [hieu + k]: 'Con cũng lớn thêm ' + k + ' tuổi nữa đấy.' } }); },
        () => { const em = n(5, 8), hon = n(2, 5), k = n(2, 6); return Q.so(`Năm nay em ${em} tuổi, anh hơn em ${hon} tuổi. Hỏi ${k} năm nữa anh bao nhiêu tuổi?`, em + hon + k, { donVi: 'tuổi', goiY: [{ hoi: 'Năm nay anh bao nhiêu tuổi?', dap: em + hon }, `${k} năm nữa thì thêm ${k} tuổi.`], loiGiai: [`Anh năm nay: ${em} + ${hon} = ${em + hon} (tuổi)`, `${k} năm nữa: ${em + hon} + ${k} = ${em + hon + k} (tuổi)`] }); },
        () => { const con = n(5, 9), me = con + n(22, 28), k = n(2, 5); return Q.so(`Năm nay con ${con} tuổi, mẹ ${me} tuổi. Hỏi ${k} năm nữa tổng số tuổi của hai mẹ con là bao nhiêu?`, me + con + 2 * k, { donVi: 'tuổi', goiY: [{ hoi: `${k} năm nữa con bao nhiêu tuổi?`, dap: con + k }, { hoi: `${k} năm nữa mẹ bao nhiêu tuổi?`, dap: me + k }], loiGiai: [`Con: ${con} + ${k} = ${con + k}; mẹ: ${me} + ${k} = ${me + k}`, `Tổng: ${con + k} + ${me + k} = ${me + con + 2 * k} (tuổi)`], saiThuong: { [me + con + k]: 'Cả hai mẹ con đều thêm tuổi, không phải chỉ một người.' } }); }
      ])()
    ]
  });
})();

<script>
/* ---- js/van-ban.js ---- */
/* Đọc bài tập do phụ huynh soạn bằng chữ thường (xem HUONG-DAN.md, mục "Thêm bài của cô").
   VB.phanTich(chuoi) → { ds: [ {id, ten, nguon, cau:[...]} ], loi: ['dòng 12: ...'] } */
(function (g) {
  'use strict';
  const VB = {};
  const boDau = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/đ/g, 'd').replace(/Đ/g, 'D').toLowerCase();
  const KHOA = [
    ['cau-giai', /^cau giai toan\s*:/], ['cau', /^cau\s*\d*\s*:/], ['dap-an', /^dap an\s*:/], ['lua-chon', /^lua chon\s*:/],
    ['goi-y', /^goi y\s*:/], ['cach-giai', /^cach giai\s*:/], ['sai', /^sai thuong gap\s*:/], ['don-vi', /^don vi\s*:/],
    ['loi-giai', /^loi giai\s*:/], ['phep-tinh', /^phep tinh\s*:/], ['dap-so', /^dap so\s*:/], ['nguon', /^nguon\s*:/],
    ['khong-thu-tu', /^khong can thu tu\s*$/], ['tu-cham', /^tu cham\s*$/], ['hinh', /^hinh\s*:/]
  ];
  const docSo = s => { const t = String(s).replace(/[\s .]/g, ''); return /^\d+$/.test(t) ? Number(t) : null; };
  const tachPhep = s => {
    const m = String(s).replace(/\s+/g, ' ').match(/^\s*([\d\s.]+?)\s*([+\-−×x*:\/])\s*([\d\s.]+?)\s*=\s*([\d\s.]+?)\s*(\(.*\))?\s*$/);
    if (!m) return null;
    const dau = { '+': '+', '-': '−', '−': '−', '×': '×', 'x': '×', '*': '×', ':': ':', '/': ':' }[m[2]];
    const a = docSo(m[1]), b = docSo(m[3]), kq = docSo(m[4]);
    if (a == null || b == null || kq == null) return null;
    const dung = dau === '+' ? a + b : dau === '−' ? a - b : dau === '×' ? a * b : b ? a / b : NaN;
    return { a, dau, b, kq, dung: dung === kq };
  };

  VB.phanTich = function (chuoi) {
    const dong = String(chuoi || '').replace(/\r/g, '').split('\n');
    const ds = [], loi = [];
    let phieu = null, cau = null, khoaTruoc = null;

    function moPhieu(ten) { phieu = { id: 'p-' + boDau(ten).replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') + '-' + ds.length, ten, nguon: '', cau: [] }; ds.push(phieu); }
    function dongCau() {
      if (!cau) return;
      const q = dungCau(cau, loi);
      if (q) { if (!phieu) moPhieu('Bài của cô'); phieu.cau.push(q); }
      cau = null;
    }

    dong.forEach((raw, i) => {
      const s = raw.replace(/^\s*[-•]\s+/, '').trim();
      if (!s || s.startsWith('//')) { if (!s) khoaTruoc = null; return; }
      if (s.startsWith('#')) { dongCau(); moPhieu(s.replace(/^#+\s*/, '')); return; }
      const kd = boDau(s);
      const k = KHOA.find(([, re]) => re.test(kd));
      if (!k) {
        if (cau && (khoaTruoc === 'cau' || khoaTruoc === 'cau-giai')) { cau.de += '<br>' + T.esc(s); return; }
        if (cau && khoaTruoc === 'goi-y') { cau.goiY[cau.goiY.length - 1] += ' ' + s; return; }
        if (cau && khoaTruoc === 'cach-giai') { cau.cachGiai.push(s); return; }
        loi.push(`Dòng ${i + 1}: không hiểu “${s.slice(0, 40)}”. Dòng phải bắt đầu bằng Câu:, Đáp án:, Gợi ý:…`); return;
      }
      const giaTri = s.replace(/^[^:]*:\s*/, '').trim();
      khoaTruoc = k[0];
      switch (k[0]) {
        case 'cau': case 'cau-giai':
          dongCau();
          cau = { dong: i + 1, giaiToan: k[0] === 'cau-giai', de: T.esc(giaTri), dapAn: null, luaChon: null, goiY: [], cachGiai: [], sai: {}, donVi: '', loiGiai: [], phepTinh: [], dapSo: null, khongThuTu: false, tuCham: false, hinh: '' };
          break;
        case 'nguon': if (phieu) phieu.nguon = giaTri; break;
        default:
          if (!cau) { loi.push(`Dòng ${i + 1}: “${s.slice(0, 30)}” phải nằm sau một dòng Câu:`); return; }
          if (k[0] === 'dap-an') cau.dapAn = giaTri;
          else if (k[0] === 'lua-chon') cau.luaChon = giaTri.split('|').map(x => x.trim()).filter(Boolean);
          else if (k[0] === 'goi-y') cau.goiY.push(giaTri);
          else if (k[0] === 'cach-giai') cau.cachGiai.push(giaTri);
          else if (k[0] === 'sai') { const m = giaTri.match(/^(\d+)\s*=>\s*(.+)$/); if (m) cau.sai[m[1]] = m[2]; else loi.push(`Dòng ${i + 1}: viết “Sai thường gặp: 15 => lời nhắc”`); }
          else if (k[0] === 'don-vi') cau.donVi = giaTri;
          else if (k[0] === 'loi-giai') cau.loiGiai.push(giaTri);
          else if (k[0] === 'phep-tinh') cau.phepTinh.push(giaTri);
          else if (k[0] === 'dap-so') cau.dapSo = giaTri;
          else if (k[0] === 'khong-thu-tu') cau.khongThuTu = true;
          else if (k[0] === 'tu-cham') cau.tuCham = true;
          else if (k[0] === 'hinh') cau.hinh = giaTri;
      }
    });
    dongCau();
    return { ds: ds.filter(p => p.cau.length), loi };
  };

  function goiYTuChu(ds) {
    return ds.map(x => { const m = x.match(/^(.*?)\s*=\s*(\d[\d\s]*)\s*$/); return m ? { hoi: m[1], dap: docSo(m[2]) } : x; });
  }

  function dungCau(c, loi) {
    const bao = m => loi.push(`Câu ở dòng ${c.dong}: ${m}`);
    const chung = { goiY: goiYTuChu(c.goiY), loiGiai: c.cachGiai.slice(), nguonPhieu: true };
    if (c.hinh) chung.hinh = { kieu: 'chu', chu: `<div class="bieu-to">${T.esc(c.hinh)}</div>` };
    if (Object.keys(c.sai).length) chung.saiThuong = c.sai;

    /* --- Bài giải toán có lời văn --- */
    if (c.giaiToan || c.phepTinh.length) {
      const phep = [];
      for (let i = 0; i < c.phepTinh.length; i++) {
        const p = tachPhep(c.phepTinh[i]);
        if (!p) { bao(`không đọc được phép tính “${c.phepTinh[i]}” (viết như 43 + 5 = 48)`); return null; }
        if (!p.dung) { bao(`phép tính “${c.phepTinh[i]}” chưa đúng`); return null; }
        phep.push(Object.assign(p, { cau: c.loiGiai[i] || '' }));
      }
      if (!phep.length) { bao('bài giải toán cần ít nhất một dòng Phép tính:'); return null; }
      const ds = String(c.dapSo || '').match(/^\s*([\d\s.]+)\s*(.*?)\.?\s*$/);
      const donVi = ds ? ds[2] : c.donVi;
      const dapSo = ds ? docSo(ds[1]) : phep[phep.length - 1].kq;
      const q = Q.giaiToan({
        de: c.de, donVi: donVi || '', dapSo,
        phep: phep.map(p => ({ hoi: p.cau ? p.cau.replace(/\s*là\s*:?\s*$/i, '').replace(/^./, x => x.toLowerCase()) : 'kết quả', cau: p.cau, a: p.a, dau: p.dau, b: p.b, kq: p.kq })),
        goiY: chung.goiY,
        loiGiai: chung.loiGiai.length ? chung.loiGiai : undefined
      });
      if (chung.hinh) q.hinh = chung.hinh;
      return Object.assign(q, { nguonPhieu: true });
    }

    /* --- Tự chấm (bài vẽ, bài giải thích) --- */
    if (c.tuCham || (c.dapAn != null && !c.luaChon && docSo(c.dapAn) == null && !/[;,]/.test(c.dapAn))) {
      return Object.assign({ loai: 'tuCham', de: c.de, dapAnChu: c.dapAn || '' }, chung, { loiGiai: chung.loiGiai.length ? chung.loiGiai : [c.dapAn || ''] });
    }
    if (c.dapAn == null) { bao('thiếu dòng Đáp án:'); return null; }

    /* --- Chọn đáp án --- */
    if (c.luaChon) {
      const da = c.dapAn.trim();
      let idx = c.luaChon.findIndex(x => boDau(x) === boDau(da));
      if (idx < 0 && /^[A-Ha-h]$/.test(da)) idx = da.toUpperCase().charCodeAt(0) - 65;
      if (idx < 0 || idx >= c.luaChon.length) { bao(`đáp án “${da}” không có trong Lựa chọn`); return null; }
      return Object.assign(Q.chon(c.de, c.luaChon.map(T.esc), idx, { giuThuTu: true }), chung, { loiGiai: chung.loiGiai.length ? chung.loiGiai : [`Đáp án: ${c.luaChon[idx]}`] });
    }

    /* --- Điền số --- */
    const so = c.dapAn.split(/[;,]/).map(docSo);
    if (so.some(x => x == null)) { bao(`đáp án “${c.dapAn}” phải là số (nhiều số thì cách nhau bằng dấu ; hoặc ,)`); return null; }
    let de = c.de, k = 0;
    de = de.replace(/□|\[\s*\]|\.{3,}|…/g, () => `[[${k++}]]`);
    const loiGiai = chung.loiGiai.length ? chung.loiGiai : ['Đáp án: ' + so.join('; ')];
    if (k && k !== so.length) { bao(`đề có ${k} ô trống nhưng đáp án có ${so.length} số`); return null; }
    if (!k) {
      if (so.length === 1) return Object.assign(Q.so(de, so[0], { donVi: c.donVi }), chung, { loiGiai });
      de += `<div class="dong-tinh">${so.map((_, i) => `[[${i}]]`).join(' ; ')}</div>`;
    }
    if (so.length === 1) return Object.assign(Q.so(de, so[0], { donVi: c.donVi }), chung, { loiGiai });
    const q = Object.assign(Q.o(de, so), chung, { loiGiai });
    if (c.khongThuTu) q.khongThuTu = true;
    return q;
  }

  /* Mẫu dùng cho nút "Chèn mẫu" ở Góc phụ huynh */
  VB.MAU = {
    so: 'Câu: Lấy hiệu của 25 và 12 rồi cộng với 36 được kết quả là:\nĐáp án: 49\nGợi ý: Hiệu của 25 và 12 là bao nhiêu? = 13\nGợi ý: Lấy 13 cộng với 36 được bao nhiêu? = 49\nCách giải: 25 − 12 = 13\nCách giải: 13 + 36 = 49\n',
    o: 'Câu: Điền số: 9 + □ = 7 + 8\nĐáp án: 6\nGợi ý: 7 + 8 bằng bao nhiêu? = 15\nCách giải: 7 + 8 = 15; 9 + 6 = 15\n',
    nhieu: 'Câu: Tìm hai số tự nhiên liên tiếp mà tổng của chúng là số lớn nhất có một chữ số.\nĐáp án: 4; 5\nKhông cần thứ tự\nGợi ý: Số lớn nhất có một chữ số là? = 9\nCách giải: 4 + 5 = 9\n',
    chon: 'Câu: An + Ba = Hương + Lan. An nhiều tuổi hơn Lan. Hỏi Ba nhiều tuổi hơn hay ít tuổi hơn Hương?\nLựa chọn: Ba nhiều tuổi hơn Hương | Ba ít tuổi hơn Hương | Bằng tuổi nhau\nĐáp án: Ba ít tuổi hơn Hương\nGợi ý: Hai tổng bằng nhau giống như cân thăng bằng.\n',
    giai: 'Câu giải toán: Nhà bạn Tú có một đàn gà. Sau khi mẹ bán đi 5 con gà thì còn lại 43 con gà. Hỏi trước khi bán, nhà bạn Tú có bao nhiêu con gà?\nLời giải: Trước khi bán, nhà bạn Tú có số con gà là:\nPhép tính: 43 + 5 = 48\nĐáp số: 48 con gà\nGợi ý: Đã bán đi thì lúc đầu nhiều hơn hay ít hơn bây giờ?\n',
    tuCham: 'Câu: Vẽ một đường gấp khúc gồm 3 đoạn thẳng vào vở.\nTự chấm\nĐáp án: Ba đoạn thẳng nối tiếp nhau, không cùng nằm trên một đường thẳng.\n'
  };

  g.VB = VB;
})(typeof window !== 'undefined' ? window : globalThis);
