<script>
/* ---- js/kieu-cau.js ---- */
/* Các kiểu câu hỏi tương tác (chạm, kéo thả, bàn phím số trên màn hình).
   KC.ve(cau, khung, ctx) → { canKiem, layGiaTri, daDu, danhDau(kq), hienDapAn, khoa }
   KC.kiem(cau, giaTri) → { dung, chiTiet, loi } */
(function (g) {
  'use strict';
  const KC = {};
  const { $, $$, el } = T;

  /* ---------- Thay ô [[i]] và {{i}} bằng phần tử ---------- */
  KC.oTrong = html => String(html)
    .replace(/\[\[(\d+)\]\]/g, (_, i) => `<span class="o-nhap" data-i="${i}" role="textbox" aria-label="Ô trống ${Number(i) + 1}" tabindex="0"></span>`)
    .replace(/\{\{(\d+)\}\}/g, (_, i) => `<span class="o-tha" data-i="${i}" aria-label="Chỗ thả ${Number(i) + 1}"></span>`);

  /* ================= BÀN PHÍM SỐ ================= */
  const BP = KC.banPhim = {
    goc: null, dangChon: null, khiXong: null,
    tao() {
      this.goc = $('#ban-phim');
      this.goc.innerHTML = `<div class="bp-luoi">${[1, 2, 3, 4, 5, 6, 7, 8, 9].map(k => `<button class="bp-phim" data-k="${k}">${k}</button>`).join('')}
        <button class="bp-phim bp-xoa" data-k="xoa" aria-label="Xoá">⌫</button><button class="bp-phim" data-k="0">0</button><button class="bp-phim bp-ok" data-k="ok" aria-label="Xong">✓</button></div>`;
      this.goc.addEventListener('pointerdown', e => {
        const b = e.target.closest('.bp-phim'); if (!b) return;
        e.preventDefault(); this.bam(b.dataset.k); b.classList.add('nhan'); setTimeout(() => b.classList.remove('nhan'), 120);
      });
      document.addEventListener('keydown', e => {
        if (!this.dangChon || !document.body.contains(this.dangChon) || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT') return;
        if (/^\d$/.test(e.key)) { this.bam(e.key); e.preventDefault(); }
        else if (e.key === 'Backspace') { this.bam('xoa'); e.preventDefault(); }
        else if (e.key === 'Enter') { this.bam('ok'); e.preventDefault(); }
        else if (e.key === 'Tab') { this.chuyen(e.shiftKey ? -1 : 1); e.preventDefault(); }
      });
    },
    nhom() { return this.dangChon ? $$('.o-nhap:not(.khoa)', this.dangChon.closest('.nhom-o') || document) : []; },
    chon(o) {
      $$('.o-nhap.dang-chon').forEach(x => x.classList.remove('dang-chon'));
      this.dangChon = o || null;
      if (o) { o.classList.add('dang-chon'); this.hien(true); }
    },
    chuyen(b) { const ds = this.nhom(), i = ds.indexOf(this.dangChon); if (ds.length) this.chon(ds[(i + b + ds.length) % ds.length]); },
    bam(k) {
      const o = this.dangChon; if (!o || o.classList.contains('khoa')) return;
      T.am.choi('cham');
      if (k === 'ok') { if (o._khiOk) o._khiOk(); return; }
      let s = o.dataset.gt || '';
      if (k === 'xoa') s = s.slice(0, -1);
      else if (s.length < (Number(o.dataset.dai) || 4)) s = (s === '0' ? '' : s) + k;
      o.dataset.gt = s; o.textContent = s; o.classList.remove('sai', 'dung');
      if (o._khiDoi) o._khiDoi(s);
      // tự sang ô kế tiếp khi đã đủ số chữ số của đáp án (nếu biết)
      if (k !== 'xoa' && o.dataset.du && s.length >= Number(o.dataset.du)) {
        const ds = this.nhom(), i = ds.indexOf(o);
        if (i >= 0 && i < ds.length - 1 && !ds[i + 1].dataset.gt) this.chon(ds[i + 1]);
      }
    },
    hien(c) { if (this.goc) this.goc.hidden = !c; document.body.classList.toggle('co-ban-phim', !!c); },
    gan(khung, khiOk) {
      const ds = $$('.o-nhap', khung);
      ds.forEach(o => {
        o._khiOk = khiOk;
        o.addEventListener('pointerdown', e => { e.preventDefault(); this.chon(o); });
        o.addEventListener('focus', () => this.chon(o));
      });
      return ds;
    }
  };

  /* ================= KIỂM TRA ĐÁP ÁN ================= */
  const bang = (a, b) => a.length === b.length && a.every((x, i) => x === b[i]);
  KC.kiem = function (q, v) {
    switch (q.loai) {
      case 'so': case 'chiaDeu': return { dung: v === q.dapAn };
      case 'o': {
        if (q.khongThuTu) {
          const con = q.dapAn.slice(), ct = v.map(x => { const i = con.indexOf(x); if (i >= 0) { con.splice(i, 1); return true; } return false; });
          return { dung: ct.every(Boolean), chiTiet: ct };
        }
        const ds = [q.dapAn].concat(q.dapAnKhac || []);
        const khop = ds.find(d => bang(d, v));
        if (khop) return { dung: true, chiTiet: v.map(() => true) };
        return { dung: false, chiTiet: v.map((x, i) => x === q.dapAn[i] || (q.dapAnKhac || []).some(d => d[i] === x)) };
      }
      case 'chon': return { dung: v === q.dapAn };
      case 'chonNhieu': {
        if (q.kiem === 'tong') { const t = T.tong(v.map(i => q.luaChon[i].gt)); return { dung: t === q.dich, tong: t }; }
        const dung = new Set(q.dung), chon = new Set(v);
        const trung = v.filter(i => dung.has(i)).length, thua = v.length - trung, thieu = q.dung.length - trung;
        return { dung: thua === 0 && thieu === 0, trung, thua, thieu };
      }
      case 'sapXep': { const ct = v.map((x, i) => String(x) === String(q.dapAn[i])); return { dung: ct.every(Boolean) && v.length === q.dapAn.length, chiTiet: ct }; }
      case 'keoTha': { const ct = v.map((x, i) => x === q.dapAn[i]); return { dung: ct.every(Boolean), chiTiet: ct }; }
      case 'dongHo': return { dung: (v.gio % 12) === (q.dapAn.gio % 12) && v.phut === q.dapAn.phut };
      case 'tuCham': return { dung: !!v };
      default: return { dung: false };
    }
  };

  /* ================= VẼ TỪNG KIỂU ================= */
  const VE = {};
  KC.ve = function (q, khung, ctx) {
    const f = VE[q.loai] || VE.so;
    return f(q, khung, ctx);
  };

  function oNhapChung(q, khung, ctx, dapAnDs) {
    const ds = BP.gan(khung, () => ctx.kiemTra());
    ds.forEach(o => { const i = Number(o.dataset.i); if (dapAnDs && dapAnDs[i] != null) { o.dataset.du = String(dapAnDs[i]).length; o.dataset.dai = Math.max(4, String(dapAnDs[i]).length); } });
    if (ds.length) setTimeout(() => BP.chon(ds.find(o => !o.dataset.gt) || ds[0]), 30);
    return ds;
  }
  const giaTriO = o => o.dataset.gt === '' || o.dataset.gt == null ? null : Number(o.dataset.gt);

  /* --- Điền một số / nhiều ô --- */
  VE.so = VE.o = function (q, khung, ctx) {
    const vung = khung.querySelector('.vung-tra-loi');
    const coO = !!khung.querySelector('.o-nhap');
    if (!coO) vung.innerHTML = KC.oTrong(`<div class="dong-tra-loi"><span>Trả lời:</span> [[0]] ${q.donVi ? `<span class="don-vi">${q.donVi}</span>` : ''}</div>`);
    else if (q.donVi) vung.innerHTML = `<div class="ghi-chu">Đơn vị: ${q.donVi}</div>`;
    const dap = q.loai === 'so' ? [q.dapAn] : q.dapAn;
    const ds = oNhapChung(q, khung, ctx, q.khongThuTu ? null : dap).sort((a, b) => a.dataset.i - b.dataset.i);
    return {
      canKiem: true,
      daDu: () => ds.every(o => giaTriO(o) != null),
      layGiaTri: () => q.loai === 'so' ? giaTriO(ds[0]) : ds.map(giaTriO),
      danhDau(kq) {
        if (q.loai === 'so') { ds[0].classList.add(kq.dung ? 'dung' : 'sai'); return; }
        ds.forEach((o, i) => o.classList.add(kq.dung || (kq.chiTiet && kq.chiTiet[i]) ? 'dung' : 'sai'));
      },
      hienDapAn() { ds.forEach((o, i) => { const v = q.loai === 'so' ? q.dapAn : q.dapAn[i]; o.dataset.gt = v; o.textContent = v; o.classList.remove('sai'); o.classList.add('lo'); }); },
      khoa() { ds.forEach(o => o.classList.add('khoa')); BP.chon(null); }
    };
  };

  /* --- Chọn một đáp án --- */
  VE.chon = function (q, khung, ctx) {
    const vung = khung.querySelector('.vung-tra-loi');
    const thuTu = q._thuTu || (q._thuTu = q.giuThuTu ? q.luaChon.map((_, i) => i) : T.tron(q.luaChon.map((_, i) => i)));
    const cot = q.cot || (q.luaChon.length <= 2 ? 2 : q.luaChon.some(x => String(x).length > 26) ? 1 : 2);
    vung.innerHTML = `<div class="lua-chon cot-${cot}">${thuTu.map((i, k) => `<button class="lc" data-i="${i}"><span class="lc-chu">${String.fromCharCode(65 + k)}</span><span class="lc-nd">${q.luaChon[i]}</span></button>`).join('')}</div>`;
    let daKhoa = false;
    $$('.lc', vung).forEach(b => b.addEventListener('click', () => { if (daKhoa || b.classList.contains('sai')) return; ctx.nop(Number(b.dataset.i), b); }));
    return {
      canKiem: false,
      danhDau(kq, v) { const b = vung.querySelector(`.lc[data-i="${v}"]`); if (b) b.classList.add(kq.dung ? 'dung' : 'sai'); },
      hienDapAn() { const b = vung.querySelector(`.lc[data-i="${q.dapAn}"]`); if (b) b.classList.add('lo'); },
      khoa() { daKhoa = true; $$('.lc', vung).forEach(b => b.classList.add('khoa')); }
    };
  };

  /* --- Chọn nhiều ô (bảng số, hình, tờ tiền) --- */
  VE.chonNhieu = function (q, khung, ctx) {
    const vung = khung.querySelector('.vung-tra-loi');
    const nhan = x => typeof x === 'object' && x ? x.nhan : x;
    vung.innerHTML = `<div class="chon-nhieu${q.nho ? ' nho' : ''}" style="--cot:${q.luoi || 4}">${q.luaChon.map((x, i) => `<button class="cn" data-i="${i}" aria-pressed="false">${nhan(x)}</button>`).join('')}</div><div class="ghi-chu dem-chon">Đã chọn: <b>0</b></div>`;
    const dem = $('.dem-chon b', vung);
    let daKhoa = false;
    $$('.cn', vung).forEach(b => b.addEventListener('click', () => {
      if (daKhoa) return; T.am.choi('cham');
      b.classList.toggle('bat'); b.setAttribute('aria-pressed', b.classList.contains('bat'));
      $$('.cn', vung).forEach(x => x.classList.remove('sai', 'dung'));
      dem.textContent = $$('.cn.bat', vung).length;
    }));
    return {
      canKiem: true,
      daDu: () => $$('.cn.bat', vung).length > 0,
      layGiaTri: () => $$('.cn.bat', vung).map(b => Number(b.dataset.i)),
      danhDau(kq) { if (kq.dung) $$('.cn.bat', vung).forEach(b => b.classList.add('dung')); },
      hienDapAn() {
        if (q.kiem === 'tong') return;
        $$('.cn', vung).forEach(b => { const i = Number(b.dataset.i); b.classList.toggle('bat', q.dung.includes(i)); if (q.dung.includes(i)) b.classList.add('lo'); });
      },
      khoa() { daKhoa = true; }
    };
  };

  /* --- Sắp xếp: chạm thẻ để đưa lên hàng trả lời --- */
  VE.sapXep = function (q, khung, ctx) {
    const vung = khung.querySelector('.vung-tra-loi');
    vung.innerHTML = `<div class="hang-xep dich" aria-label="Hàng trả lời">${q.dapAn.map(() => '<span class="cho-trong"></span>').join('')}</div><div class="hang-xep nguon">${q.luaChon.map((x, i) => `<button class="the-xep" data-i="${i}">${x}</button>`).join('')}</div><div class="ghi-chu">Chạm vào số theo thứ tự. Chạm lại để bỏ ra.</div>`;
    const dich = $('.dich', vung), nguon = $('.nguon', vung);
    let daKhoa = false;
    const veLai = () => { const da = $$('.the-xep', dich).length; $$('.cho-trong', dich).forEach((x, i) => { x.hidden = i < da; }); };
    $$('.the-xep', vung).forEach(b => b.addEventListener('click', () => {
      if (daKhoa) return; T.am.choi('cham');
      $$('.the-xep', vung).forEach(x => x.classList.remove('sai', 'dung'));
      if (b.parentElement === nguon) dich.insertBefore(b, dich.querySelector('.cho-trong')); else nguon.appendChild(b);
      veLai();
    }));
    return {
      canKiem: true,
      daDu: () => $$('.the-xep', dich).length === q.luaChon.length,
      layGiaTri: () => $$('.the-xep', dich).map(b => q.luaChon[Number(b.dataset.i)]),
      danhDau(kq) { $$('.the-xep', dich).forEach((b, i) => b.classList.add(kq.dung || (kq.chiTiet && kq.chiTiet[i]) ? 'dung' : 'sai')); },
      hienDapAn() { q.dapAn.forEach(v => { const b = $$('.the-xep', vung).find(x => String(q.luaChon[Number(x.dataset.i)]) === String(v) && !x._xong); b._xong = true; dich.insertBefore(b, dich.querySelector('.cho-trong')); b.classList.remove('sai'); b.classList.add('lo'); }); veLai(); },
      khoa() { daKhoa = true; }
    };
  };

  /* --- Kéo thả thẻ vào ô (có thể chạm thẻ rồi chạm ô) --- */
  VE.keoTha = function (q, khung, ctx) {
    const vung = khung.querySelector('.vung-tra-loi');
    const dungLai = !!q.dungLai;
    vung.innerHTML = `<div class="khay-the">${q.luaChon.map((x, i) => `<button class="the-tha" data-i="${i}" data-gt="${T.esc(x)}">${T.esc(x)}</button>`).join('')}</div><div class="ghi-chu">Kéo thẻ vào ô trống, hoặc chạm thẻ rồi chạm ô.</div>`;
    const oDs = $$('.o-tha', khung).sort((a, b) => a.dataset.i - b.dataset.i);
    let dangCam = null, daKhoa = false;
    const datVao = (o, the) => {
      if (daKhoa) return;
      if (o.dataset.gt && !dungLai && o._the) o._the.hidden = false;
      o.dataset.gt = the.dataset.gt; o.textContent = the.dataset.gt; o._the = the; o.classList.remove('sai', 'dung'); o.classList.add('co');
      if (!dungLai) the.hidden = true;
      T.am.choi('cham');
      $$('.the-tha.cam', vung).forEach(x => x.classList.remove('cam')); dangCam = null;
    };
    oDs.forEach(o => o.addEventListener('click', () => {
      if (daKhoa) return;
      if (dangCam) { datVao(o, dangCam); return; }
      if (o.dataset.gt) { if (!dungLai && o._the) o._the.hidden = false; o.dataset.gt = ''; o.textContent = ''; o.classList.remove('co', 'sai', 'dung'); }
    }));
    $$('.the-tha', vung).forEach(the => {
      the.addEventListener('pointerdown', e => {
        if (daKhoa) return;
        e.preventDefault();
        const x0 = e.clientX, y0 = e.clientY; let bong = null;
        const di = ev => {
          if (!bong && Math.hypot(ev.clientX - x0, ev.clientY - y0) > 6) { bong = the.cloneNode(true); bong.classList.add('bong'); document.body.appendChild(bong); }
          if (bong) { bong.style.left = ev.clientX + 'px'; bong.style.top = ev.clientY + 'px'; oDs.forEach(o => o.classList.remove('sap-tha')); const d = document.elementFromPoint(ev.clientX, ev.clientY); const o = d && d.closest('.o-tha'); if (o) o.classList.add('sap-tha'); }
        };
        const tha = ev => {
          window.removeEventListener('pointermove', di); window.removeEventListener('pointerup', tha); window.removeEventListener('pointercancel', tha);
          oDs.forEach(o => o.classList.remove('sap-tha'));
          if (bong) { bong.remove(); const d = document.elementFromPoint(ev.clientX, ev.clientY); const o = d && d.closest('.o-tha'); if (o && khung.contains(o)) datVao(o, the); }
          else { const dang = the.classList.contains('cam'); $$('.the-tha.cam', vung).forEach(x => x.classList.remove('cam')); if (!dang) { the.classList.add('cam'); dangCam = the; } else dangCam = null; }
        };
        window.addEventListener('pointermove', di); window.addEventListener('pointerup', tha); window.addEventListener('pointercancel', tha);
      });
    });
    return {
      canKiem: true,
      daDu: () => oDs.every(o => o.dataset.gt),
      layGiaTri: () => oDs.map(o => o.dataset.gt),
      danhDau(kq) { oDs.forEach((o, i) => o.classList.add(kq.dung || kq.chiTiet[i] ? 'dung' : 'sai')); },
      hienDapAn() { oDs.forEach((o, i) => { o.dataset.gt = q.dapAn[i]; o.textContent = q.dapAn[i]; o.classList.remove('sai'); o.classList.add('co', 'lo'); }); },
      khoa() { daKhoa = true; }
    };
  };

  /* --- Đồng hồ kéo kim --- */
  VE.dongHo = function (q, khung, ctx) {
    const vung = khung.querySelector('.vung-tra-loi');
    const buoc = q.buocPhut || 5;
    const st = { gio: 12, phut: 0 };
    vung.innerHTML = `<div class="dh-tuong-tac"><div class="dh-khung"></div>
      <div class="dh-nut"><div><span>Giờ</span><button data-k="g-">−</button><b class="dh-g">12</b><button data-k="g+">+</button></div>
      <div><span>Phút</span><button data-k="p-">−</button><b class="dh-p">00</b><button data-k="p+">+</button></div></div></div>`;
    const kh = $('.dh-khung', vung);
    let daKhoa = false;
    const ve = () => { kh.innerHTML = HV.dongHoSvg(st.gio, st.phut, 220); $('.dh-g', vung).textContent = st.gio; $('.dh-p', vung).textContent = String(st.phut).padStart(2, '0'); };
    ve();
    $$('.dh-nut button', vung).forEach(b => b.addEventListener('click', () => {
      if (daKhoa) return; T.am.choi('cham');
      const k = b.dataset.k;
      if (k === 'g+') st.gio = st.gio % 12 + 1; if (k === 'g-') st.gio = (st.gio + 10) % 12 + 1;
      if (k === 'p+') st.phut = (st.phut + buoc) % 60; if (k === 'p-') st.phut = (st.phut - buoc + 60) % 60;
      ve();
    }));
    let keo = null;
    kh.addEventListener('pointerdown', e => {
      if (daKhoa) return;
      const r = kh.getBoundingClientRect(), x = e.clientX - r.left - r.width / 2, y = e.clientY - r.top - r.height / 2;
      keo = Math.hypot(x, y) < r.width * 0.27 ? 'gio' : 'phut'; kh.setPointerCapture(e.pointerId); e.preventDefault();
    });
    kh.addEventListener('pointermove', e => {
      if (!keo) return;
      const r = kh.getBoundingClientRect(), x = e.clientX - r.left - r.width / 2, y = e.clientY - r.top - r.height / 2;
      let goc = Math.atan2(x, -y) * 180 / Math.PI; if (goc < 0) goc += 360;
      if (keo === 'phut') st.phut = (Math.round(goc / 6 / buoc) * buoc) % 60;
      else { st.gio = Math.round(goc / 30) % 12 || 12; }
      ve();
    });
    kh.addEventListener('pointerup', () => { keo = null; });
    return {
      canKiem: true, daDu: () => true,
      layGiaTri: () => ({ gio: st.gio, phut: st.phut }),
      danhDau(kq) { kh.classList.add(kq.dung ? 'dung' : 'sai'); setTimeout(() => kh.classList.remove('sai'), 700); },
      hienDapAn() { st.gio = q.dapAn.gio % 12 || 12; st.phut = q.dapAn.phut; ve(); kh.classList.add('dung'); },
      khoa() { daKhoa = true; }
    };
  };

  /* --- Chia đều vào đĩa (đồ dùng trực quan) + ô trả lời --- */
  VE.chiaDeu = function (q, khung, ctx) {
    const vung = khung.querySelector('.vung-tra-loi');

    const dong = $('.cd-dong', vung);
    const ve = () => {

      $$('.cd-dia', vung).forEach((d, i) => { d.innerHTML = `<span>${Array(dem[i]).fill(`<i>${q.vat}</i>`).join('')}</span><small>${dem[i]}</small>`; });
    };
    ve();
    $$('.cd-dia', vung).forEach(d => d.addEventListener('click', e => {
      const i = Number(d.dataset.i);
      if (e.target.tagName === 'I' && dem[i] > 0) { dem[i]--; con++; } else if (con > 0) { dem[i]++; con--; }
      T.am.choi('cham'); ve();
    }));
    const ds = oNhapChung(q, vung, ctx, [q.dapAn]);
    return {
      canKiem: true,
      daDu: () => giaTriO(ds[0]) != null,
      layGiaTri: () => giaTriO(ds[0]),
      danhDau(kq) { ds[0].classList.add(kq.dung ? 'dung' : 'sai'); },
      hienDapAn() { dem.fill(q.dapAn); con = 0; ve(); ds[0].dataset.gt = q.dapAn; ds[0].textContent = q.dapAn; ds[0].classList.add('lo'); },
      khoa() { ds.forEach(o => o.classList.add('khoa')); BP.chon(null); }
    };
  };

  /* --- Tự chấm: bài làm ra vở --- */
  VE.tuCham = function (q, khung, ctx) {
    const vung = khung.querySelector('.vung-tra-loi');
    vung.innerHTML = `<div class="tu-cham"><p>Con làm bài này ra vở hoặc giấy nháp. Làm xong thì bấm nút dưới đây để so với đáp án.</p>
      <button class="nut nut-phu xem-da">Con làm xong rồi · Xem đáp án</button><div class="tc-da" hidden></div></div>`;
    const da = $('.tc-da', vung);
    $('.xem-da', vung).addEventListener('click', e => {
      e.currentTarget.hidden = true; da.hidden = false;
      da.innerHTML = `<div class="tc-dap"><b>Đáp án:</b> ${T.esc(q.dapAnChu || '')}</div><p>Con so sánh với bài của mình nhé.</p><div class="tc-nut"><button class="nut nut-dung" data-v="1">✓ Con làm đúng</button><button class="nut nut-phu" data-v="0">✗ Con làm chưa đúng</button></div>`;
      $$('.tc-nut button', da).forEach(b => b.addEventListener('click', () => ctx.nop(b.dataset.v === '1', b)));
    });
    return { canKiem: false, danhDau() { }, hienDapAn() { }, khoa() { $$('button', vung).forEach(b => { b.disabled = true; }); } };
  };

  g.KC = KC;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>

(function () {

  /* ===================================================================

  function veDao(id) {

          <div class="tram-cap">${[1, 2, 3].map(c => { const mo = moKhoa(idD, c), s = TD.sao(idD + ':' + c); return `<button class="cap c${c}${mo ? '' : ' khoa'}" data-d="${idD}" data-c="${c}" ${mo ? '' : 'aria-disabled="true"'}><span>${mo ? '' : '🔒 '}${CT.TEN_CAP[c]}</span><span class="sao">${saoHtml(s)}</span></button>`; }).join('')}</div></li>`;
      }).join('')}</ol>
      <p class="ghi-chu giua">Qua màn (được ít nhất 1 ★) để mở màn tiếp theo. Bố mẹ có thể mở khoá tất cả trong Góc phụ huynh.</p></div>`, 'man-dao');
    $('#ve').addEventListener('click', veTrangChu);
    $$('.nut-bk').forEach(b => b.addEventListener('click', () => moBiKip(b.dataset.d)));
    $$('.cap').forEach(b => b.addEventListener('click', () => {
      if (b.classList.contains('khoa')) { thongBao('Con hãy qua màn trước để mở màn này nhé!'); return; }
      batDau({ kieu: 'dang', id: b.dataset.d, cap: Number(b.dataset.c) });
    }));
  }

  /* ===================================================================
     MÀN HÌNH: DANH SÁCH PHIẾU CỦA CÔ
     =================================================================== */
  function veDsPhieu() {
    napPhieu();
    man(`<div class="khung">
      <header class="thanh-tren"><button class="nut-ve" id="ve">← Về</button><div class="tt-giua"><b>📄 Bài của cô</b><small>Các phiếu bài tập thật trên lớp</small></div></header>
      <div class="ds-phieu">${PHIEU.ds.map(p => `<button class="phieu-the" data-id="${p.id}"><span class="ph-chu"><b>${esc(p.ten)}</b><small>${esc(p.nguon || (p.coSan ? '' : 'Phụ huynh thêm'))}</small></span><span class="ph-phai"><span class="sao">${saoHtml(TD.sao('phieu:' + p.id))}</span><small>${p.cau.length} câu</small></span></button>`).join('') || '<p>Chưa có phiếu nào.</p>'}</div>
      <p class="ghi-chu giua">Bố mẹ thêm phiếu mới ở <b>Góc phụ huynh → Thêm bài</b>, hoặc sửa file <code>noi-dung/phieu-cua-co.js</code>.</p></div>`);
    $('#ve').addEventListener('click', veTrangChu);
    $$('.phieu-the').forEach(b => b.addEventListener('click', () => batDau({ kieu: 'phieu', id: b.dataset.id })));
  }

  /* ===================================================================
     TẠO MỘT LƯỢT CHƠI
     =================================================================== */
  const sao = o => JSON.parse(JSON.stringify(o));
  function sinhKhongTrung(id, cap, soCau) {
    const ds = [], dau = new Set();
    for (let lan = 0; ds.length < soCau && lan < soCau * 12; lan++) {
      const q = CT.sinh(id, cap), k = q.de + JSON.stringify(q.hinh || '') + JSON.stringify(q.luaChon || '');
      if (!dau.has(k)) { dau.add(k); ds.push(q); }
    }
    return ds;
  }
  function chonThuThach() {
    const thang = new Date().getMonth() + 1, hk = thang >= 8 || thang <= 1 ? 1 : 2;
    let dsDang = CT.dao.filter(d => d.hk === 0 || d.hk <= hk).flatMap(d => d.dang);
    const daChoi = dsDang.filter(id => TD.sao(id + ':1') > 0);
    if (daChoi.length >= 4) dsDang = daChoi.concat(T.tron(dsDang).slice(0, 2));
    const ds = [];
    T.tron(dsDang).slice(0, 8).forEach(id => {
      const cap = Math.min(3, 1 + [1, 2, 3].filter(c => TD.sao(id + ':' + c) >= 2).length);
      ds.push(CT.sinh(id, cap));
    });
    return ds;
  }
  let P = null;          // lượt chơi hiện tại
  function batDau(spec) {
    T.am.mo();
    let ds = [], ten = '', phu = '';
    if (spec.kieu === 'dang') {
      const d = CT.dang[spec.id];
      ds = sinhKhongTrung(spec.id, spec.cap, TD.hs.caiDat.soCau || 6);
      ten = d.ten; phu = CT.TEN_CAP[spec.cap];
      if (!TD.daXemBK[spec.id]) setTimeout(() => moBiKip(spec.id), 250);
    } else if (spec.kieu === 'phieu') {
      const p = PHIEU.ds.find(x => x.id === spec.id); if (!p) return veDsPhieu();
      ds = sao(p.cau); ten = p.ten; phu = 'Bài của cô';
    } else if (spec.kieu === 'loi') {
      ds = TD.soLoi.slice(0, 8).map(x => sao(x.q)); ten = 'Ôn lỗi sai'; phu = 'Làm lại cho thật vững';
    } else if (spec.kieu === 'ngay') {
      ds = chonThuThach(); ten = 'Thử thách hôm nay'; phu = 'Trộn nhiều dạng';
    }
    ds.forEach(q => { delete q._thuTu; });
    P = { spec, ten, phu, ds, i: 0, kq: [], batDau: Date.now() };
    veCau();
  }

  /* ===================================================================
     MÀN CHƠI MỘT CÂU
     =================================================================== */
  let S = null;          // trạng thái câu hiện tại
  const KHEN = ['Đúng rồi! Giỏi quá!', 'Chính xác!', 'Tuyệt vời!', 'Con làm rất tốt!', 'Hoan hô!', 'Đúng rồi, con suy nghĩ giỏi lắm!'];
  const VIEN = ['Chưa đúng. Con đọc lại đề thật chậm nhé.', 'Gần được rồi! Con kiểm tra lại từng bước xem.', 'Chưa đúng. Thử dùng gợi ý 💡 xem sao.', 'Chưa đúng rồi. Con bình tĩnh làm lại nhé.'];

  function veCau() {
    const q = P.ds[P.i];
    S = { q, buoc: 0, the: null, soSai: 0, saiBuoc: 0, goiY: 0, goiYMo: 0, xemDA: false, xong: false, dongGiai: [] };
    const tieuDe = q.dang && CT.dang[q.dang] ? CT.dang[q.dang].ten : P.ten;
    man(`<div class="khung khung-choi">
      <header class="thanh-tren"><button class="nut-ve" id="ve" aria-label="Thoát">✕</button>
        <div class="tt-giua"><b>${esc(P.ten)}</b><small>${esc(P.phu)}${P.spec.kieu !== 'dang' && q.dang ? ' · ' + esc(tieuDe) : ''}</small></div>
        <div class="tt-sao">⭐ <b id="sao-luot">${T.tong(P.kq.map(k => k.sao))}</b></div></header>
      <div class="tien-do" aria-label="Câu ${P.i + 1} trên ${P.ds.length}">${P.ds.map((_, k) => `<i class="${k < P.i ? (P.kq[k].sao ? 'xong' : 'truot') : k === P.i ? 'nay' : ''}"></i>`).join('')}</div>
      <section class="the-cau" id="the-cau">
        <div class="the-cau-dau"><span class="so-cau">Câu ${P.i + 1}/${P.ds.length}</span><span class="nut-nho-ds">
          <button class="nut-tron" id="nut-doc" aria-label="Đọc to đề bài">🔊</button><button class="nut-tron" id="nut-bk" aria-label="Bí kíp">📖</button></span></div>
        <div id="noi-dung-cau"></div>
      </section>
      <div class="phan-hoi" id="phan-hoi" role="status" aria-live="polite"></div>
      <div class="goi-y-ds" id="goi-y-ds"></div>
      <div class="cach-giai" id="cach-giai" hidden></div>
      <div class="thanh-nut" id="thanh-nut">
        <button class="nut nut-goiy" id="nut-goiy">💡 Gợi ý <small id="goi-y-con"></small></button>
        <button class="nut nut-phu" id="nut-xem" hidden>📘 Xem cách giải</button>
        <button class="nut nut-chinh" id="nut-kiem">Kiểm tra</button>
        <button class="nut nut-chinh" id="nut-tiep" hidden>${P.i < P.ds.length - 1 ? 'Câu tiếp ➜' : 'Xem kết quả 🏁'}</button>
      </div></div>`, 'man-choi');
    $('#ve').addEventListener('click', () => xacNhanThoat());
    $('#nut-doc').addEventListener('click', docDe);
    $('#nut-bk').addEventListener('click', () => moBiKip(q.dang));
    $('#nut-goiy').addEventListener('click', moGoiY);
    $('#nut-xem').addEventListener('click', xemCachGiai);
    $('#nut-kiem').addEventListener('click', kiemTra);
    $('#nut-tiep').addEventListener('click', cauTiep);
    veNoiDung();
    if (TD.hs.caiDat.docTo) setTimeout(docDe, 300);
  }

  function cauDangLam() { return S.q.loai === 'nhieuBuoc' ? S.q.buoc[S.buoc] : S.q; }
  function dsGoiY() { const c = cauDangLam(); return (c.goiY && c.goiY.length ? c.goiY : (S.q.goiY || [])); }

  function veNoiDung() {
    const q = S.q, goc = $('#noi-dung-cau');
    if (q.loai === 'nhieuBuoc') {
      goc.innerHTML = `<div class="de">${q.de}</div>${HV.ve(q.hinh)}
        <div class="bai-giai"${S.dongGiai.length ? '' : ' hidden'}><div class="bg-tieu-de">${q.giaiToan ? 'Bài giải' : 'Các bước đã làm'}</div>${S.dongGiai.map(d => `<div class="bg-dong">${d}</div>`).join('')}</div>
        <div class="buoc-cau nhom-o" id="cau-chinh"></div>`;
      const b = q.buoc[S.buoc], k = $('#cau-chinh');
      k.innerHTML = `<div class="de de-buoc">${KC.oTrong(b.de)}</div>${KC.oTrong(HV.ve(b.hinh))}<div class="vung-tra-loi"></div>`;
      S.the = KC.ve(b, k, { nop: nopChon, kiemTra });
    } else {
      goc.innerHTML = `<div class="nhom-o" id="cau-chinh"><div class="de">${KC.oTrong(q.de)}</div>${KC.oTrong(HV.ve(q.hinh))}<div class="vung-tra-loi"></div></div>`;
      S.the = KC.ve(q, $('#cau-chinh'), { nop: nopChon, kiemTra });
    }
    $('#nut-kiem').hidden = !S.the.canKiem;
    capNhatNutGoiY();
  }
  function capNhatNutGoiY() {
    const con = dsGoiY().length - S.goiYMo;
    $('#nut-goiy').hidden = S.xong || con <= 0;
    $('#goi-y-con').textContent = con > 0 ? `(còn ${con})` : '';
  }
  function docDe() {
    const c = cauDangLam();
    const ok = T.docTo((S.q.loai === 'nhieuBuoc' ? S.q.de + '. ' : '') + KC.oTrong(c.de) + (c.luaChon && c.loai === 'chon' ? '. ' + c.luaChon.map((x, i) => String.fromCharCode(65 + i) + '. ' + x).join('. ') : ''));
    if (!ok) thongBao('Máy này chưa có giọng đọc tiếng Việt.');
  }
  function phanHoi(chu, loai) {
    const p = $('#phan-hoi'); p.innerHTML = chu; p.className = 'phan-hoi hien ' + (loai || '');
  }
  function lac(elm) { elm.classList.remove('lac'); void elm.offsetWidth; elm.classList.add('lac'); }

  /* ---- Gợi ý từng bước: có thể là câu hỏi nhỏ để con tự trả lời ---- */
  function moGoiY() {
    const ds = dsGoiY(); if (S.goiYMo >= ds.length) return;
    const g = ds[S.goiYMo++]; S.goiY++;
    T.am.choi('goiy');
    const vung = $('#goi-y-ds');
    const muc = el(`<div class="goi-y"><span class="gy-so">💡 ${S.goiYMo}</span><div class="gy-nd"></div></div>`);
    const nd = $('.gy-nd', muc);
    if (g && typeof g === 'object') {
      muc.classList.add('nhom-o', 'hoi');
      nd.innerHTML = `<div>${g.hoi}</div><div class="gy-tl">${KC.oTrong('[[0]]')}<button class="nut-nho">Thử</button><span class="gy-kq"></span></div>`;
      let sai = 0;
      const o = $('.o-nhap', nd);
      o.dataset.dai = Math.max(4, String(g.dap).length);
      const thu = () => {
        if (o.classList.contains('khoa')) return;
        const v = o.dataset.gt === '' || o.dataset.gt == null ? null : Number(o.dataset.gt);
        if (v == null) return;
        if (v === g.dap) {
          o.classList.add('dung', 'khoa'); $('.gy-kq', nd).textContent = '✔ Đúng! Giờ con làm tiếp nhé.'; T.am.choi('dung');
          const tiep = $$('#cau-chinh .o-nhap:not(.khoa)').find(x => !x.dataset.gt) || $$('#cau-chinh .o-nhap:not(.khoa)')[0];
          BP.chon(tiep || null); if (!tiep) BP.hien(false);
        } else {
          sai++; o.classList.add('sai'); lac(o); T.am.choi('sai');
          if (sai >= 2) { o.dataset.gt = g.dap; o.textContent = g.dap; o.classList.remove('sai'); o.classList.add('lo', 'khoa'); $('.gy-kq', nd).textContent = `Kết quả là ${g.dap}. Con dùng số này để làm tiếp nhé.`; }
          else $('.gy-kq', nd).textContent = 'Thử lại nào!';
        }
      };
      BP.gan(muc, thu);
      $('.nut-nho', nd).addEventListener('click', thu);
      vung.appendChild(muc);
      setTimeout(() => BP.chon(o), 30);
    } else {
      nd.innerHTML = String(g);
      vung.appendChild(muc);
    }
    muc.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    capNhatNutGoiY();
  }

  /* ---- Kiểm tra ---- */
  function kiemTra() {
    if (S.xong || !S.the || !S.the.canKiem) return;
    if (!S.the.daDu()) { phanHoi('Con điền đủ các ô trước đã nhé.', 'nhac'); return; }
    const v = S.the.layGiaTri();
    xuLy(KC.kiem(cauDangLam(), v), v);
  }
  function nopChon(v) { if (S.xong) return; xuLy(KC.kiem(cauDangLam(), v), v); }

  function xuLy(kq, v) {
    const c = cauDangLam();
    S.the.danhDau(kq, v);
    if (kq.dung) {
      if (S.q.loai === 'nhieuBuoc' && S.buoc < S.q.buoc.length - 1) { ghiDongGiai(c); S.buoc++; S.saiBuoc = 0; T.am.choi('dung'); phanHoi('✔ ' + T.c(['Đúng rồi! Sang bước tiếp theo.', 'Chính xác! Làm tiếp nào.']), 'dung'); $('#goi-y-ds').innerHTML = ''; S.goiYMo = 0; veNoiDung(); return; }
      if (S.q.loai === 'nhieuBuoc') ghiDongGiai(c);
      hoanThanh(true); return;
    }
    if (c.loai === 'tuCham') { hoanThanh(false, true); return; }
    S.soSai++; S.saiBuoc++;
    T.am.choi('sai'); lac($('#the-cau'));
    let loi = c.saiThuong && c.saiThuong[String(v)];
    if (!loi && c.loai === 'chonNhieu') {
      if (c.kiem === 'tong') loi = `Các tờ con chọn cộng lại là <b>${T.so(kq.tong)} đồng</b>, chưa đúng ${T.so(c.dich)} đồng.`;
      else loi = `Con chọn đúng <b>${kq.trung}</b> ô.${kq.thieu ? ` Còn thiếu <b>${kq.thieu}</b> ô.` : ''}${kq.thua ? ` Có <b>${kq.thua}</b> ô chọn nhầm.` : ''}`;
    }
    if (!loi && (c.loai === 'o' || c.loai === 'keoTha' || c.loai === 'sapXep') && kq.chiTiet) { const d = kq.chiTiet.filter(Boolean).length; if (d) loi = `Đúng ${d}/${kq.chiTiet.length} ô. Các ô màu đỏ chưa đúng, con sửa lại nhé.`; }
    phanHoi('✗ ' + (loi || T.c(VIEN)), 'sai');
    if (S.saiBuoc === 2 && S.goiYMo < dsGoiY().length) { setTimeout(moGoiY, 400); }
    if (S.saiBuoc >= 2) $('#nut-xem').hidden = false;
  }
  function ghiDongGiai(c) {
    if (c.ghi) S.dongGiai.push(esc(c.ghi));
    else if (c.ghiMau) S.dongGiai.push(esc(c.ghiMau));
  }

  function xemCachGiai() {
    if (S.xong) return;
    S.xemDA = true;
    S.the.hienDapAn();
    if (S.q.loai === 'nhieuBuoc') for (let k = S.buoc; k < S.q.buoc.length; k++) ghiDongGiai(S.q.buoc[k]);
    hoanThanh(false);
  }

  function hoanThanh(dung, tuChamSai) {
    S.xong = true; S.the.khoa(); BP.chon(null); BP.hien(false);
    const q = S.q;
    let s = 0;
    if (dung && !S.xemDA) s = S.soSai === 0 && S.goiY === 0 ? 3 : S.soSai + S.goiY <= 2 ? 2 : 1;
    if (q.loai === 'tuCham') s = dung ? 2 : 0;
    P.kq.push({ sao: s, dung, de: q.de, dang: q.dang });
    $('#sao-luot').textContent = T.tong(P.kq.map(k => k.sao));
    // thống kê
    if (q.dang) { const t = TD.tk[q.dang] || (TD.tk[q.dang] = { dung: 0, tong: 0, goiY: 0, sai: 0 }); t.tong++; if (dung) t.dung++; t.goiY += S.goiY; t.sai += S.soSai; }
    // sổ ôn lỗi
    const khoa = q.de + JSON.stringify(q.hinh || '');
    const viTri = TD.soLoi.findIndex(x => x.k === khoa);
    if (!dung || S.soSai >= 2 || S.xemDA) { if (viTri < 0) TD.soLoi.unshift({ k: khoa, q: sao(q), ngay: T.homNay(), dang: q.dang || '', nguon: P.ten }); }
    else if (viTri >= 0 && S.soSai === 0) TD.soLoi.splice(viTri, 1);
    TD.ghi();

    $('#nut-kiem').hidden = true; $('#nut-goiy').hidden = true; $('#nut-xem').hidden = true; $('#nut-tiep').hidden = false;
    if (q.loai === 'nhieuBuoc') {
      const bg = $('.bai-giai'); if (bg) { bg.hidden = false; bg.innerHTML = `<div class="bg-tieu-de">${q.giaiToan ? 'Bài giải' : 'Các bước đã làm'}</div>` + S.dongGiai.map(d => `<div class="bg-dong">${d}</div>`).join(''); }
      const cc = $('#cau-chinh'); if (cc) cc.hidden = true;
    }
    if (dung) {
      T.am.choi('dung'); phanHoi(`<span class="khen">${T.c(KHEN)}</span> <span class="sao sao-to">${saoHtml(s)}</span>`, 'dung'); phaoHoa();
    } else if (tuChamSai) {
      phanHoi('Không sao! Con xem lại cách làm bên dưới rồi sửa vào vở nhé. Câu này đã vào Sổ ôn lỗi.', 'nhac');
    } else {
      phanHoi('Không sao! Con đọc kĩ cách giải bên dưới. Câu này đã được ghi vào <b>Sổ ôn lỗi</b> để con luyện lại.', 'nhac');
    }
    const lg = q.loiGiai || [];
    if (lg.length) { const cg = $('#cach-giai'); cg.hidden = false; cg.innerHTML = `<div class="cg-tieu-de">${dung ? '🧠 Cách nghĩ' : '📘 Cách giải'}</div>${lg.map(x => `<div class="cg-dong">${x}</div>`).join('')}`; }
    $('#nut-tiep').focus({ preventScroll: true });
  }
  function cauTiep() { P.i++; if (P.i < P.ds.length) veCau(); else ketThuc(); }

  function xacNhanThoat() {
    if (!P.kq.length) { veNoiTroVe(); return; }
    const h = hopThoai(`<h2>Thoát lượt chơi?</h2><p>Con đã làm ${P.kq.length}/${P.ds.length} câu. Nếu thoát bây giờ, kết quả lượt này sẽ không được tính sao cho màn.</p>
      <div class="hang-nut"><button class="nut nut-phu" id="o-lai">Chơi tiếp</button><button class="nut nut-chinh" id="thoat">Thoát</button></div>`);
    $('#o-lai', h.goc).addEventListener('click', h.dong);
    $('#thoat', h.goc).addEventListener('click', () => { h.dong(); veNoiTroVe(); });
  }
  function veNoiTroVe() {
    if (P.spec.kieu === 'dang') veDao(CT.dang[P.spec.id].dao);
    else if (P.spec.kieu === 'phieu') veDsPhieu();
    else veTrangChu();
  }
  function phaoHoa() {
    if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const g = el('<div class="phao-hoa" aria-hidden="true"></div>');
    for (let i = 0; i < 14; i++) { const s = document.createElement('i'); s.textContent = T.c(['⭐', '✨', '🌟']); s.style.setProperty('--x', (Math.random() * 2 - 1) * 160 + 'px'); s.style.setProperty('--y', -(60 + Math.random() * 140) + 'px'); s.style.animationDelay = Math.random() * 0.15 + 's'; g.appendChild(s); }
    document.body.appendChild(g); setTimeout(() => g.remove(), 1200);
  }

  /* ===================================================================
     KẾT THÚC LƯỢT CHƠI
     =================================================================== */
  function ketThuc() {
    const tong = T.tong(P.kq.map(k => k.sao)), max = P.kq.length * 3, ti = max ? tong / max : 0;
    const saoMan = ti >= 0.8 ? 3 : ti >= 0.55 ? 2 : ti >= 0.3 ? 1 : 0;
    const dung = P.kq.filter(k => k.dung).length;
    let khoa = null;
    if (P.spec.kieu === 'dang') khoa = P.spec.id + ':' + P.spec.cap;
    if (P.spec.kieu === 'phieu') khoa = 'phieu:' + P.spec.id;
    let stickerMoi = null, lanDau3 = false;
    if (khoa) {
      const m = TD.man[khoa] || (TD.man[khoa] = { sao: 0, lan: 0, dung: 0, tong: 0 });
      lanDau3 = saoMan === 3 && m.sao < 3;
      m.sao = Math.max(m.sao, saoMan); m.lan++; m.dung += dung; m.tong += P.kq.length;
    }
    if (P.spec.kieu === 'ngay') { TD.thuThach[T.homNay()] = Math.max(TD.thuThach[T.homNay()] || 0, saoMan); lanDau3 = saoMan === 3; }

      $('#cau-chinh').innerHTML = `<div class="tc-phep">${c[0]} = ${KC.oTrong('[[0]]')}</div>`;

      else { sai++; T.am.choi('sai'); phanHoi(`✗ ${cau[0]} = ${cau[1]}`, 'sai'); }

      man(`<div class="khung hop-giua"><div class="the-lon ket-qua"><div class="kq-sao">⚡</div><h1>${kyLuc ? 'Kỷ lục mới!' : 'Hết giờ!'}</h1><p class="kq-so">Đúng <b>${dung}</b> câu, sai ${sai} câu · nhận <b>${Math.floor(dung / 2)} ⭐</b></p><p>Kỷ lục: ${TD.kyLuc[k]} câu</p>

      g.textContent = conLai; $('#tc-thanh').style.width = (conLai / 60 * 100) + '%';

  function moTaDapAn(q) {
    if (q.loai === 'so') return String(q.dapAn);
    if (q.loai === 'o') return q.dapAn.join('; ') + (q.khongThuTu ? ' (không cần thứ tự)' : '');
    if (q.loai === 'chon') return q.luaChon[q.dapAn].replace(/<[^>]+>/g, '');
    if (q.loai === 'nhieuBuoc') return (q.loiGiai || []).join(' · ');
    if (q.loai === 'tuCham') return 'Tự chấm: ' + q.dapAnChu;
    return '';
  }

  function phDaThem(g) {
    const chu = luu.doc('phieuThem', ''), kq = VB.phanTich(chu);
    g.innerHTML = `<div class="the-ph"><h3>Phiếu bố mẹ đã thêm</h3>
      ${kq.ds.length ? `<ul class="ds-can">${kq.ds.map(p => `<li><b>${esc(p.ten)}</b> — ${p.cau.length} câu</li>`).join('')}</ul>` : '<p class="ghi-chu">Chưa có. Vào tab “Thêm bài” để thêm.</p>'}
      <p class="ghi-chu">Bài thêm ở đây chỉ lưu trong trình duyệt này. Muốn giữ lâu dài hoặc dùng trên máy khác: sao chép nội dung dưới đây dán vào cuối file <code>noi-dung/phieu-cua-co.js</code>, hoặc dán vào ô “Nhập” trên máy kia.</p>
      <textarea id="da-them" rows="12" spellcheck="false">${esc(chu)}</textarea>
      <div class="hang-nut trai"><button class="nut nut-phu" id="sao-chep">Sao chép</button><button class="nut nut-phu" id="luu-sua">Lưu chỗ đã sửa</button><button class="nut nut-phu" id="xoa-het">Xoá tất cả</button></div>
      <h3>Nhập từ file .txt</h3><input type="file" id="nhap-file" accept=".txt,.md,text/plain"></div>`;
    const ta = $('#da-them', g);
    $('#sao-chep', g).addEventListener('click', () => { const ok = () => thongBao('Đã sao chép.'); try { navigator.clipboard.writeText(ta.value).then(ok, () => { ta.select(); thongBao('Đã chọn sẵn, bấm Ctrl+C để sao chép.'); }); } catch (e) { ta.select(); } });
    $('#luu-sua', g).addEventListener('click', () => { const k = VB.phanTich(ta.value); if (k.loi.length) { thongBao(k.loi[0]); return; } luu.ghi('phieuThem', ta.value); thongBao('Đã lưu.'); vePhuHuynh('da-them'); });
    $('#xoa-het', g).addEventListener('click', e => { const b = e.currentTarget; if (b.dataset.xn) { luu.ghi('phieuThem', ''); vePhuHuynh('da-them'); } else { b.dataset.xn = 1; b.textContent = 'Bấm lần nữa để xoá'; } });
    $('#nhap-file', g).addEventListener('change', e => { const f = e.target.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => { ta.value = (ta.value ? ta.value + '\n\n' : '') + r.result; thongBao('Đã nhập. Bấm “Lưu chỗ đã sửa”.'); }; r.readAsText(f); });
  }

  function phCaiDat(g) {
    const cd = TD.hs.caiDat;
    g.innerHTML = `<div class="the-ph"><h3>Cài đặt</h3><div class="form-luoi">
      <label for="c-socau">Số câu mỗi màn</label><select id="c-socau">${[5, 6, 8, 10].map(x => `<option ${x === cd.soCau ? 'selected' : ''}>${x}</option>`).join('')}</select>
      <label for="c-mokhoa">Mở khoá tất cả màn</label><input type="checkbox" id="c-mokhoa" ${cd.moKhoa ? 'checked' : ''}>
      <label for="c-docto">Tự đọc to đề bài</label><input type="checkbox" id="c-docto" ${cd.docTo ? 'checked' : ''}>
      <label for="c-am">Âm thanh</label><input type="checkbox" id="c-am" ${cd.amThanh !== false ? 'checked' : ''}>
    </div></div>
    <div class="the-ph"><h3>Sao lưu tiến độ</h3><p class="ghi-chu">Tiến độ lưu trong trình duyệt của máy này. Sao chép đoạn mã dưới đây để cất giữ, hoặc dán mã đã cất để khôi phục.</p>
      <textarea id="sao-luu" rows="5" spellcheck="false"></textarea>
      <div class="hang-nut trai"><button class="nut nut-phu" id="lay-ma">Lấy mã sao lưu</button><button class="nut nut-phu" id="khoi-phuc">Khôi phục từ mã</button><button class="nut nut-phu" id="xoa-td">Xoá toàn bộ tiến độ</button></div></div>`;
    const doi = () => { cd.soCau = Number($('#c-socau', g).value); cd.moKhoa = $('#c-mokhoa', g).checked; cd.docTo = $('#c-docto', g).checked; cd.amThanh = $('#c-am', g).checked; T.am.bat = cd.amThanh; TD.ghi(); thongBao('Đã lưu cài đặt.'); };
    $$('select, input[type=checkbox]', g).forEach(x => x.addEventListener('change', doi));
    $('#lay-ma', g).addEventListener('click', () => { $('#sao-luu', g).value = JSON.stringify(T.luu.tatCa()); $('#sao-luu', g).select(); });
    $('#khoi-phuc', g).addEventListener('click', () => {
      try { const o = JSON.parse($('#sao-luu', g).value); Object.entries(o).forEach(([k, v]) => luu.ghi(k, v)); thongBao('Đã khôi phục. Đang tải lại…'); setTimeout(() => location.reload(), 800); }
      catch (e) { thongBao('Mã không đúng định dạng.'); }
    });
    $('#xoa-td', g).addEventListener('click', e => {
      const b = e.currentTarget;
      if (!b.dataset.xn) { b.dataset.xn = 1; b.textContent = 'Bấm lần nữa để xoá hết'; return; }
      ['hoSo', 'man', 'thongKe', 'soLoi', 'nhatKy', 'thuThach', 'kyLuc', 'daXemBK'].forEach(k => luu.xoa(k));
      location.reload();
    });
  }

  /* ===================================================================
     KHỞI ĐỘNG
     =================================================================== */
  BP.tao();
  window.__toan2 = { TD, get P() { return P; }, get S() { return S; }, batDau, veTrangChu };
  if (TD.hs.ten) veTrangChu(); else veHoSo(false);
})();

</script>
</body>
