<script>
/* ---- js/tien-ich.js ---- */
/* Tiện ích chung: số ngẫu nhiên, lưu trữ, âm thanh, đọc to, đọc số bằng chữ. */
(function (g) {
  'use strict';
  const T = {};

  /* ---------- Ngẫu nhiên ---------- */
  T.n = (a, b) => a + Math.floor(Math.random() * (b - a + 1));          // số nguyên trong [a, b]
  T.c = arr => arr[Math.floor(Math.random() * arr.length)];             // chọn 1 phần tử
  T.tron = arr => {                                                      // xáo trộn (bản sao)
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
    return a;
  };
  T.khac = (a, b, f) => { let x; do { x = f(); } while (x === a || x === b); return x; };
  T.lap = (n, f) => Array.from({ length: n }, (_, i) => f(i));
  T.tong = arr => arr.reduce((s, x) => s + x, 0);

  /* ---------- Lưu trữ (an toàn khi trình duyệt chặn) ---------- */
  const TIEN_TO = 'toan2.';
  T.luu = {
    doc(k, mac) {
      try { const v = localStorage.getItem(TIEN_TO + k); return v == null ? mac : JSON.parse(v); }
      catch (e) { return mac; }
    },
    ghi(k, v) { try { localStorage.setItem(TIEN_TO + k, JSON.stringify(v)); return true; } catch (e) { return false; } },
    xoa(k) { try { localStorage.removeItem(TIEN_TO + k); } catch (e) { /* bỏ qua */ } },
    tatCa() {
      const o = {};
      try { for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k.startsWith(TIEN_TO)) o[k.slice(TIEN_TO.length)] = JSON.parse(localStorage.getItem(k)); } }
      catch (e) { /* bỏ qua */ }
      return o;
    }
  };

  /* ---------- DOM ---------- */
  T.$ = (s, r) => (r || document).querySelector(s);
  T.$$ = (s, r) => Array.from((r || document).querySelectorAll(s));
  T.el = html => { const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstElementChild; };
  T.esc = s => String(s).replace(/[&<>"]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch]));

  /* ---------- Âm thanh (WebAudio, không cần file) ---------- */
  let ctx = null;
  function phat(tan, batDau, dai, kieu, am) {
    const o = ctx.createOscillator(), gn = ctx.createGain();
    o.type = kieu || 'sine'; o.frequency.value = tan;
    gn.gain.setValueAtTime(0.0001, ctx.currentTime + batDau);
    gn.gain.exponentialRampToValueAtTime(am || 0.18, ctx.currentTime + batDau + 0.02);
    gn.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + batDau + dai);
    o.connect(gn); gn.connect(ctx.destination);
    o.start(ctx.currentTime + batDau); o.stop(ctx.currentTime + batDau + dai + 0.05);
  }
  T.am = {
    bat: true,
    mo() { try { if (!ctx) ctx = new (g.AudioContext || g.webkitAudioContext)(); if (ctx.state === 'suspended') ctx.resume(); } catch (e) { ctx = null; } },
    choi(ten) {
      if (!this.bat) return; this.mo(); if (!ctx) return;
      try {
        if (ten === 'dung') { phat(660, 0, .12); phat(880, .1, .18); }
        else if (ten === 'sai') { phat(220, 0, .22, 'triangle', .14); }
        else if (ten === 'cham') { phat(520, 0, .06, 'sine', .08); }
        else if (ten === 'thang') { [523, 659, 784, 1047].forEach((f, i) => phat(f, i * .12, .25)); }
        else if (ten === 'goiy') { phat(740, 0, .1, 'sine', .1); phat(620, .08, .12, 'sine', .1); }
      } catch (e) { /* bỏ qua */ }
    }
  };

  /* ---------- Đọc to bằng giọng tiếng Việt (nếu máy có) ---------- */
  T.docTo = function (html) {
    try {
      if (!('speechSynthesis' in g)) return false;
      const d = document.createElement('div'); d.innerHTML = html;
      d.querySelectorAll('.o-nhap,.o-tha').forEach(x => { x.textContent = ' ô trống '; });
      let s = d.textContent.replace(/\s+/g, ' ')
        .replace(/×/g, ' nhân ').replace(/ : /g, ' chia ').replace(/−/g, ' trừ ').replace(/\+/g, ' cộng ')
        .replace(/=/g, ' bằng ').replace(/</g, ' bé hơn ').replace(/>/g, ' lớn hơn ').replace(/\?/g, '?');
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(s);
      u.lang = 'vi-VN'; u.rate = 0.9;
      const v = speechSynthesis.getVoices().find(x => /vi/i.test(x.lang));
      if (v) u.voice = v;
      speechSynthesis.speak(u);
      return true;
    } catch (e) { return false; }
  };
  T.dungDoc = () => { try { speechSynthesis.cancel(); } catch (e) { /* bỏ qua */ } };

  /* ---------- Đọc số bằng chữ (đến 1000), theo cách viết trong SGK ---------- */
  const CS = ['không', 'một', 'hai', 'ba', 'bốn', 'năm', 'sáu', 'bảy', 'tám', 'chín'];
  function haiChuSo(n) {               // 0..99, không có hàng trăm phía trước
    if (n < 10) return CS[n];
    if (n === 10) return 'mười';
    const c = Math.floor(n / 10), d = n % 10;
    if (c === 1) return 'mười ' + (d === 5 ? 'lăm' : CS[d]);
    let s = CS[c] + ' mươi';
    if (d === 0) return s;
    if (d === 1) return s + ' mốt';
    if (d === 4) return s + ' tư';
    if (d === 5) return s + ' lăm';
    return s + ' ' + CS[d];
  }
  T.soChu = function (n) {
    if (n === 1000) return 'một nghìn';
    if (n < 100) return haiChuSo(n);
    const tr = Math.floor(n / 100), du = n % 100;
    let s = CS[tr] + ' trăm';
    if (du === 0) return s;
    if (du < 10) return s + ' linh ' + CS[du];
    return s + ' ' + haiChuSo(du);
  };

  /* ---------- Khác ---------- */
  T.homNay = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
  T.so = n => String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ' ');  // 1 000 (khoảng hẹp)
  T.chuSo = n => String(n).split('').map(Number);

  g.T = T;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* ---- js/hinh-ve.js ---- */
/* Hình minh họa. Mỗi hình mô tả bằng dữ liệu {kieu:'...', ...} để lưu được vào Sổ ôn lỗi.
   HV.ve(hinh) trả về chuỗi HTML. Ô trống [[i]] trong chuỗi sẽ được biến thành ô nhập. */
(function (g) {
  'use strict';
  const HV = {};
  const VE = {};
  HV.dangKy = (ten, f) => { VE[ten] = f; };

  HV.ve = function (h) {
    if (!h) return '';
    if (Array.isArray(h)) return h.map(HV.ve).join('');
    if (typeof h === 'string') return `<div class="hv">${h}</div>`;
    const f = VE[h.kieu];
    return f ? `<div class="hv hv-${h.kieu}">${f(h)}</div>` : '';
  };

  /* ---- Chữ / HTML tự do ---- */
  VE.chu = h => h.chu;

  /* ---- Hàng đồ vật: {vat:'🍎', so:7, hang:10} ---- */
  VE.vat = h => {
    const hang = h.hang || 10, ds = [];
    for (let i = 0; i < h.so; i += hang) ds.push(`<div class="vat-hang">${(h.vat).repeat(Math.min(hang, h.so - i))}</div>`);
    return (h.nhan ? `<div class="hv-nhan">${h.nhan}</div>` : '') + ds.join('');
  };

  /* ---- Nhóm đồ vật: {vat, soNhom, moi} ---- */
  VE.nhom = h => {
    let s = '<div class="nhom-wrap">';
    for (let i = 0; i < h.soNhom; i++) s += `<div class="nhom">${h.vat.repeat(h.moi)}</div>`;
    return s + '</div>';
  };

  /* ---- Khối trăm, chục, đơn vị: {tram, chuc, dv} ---- */
  VE.khoi = h => {
    let s = '<div class="khoi-wrap">';
    for (let i = 0; i < (h.tram || 0); i++) s += '<div class="k-tram" title="1 trăm"></div>';
    for (let i = 0; i < (h.chuc || 0); i++) s += '<div class="k-chuc" title="1 chục"></div>';
    if (h.dv) { s += '<div class="k-dv-cot">'; for (let i = 0; i < h.dv; i++) s += '<div class="k-dv"></div>'; s += '</div>'; }
    s += '</div><div class="khoi-chu">';
    if (h.tram) s += '<span><i class="k-mau-tram"></i> 1 trăm</span>';
    if (h.chuc) s += '<span><i class="k-mau-chuc"></i> 1 chục</span>';
    if (h.dv) s += '<span><i class="k-mau-dv"></i> 1 đơn vị</span>';
    return s + '</div>';
  };

  /* ---- Khung 10 chấm: {a, b} vẽ a chấm màu 1 rồi b chấm màu 2 ---- */
  VE.khung10 = h => {
    const tong = h.a + (h.b || 0), soKhung = Math.max(1, Math.ceil(tong / 10));
    let s = '<div class="k10-wrap">';
    for (let k = 0; k < soKhung; k++) {
      s += '<div class="k10">';
      for (let i = 0; i < 10; i++) {
        const vt = k * 10 + i;
        const cls = vt < h.a ? 'c1' : vt < tong ? 'c2' : '';
        s += `<span class="k10-o"><i class="${cls}"></i></span>`;
      }
      s += '</div>';
    }
    return s + '</div>';
  };

  /* ---- Tia số: {dau, buoc, so, o:{viTri: chiSoO}} ---- */
  VE.tia = h => {
    let s = '<div class="tia"><div class="tia-truc"></div><div class="tia-vach">';
    for (let i = 0; i < h.so; i++) {
      const gt = h.dau + i * h.buoc;
      const nhan = h.o && h.o[i] !== undefined ? `[[${h.o[i]}]]` : `<b>${gt}</b>`;
      s += `<div class="tia-moc"><i></i><div>${nhan}</div></div>`;
    }
    return s + '</div></div>';
  };

  /* ---- Đồng hồ kim: {gio, phut} ---- */
  HV.dongHoSvg = function (gio, phut, kichThuoc, id) {
    const k = kichThuoc || 180;
    let so = '';
    for (let i = 1; i <= 12; i++) {
      const a = (i * 30 - 90) * Math.PI / 180;
      so += `<text x="${100 + 70 * Math.cos(a)}" y="${100 + 70 * Math.sin(a) + 7}" text-anchor="middle" class="dh-so">${i}</text>`;
    }
    let vach = '';
    for (let i = 0; i < 60; i++) {
      const a = (i * 6) * Math.PI / 180, r1 = i % 5 ? 86 : 82;
      vach += `<line x1="${100 + r1 * Math.sin(a)}" y1="${100 - r1 * Math.cos(a)}" x2="${100 + 90 * Math.sin(a)}" y2="${100 - 90 * Math.cos(a)}" class="${i % 5 ? 'dh-v' : 'dh-V'}"/>`;
    }
    const gocP = phut * 6, gocG = ((gio % 12) + phut / 60) * 30;
    return `<svg viewBox="0 0 200 200" width="${k}" height="${k}" class="dong-ho" ${id ? `id="${id}"` : ''} role="img" aria-label="Đồng hồ">
      <circle cx="100" cy="100" r="95" class="dh-mat"/>${vach}${so}
      <line x1="100" y1="100" x2="100" y2="52" class="dh-kim-gio" transform="rotate(${gocG} 100 100)"/>
      <line x1="100" y1="100" x2="100" y2="24" class="dh-kim-phut" transform="rotate(${gocP} 100 100)"/>
      <circle cx="100" cy="100" r="6" class="dh-tam"/></svg>`;
  };
  VE.dongHo = h => HV.dongHoSvg(h.gio, h.phut, h.co);

  /* ---- Tờ lịch tháng: {nam, thang, danhDau:[ngay]} (ngày thật theo lịch) ---- */
  HV.soNgay = (nam, thang) => new Date(nam, thang, 0).getDate();
  HV.thu = (nam, thang, ngay) => new Date(nam, thang - 1, ngay).getDay(); // 0 = Chủ nhật
  HV.tenThu = d => d === 0 ? 'Chủ nhật' : 'Thứ ' + ['', 'hai', 'ba', 'tư', 'năm', 'sáu', 'bảy'][d];
  VE.lich = h => {
    const n = HV.soNgay(h.nam, h.thang), dau = HV.thu(h.nam, h.thang, 1);
    const cot = (dau + 6) % 7;           // thứ hai đứng đầu
    let s = `<div class="lich"><div class="lich-dau">Tháng ${h.thang} năm ${h.nam}</div><div class="lich-luoi">`;
    ['T2', 'T3', 'T4', 'T5', 'T6', 'T7', 'CN'].forEach(t => { s += `<b class="lich-thu">${t}</b>`; });
    for (let i = 0; i < cot; i++) s += '<span></span>';
    for (let d = 1; d <= n; d++) {
      const dd = h.danhDau && h.danhDau.includes(d) ? ' danh-dau' : '';
      const an = h.an && h.an.includes(d) ? '' : d;
      s += `<span class="lich-ngay${dd}">${an}</span>`;
    }
    return s + '</div></div>';
  };

  /* ---- Cân hai đĩa: {trai:['🍉','2kg'], phai:['5kg'], nghieng:-1|0|1} ---- */
  const quaCan = x => /^\d+$/.test(x) ? `<span class="hop-can">${x}</span>` : /kg$/.test(x) ? `<span class="qua-can">${x.replace('kg', '')}<small>kg</small></span>` : `<span class="vat-can">${x}</span>`;
  VE.can = h => {
    const ng = h.nghieng || 0;          // -1: bên trái nặng hơn (đĩa trái thấp)
    return `<div class="can" style="--ng:${ng * 8}deg">
      <div class="can-don"><div class="can-dia trai">${h.trai.map(quaCan).join('')}</div><div class="can-dia phai">${h.phai.map(quaCan).join('')}</div></div>
      <div class="can-chan"></div></div>`;
  };

  /* ---- Bình nước: {lit, max} ---- */
  VE.binh = h => {
    let s = '<div class="binh-wrap">';
    (h.ds || [{ lit: h.lit, max: h.max || 10, nhan: h.nhan }]).forEach(b => {
      const pt = Math.round(b.lit / b.max * 100);
      s += `<div class="binh-mot"><div class="binh"><div class="binh-nuoc" style="height:${pt}%"></div>`;
      for (let i = 1; i < b.max; i++) s += `<i style="bottom:${i / b.max * 100}%"></i>`;
      s += `</div><div class="hv-nhan">${b.nhan || ''}</div></div>`;
    });
    return s + '</div>';
  };

  /* ---- Tiền Việt Nam: {to:[500, 200, ...]} ---- */
  const MAU_TIEN = { 100: 'tien-100', 200: 'tien-200', 500: 'tien-500', 1000: 'tien-1000', 2000: 'tien-2000', 5000: 'tien-5000', 10000: 'tien-10000' };
  HV.toTien = m => `<span class="to-tien ${MAU_TIEN[m] || ''}"><b>${T.so(m)}</b><small>đồng</small></span>`;
  VE.tien = h => `<div class="tien-wrap">${h.to.map(HV.toTien).join('')}</div>`;

  /* ---- Sơ đồ đoạn thẳng: {hang:[{nhan:'An', doan:[{dai:5, chu:'15'}], ngoac:'?'}]} ---- */
  VE.thanh = h => {
    const max = Math.max(...h.hang.map(r => T.tong(r.doan.map(d => d.dai))));
    let s = '<div class="so-do">';
    h.hang.forEach(r => {
      s += `<div class="sd-hang"><div class="sd-nhan">${r.nhan}</div><div class="sd-thanh">`;
      r.doan.forEach((d, i) => {
        s += `<div class="sd-doan ${d.loai || ''}" style="width:${d.dai / max * 100}%"><span>${d.chu == null ? '' : d.chu}</span></div>`;
      });
      s += `</div>${r.sau ? `<div class="sd-sau">${r.sau}</div>` : ''}</div>`;
    });
    if (h.ghiChu) s += `<div class="hv-nhan">${h.ghiChu}</div>`;
    return s + '</div>';
  };

  /* ---- Hình học bằng SVG ---- */
  HV.hinhPhang = function (ten, k) {
    const kk = k || 90;
    const svg = inner => `<svg viewBox="0 0 100 100" width="${kk}" height="${kk}" class="hp">${inner}</svg>`;
    switch (ten) {
      case 'tamGiac': return svg('<polygon points="50,12 90,86 10,86" class="hp-to"/>');
      case 'tuGiac': return svg('<polygon points="18,20 82,12 90,84 12,72" class="hp-to"/>');
      case 'vuong': return svg('<rect x="18" y="18" width="64" height="64" class="hp-to"/>');
      case 'chuNhat': return svg('<rect x="8" y="28" width="84" height="46" class="hp-to"/>');
      case 'tron': return svg('<circle cx="50" cy="50" r="38" class="hp-to"/>');
      case 'nguGiac': return svg('<polygon points="50,10 90,40 75,88 25,88 10,40" class="hp-to"/>');
      case 'doanThang': return svg('<line x1="12" y1="62" x2="88" y2="38" class="hp-net"/><circle cx="12" cy="62" r="4" class="hp-diem"/><circle cx="88" cy="38" r="4" class="hp-diem"/>');
      case 'duongThang': return svg('<line x1="0" y1="66" x2="100" y2="34" class="hp-net"/>');
      case 'duongCong': return svg('<path d="M8,70 C30,10 60,100 92,30" class="hp-net"/>');
      case 'gapKhuc': return svg('<polyline points="8,80 32,30 60,70 92,22" class="hp-net"/><g class="hp-diem"><circle cx="8" cy="80" r="4"/><circle cx="32" cy="30" r="4"/><circle cx="60" cy="70" r="4"/><circle cx="92" cy="22" r="4"/></g>');
      case 'diem': return svg('<circle cx="50" cy="50" r="6" class="hp-diem"/><text x="58" y="44" class="hp-chu">A</text>');
      default: return '';
    }
  };
  VE.hinhPhang = h => HV.hinhPhang(h.ten, h.co);

  HV.khoi3d = function (ten, k) {
    const kk = k || 100;
    const svg = inner => `<svg viewBox="0 0 100 100" width="${kk}" height="${kk}" class="k3">${inner}</svg>`;
    switch (ten) {
      case 'tru': return svg('<path d="M22,22 v56 a28,10 0 0 0 56,0 v-56" class="k3-mat"/><ellipse cx="50" cy="22" rx="28" ry="10" class="k3-tren"/>');
      case 'cau': return svg('<circle cx="50" cy="52" r="36" class="k3-mat"/><ellipse cx="50" cy="52" rx="36" ry="11" class="k3-vien"/><circle cx="38" cy="38" r="8" class="k3-sang"/>');
      case 'lapPhuong': return svg('<polygon points="20,34 62,34 62,80 20,80" class="k3-mat"/><polygon points="20,34 38,18 80,18 62,34" class="k3-tren"/><polygon points="62,34 80,18 80,64 62,80" class="k3-ben"/>');
      case 'hopCN': return svg('<polygon points="8,44 70,44 70,82 8,82" class="k3-mat"/><polygon points="8,44 28,28 90,28 70,44" class="k3-tren"/><polygon points="70,44 90,28 90,66 70,82" class="k3-ben"/>');
      default: return '';
    }
  };
  VE.khoi3d = h => HV.khoi3d(h.ten, h.co);

  /* Hình điểm – đoạn: {diem:[{x,y,ten}], doan:[[i,j,'3 cm']], gap:true} trong khung 0..300 x 0..h */
  VE.diem = h => {
    const H = h.cao || 160;
    let s = `<svg viewBox="0 0 300 ${H}" class="hv-svg" role="img">`;
    (h.doan || []).forEach(([i, j, nhan]) => {
      const a = h.diem[i], b = h.diem[j];
      s += `<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" class="hp-net"/>`;
      if (nhan) {
        const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
        const dx = b.y - a.y, dy = a.x - b.x, l = Math.hypot(dx, dy) || 1;
        s += `<text x="${mx + dx / l * 16}" y="${my + dy / l * 16 + 5}" text-anchor="middle" class="hp-do">${nhan}</text>`;
      }
    });
    h.diem.forEach(p => {
      if (!h.anDiem) s += `<circle cx="${p.x}" cy="${p.y}" r="5" class="hp-diem"/>`;
      if (p.ten) s += `<text x="${p.x + (p.dx || 0)}" y="${p.y + (p.dy || -12)}" text-anchor="middle" class="hp-chu">${p.ten}</text>`;
    });
    return s + '</svg>';
  };

  /* Hình quạt tam giác: đỉnh A, đáy có k điểm → đếm hình tam giác */
  VE.quat = h => {
    const k = h.k, A = { x: 150, y: 18 }, ten = 'BCDEFGH';
    let s = '<svg viewBox="0 0 300 170" class="hv-svg">';
    const day = T.lap(k, i => ({ x: 30 + i * (240 / (k - 1)), y: 150 }));
    s += `<line x1="${day[0].x}" y1="150" x2="${day[k - 1].x}" y2="150" class="hp-net"/>`;
    day.forEach(p => { s += `<line x1="${A.x}" y1="${A.y}" x2="${p.x}" y2="${p.y}" class="hp-net"/>`; });
    s += `<circle cx="${A.x}" cy="${A.y}" r="4" class="hp-diem"/><text x="${A.x}" y="${A.y - 6}" text-anchor="middle" class="hp-chu">A</text>`;
    day.forEach((p, i) => { s += `<circle cx="${p.x}" cy="150" r="4" class="hp-diem"/><text x="${p.x}" y="168" text-anchor="middle" class="hp-chu">${ten[i]}</text>`; });
    return s + '</svg>';
  };

  /* Hình chữ nhật chia thành các phần dọc (đếm hình chữ nhật / tứ giác) */
  VE.oDoc = h => {
    const k = h.k;
    let s = '<svg viewBox="0 0 300 110" class="hv-svg"><rect x="20" y="15" width="260" height="80" class="hp-to-nhat"/>';
    for (let i = 1; i < k; i++) { const x = 20 + i * 260 / k; s += `<line x1="${x}" y1="15" x2="${x}" y2="95" class="hp-net"/>`; }
    return s + '</svg>';
  };

  /* ---- Tháp số: {hang:[['19'],['[[0]]','4'],...]} hàng trên cùng trước; mỗi ô bằng tổng hai ô ngay dưới ---- */
  VE.thapSo = h => `<div class="thap-so">${h.hang.map(r => `<div class="ts-hang">${r.map(x => `<span class="ts-o">${x}</span>`).join('')}</div>`).join('')}</div>`;

  /* ---- Lưới số (hình vuông kì diệu): {hang:[['14','35','[[0]]'],...]} ---- */
  VE.luoiSo = h => `<div class="luoi-so" style="--cot:${h.hang[0].length}">${h.hang.map(r => r.map(x => `<span class="ls-o">${x}</span>`).join('')).join('')}</div>`;

  /* ---- Thước kẻ: {max:20, vat:[{tu:0, den:8, nhan:'bút chì'}]} ---- */
  VE.thuoc = h => {
    const max = h.max || 10, w = 300, x0 = 15, buoc = (w - 2 * x0) / max;
    let s = `<svg viewBox="0 0 ${w} 100" class="hv-svg thuoc">`;
    (h.vat || []).forEach((v, k) => {
      const y = 22 + k * 14;
      s += `<rect x="${x0 + v.tu * buoc}" y="${y}" width="${(v.den - v.tu) * buoc}" height="12" rx="6" class="thuoc-vat"/>`;
      if (v.nhan) s += `<text x="${x0 + (v.tu + v.den) / 2 * buoc}" y="${y - 4}" text-anchor="middle" class="hp-do">${v.nhan}</text>`;
    });
    s += `<rect x="4" y="50" width="${w - 8}" height="40" rx="4" class="thuoc-than"/>`;
    for (let i = 0; i <= max; i++) {
      const x = x0 + i * buoc;
      s += `<line x1="${x}" y1="50" x2="${x}" y2="${i % 5 ? 60 : 66}" class="thuoc-vach"/>`;
      if (max <= 20 || i % 5 === 0) s += `<text x="${x}" y="82" text-anchor="middle" class="thuoc-so">${i}</text>`;
    }
    return s + '</svg><div class="hv-nhan">Đơn vị: cm</div>';
  };

  /* ---- Biểu đồ tranh: {hang:[{ten, bieu, so}], chuThich} ---- */
  VE.bieuDo = h => {
    let s = '<table class="bieu-do"><tbody>';
    h.hang.forEach(r => { s += `<tr><th>${r.ten}</th><td>${r.bieu.repeat(r.so)}</td></tr>`; });
    s += '</tbody></table>';
    if (h.chuThich) s += `<div class="hv-nhan">${h.chuThich}</div>`;
    return s;
  };

  /* ---- Hộp bi: {bi:[['🔴',3],['🔵',5]]} ---- */
  VE.hop = h => `<div class="hop-bi">${h.bi.map(([b, n]) => b.repeat(n)).join('')}</div>${h.nhan ? `<div class="hv-nhan">${h.nhan}</div>` : ''}`;

  /* ---- Toà nhà nhiều tầng ---- */
  VE.toaNha = h => {
    let s = '<div class="toa-nha">';
    for (let t = h.tang; t >= 1; t--) s += `<div class="tang${h.danhDau && h.danhDau.includes(t) ? ' danh-dau' : ''}">Tầng ${t}${h.nguoi === t ? ' 🧒' : ''}</div>`;
    return s + '</div>';
  };

  /* ---- Cỗ máy: ô đầu → bước → … → kết quả. {dau:'?', buoc:['+3','+2'], cuoi:16} ---- */
  VE.coMay = h => {
    let s = `<div class="co-may"><div class="cm-o">${h.dau}</div>`;
    h.buoc.forEach((b, i) => {
      s += `<div class="cm-mui">${b}<span>➜</span></div><div class="cm-o">${i === h.buoc.length - 1 ? h.cuoi : (h.giua && h.giua[i] != null ? h.giua[i] : '…')}</div>`;
    });
    return s + '</div>';
  };

  /* ---- Hàng lặp lại theo quy luật: {ds:['🔴','🔵',...]} ---- */
  VE.hang = h => `<div class="hang-ql">${h.ds.map(x => `<span>${x}</span>`).join('')}</div>`;

  /* ---- Phép tính đặt cột: {dong:[['', '4','7'], ['+','2','5']], kq:['[[0]]','[[1]]']} ---- */
  VE.datTinh = h => {
    const w = Math.max(...h.dong.map(r => r.length), h.kq.length + 1);
    const pad = r => T.lap(w - r.length, () => '').concat(r);
    let s = '<div class="dat-tinh">';
    h.dong.forEach((r, i) => { s += `<div class="dt-hang${i === h.dong.length - 1 ? ' dt-gach' : ''}">${pad(r).map(c => `<span>${c}</span>`).join('')}</div>`; });
    s += `<div class="dt-hang dt-kq">${pad(h.kq).map(c => `<span>${c}</span>`).join('')}</div>`;
    return s + '</div>';
  };

  /* ---- Bảng điền số (như bảng Số hạng – Tổng) ---- */
  VE.bang = h => {
    let s = '<div class="bang-cuon"><table class="bang-dien"><tbody>';
    h.hang.forEach(r => { s += `<tr><th>${r[0]}</th>${r.slice(1).map(c => `<td>${c}</td>`).join('')}</tr>`; });
    return s + '</tbody></table></div>';
  };

  g.HV = HV;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* ---- js/chuong-trinh.js ---- */
/* Khung chương trình: các Đảo (theo chủ đề Toán 2 Cánh Diều) và các Dạng bài.
   Mỗi dạng bài có 3 mức: 1 Cơ bản · 2 Vận dụng · 3 Nâng cao. Mỗi mức là một hàm sinh câu hỏi ngẫu nhiên.
   Thêm dạng mới: CT.them({ id, dao, ten, bieu, ghiNho, cap:[f1, f2, f3] }) trong một file de-*.js. */
(function (g) {
  'use strict';
  const CT = { dao: [], dang: {} };

  CT.dao = [
    { id: 'so100', ten: 'Đảo Số Đến 100', bieu: '🏝️', mau: 'var(--d1)', hk: 1, cd: 'Chủ đề 1 · Ôn tập và bổ sung', dang: [] },
    { id: 'qua10', ten: 'Đảo Qua Mười', bieu: '🔟', mau: 'var(--d2)', hk: 1, cd: 'Chủ đề 2 · Cộng, trừ trong phạm vi 20', dang: [] },
    { id: 'can', ten: 'Đảo Cân và Bình', bieu: '⚖️', mau: 'var(--d3)', hk: 1, cd: 'Chủ đề 3 · Ki-lô-gam, lít', dang: [] },
    { id: 'conho', ten: 'Đảo Có Nhớ', bieu: '🧮', mau: 'var(--d4)', hk: 1, cd: 'Chủ đề 4 · Cộng, trừ có nhớ trong phạm vi 100', dang: [] },
    { id: 'hinh', ten: 'Đảo Hình Học', bieu: '📐', mau: 'var(--d5)', hk: 1, cd: 'Chủ đề 5 và 9 · Hình phẳng, hình khối', dang: [] },
    { id: 'gio', ten: 'Đảo Thời Gian', bieu: '⏰', mau: 'var(--d6)', hk: 1, cd: 'Chủ đề 6 · Ngày – giờ, giờ – phút, ngày – tháng', dang: [] },
    { id: 'nhan', ten: 'Đảo Nhân Chia', bieu: '✖️', mau: 'var(--d7)', hk: 2, cd: 'Chủ đề 8 · Phép nhân, phép chia', dang: [] },
    { id: 'so1000', ten: 'Đảo Số Đến 1000', bieu: '💯', mau: 'var(--d8)', hk: 2, cd: 'Chủ đề 10 · Các số trong phạm vi 1 000', dang: [] },
    { id: 'dodai', ten: 'Đảo Đo Dài và Tiền', bieu: '📏', mau: 'var(--d9)', hk: 2, cd: 'Chủ đề 11 · Độ dài, tiền Việt Nam', dang: [] },
    { id: 'cong1000', ten: 'Đảo Cộng Trừ 1000', bieu: '➕', mau: 'var(--d10)', hk: 2, cd: 'Chủ đề 12 · Cộng, trừ trong phạm vi 1 000', dang: [] },
    { id: 'thongke', ten: 'Đảo Thống Kê', bieu: '📊', mau: 'var(--d11)', hk: 2, cd: 'Chủ đề 13 · Thống kê, xác suất', dang: [] },
    { id: 'thamtu', ten: 'Đảo Thám Tử', bieu: '🕵️', mau: 'var(--d12)', hk: 0, cd: 'Tư duy nâng cao · dùng được cả năm', dang: [] }
  ];
  CT.timDao = id => CT.dao.find(d => d.id === id);
  CT.TEN_CAP = ['', 'Cơ bản', 'Vận dụng', 'Nâng cao'];

  CT.them = function (d) {
    CT.dang[d.id] = d;
    const dao = CT.timDao(d.dao);
    if (dao) dao.dang.push(d.id);
  };

  /* Sinh 1 câu của dạng ở mức cap; gắn mã dạng để thống kê. */
  CT.sinh = function (idDang, cap) {
    const d = CT.dang[idDang];
    const f = d.cap[cap - 1] || d.cap[d.cap.length - 1];
    const c = f();
    c.dang = idDang; c.cap = cap;
    return c;
  };

  /* ------------------------------------------------------------------
     Q: hàm dựng câu hỏi. Mọi câu đều là dữ liệu thuần (lưu được).
       goiY: ['chữ', {hoi:'...', dap:13}]  – gợi ý dạng câu hỏi nhỏ con tự trả lời
       loiGiai: ['dòng 1', 'dòng 2']          – cách giải hiện sau khi làm xong
       saiThuong: {'15': 'Lời nhắc khi con trả lời 15'}
     ------------------------------------------------------------------ */
  const Q = {};
  Q.so = (de, dapAn, o) => Object.assign({ loai: 'so', de, dapAn }, o);
  Q.o = (de, dapAn, o) => Object.assign({ loai: 'o', de, dapAn }, o);
  Q.chon = (de, luaChon, dapAn, o) => Object.assign({ loai: 'chon', de, luaChon, dapAn }, o);
  Q.nhieu = (de, luaChon, dung, o) => Object.assign({ loai: 'chonNhieu', de, luaChon, dung }, o);
  Q.sapXep = (de, luaChon, dapAn, o) => Object.assign({ loai: 'sapXep', de, luaChon, dapAn }, o);
  Q.tha = (de, luaChon, dapAn, o) => Object.assign({ loai: 'keoTha', de, luaChon, dapAn }, o);
  Q.dongHo = (de, gio, phut, o) => Object.assign({ loai: 'dongHo', de, dapAn: { gio, phut } }, o);
  Q.buoc = (de, buoc, o) => Object.assign({ loai: 'nhieuBuoc', de, buoc }, o);

  /* Câu chọn số: tự tạo phương án nhiễu gần đáp án (±1, ±10, đảo chữ số). */
  Q.chonSo = function (de, dung, them, o) {
    const ung = new Set();
    (them || []).forEach(x => { if (x !== dung && x >= 0) ung.add(x); });
    const gan = [dung + 1, dung - 1, dung + 10, dung - 10, dung + 2, dung - 2];
    if (dung >= 10 && dung < 100 && dung % 11) gan.push(Number(String(dung).split('').reverse().join('')));
    T.tron(gan).forEach(x => { if (ung.size < 3 && x >= 0 && x !== dung) ung.add(x); });
    const ds = [dung].concat([...ung].slice(0, 3));
    return Q.chon(de, ds, 0, o);
  };

  /* Bài toán có lời văn theo đúng cách trình bày "Bài giải" trên lớp.
     phep: [{hoi:'số viên bi của hai bạn', a:16, dau:'+', b:3, kq:19}], donVi:'viên bi'
     Mỗi phép tính gồm 2 bước: chọn phép tính → viết phép tính. Cuối cùng: đáp số. */
  const TEN_PHEP = { '+': 'Phép cộng (+)', '−': 'Phép trừ (−)', '×': 'Phép nhân (×)', ':': 'Phép chia (:)' };
  Q.giaiToan = function (o) {
    const buoc = [];
    const dsPhep = o.phep.length > 1 || o.phep.some(p => p.dau === '×' || p.dau === ':') ? ['+', '−', '×', ':'] : ['+', '−'];
    o.phep.forEach((p, i) => {
      const cau = p.cau || p.hoi.charAt(0).toUpperCase() + p.hoi.slice(1) + ' là:';
      const dv = p.donVi || o.donVi;
      buoc.push(Q.chon(p.cau ? `<b>Bước ${i * 2 + 1}.</b> Câu lời giải: “${p.cau}”<br>Con làm phép tính gì?` : `<b>Bước ${i * 2 + 1}.</b> Muốn tìm <b>${p.hoi}</b>, con làm phép tính gì?`,
        dsPhep.map(x => TEN_PHEP[x]), dsPhep.indexOf(p.dau),
        { giuThuTu: true, ghi: cau, goiY: p.goiYPhep || o.goiYPhep, saiThuong: p.saiPhep }));
      const khac = (p.dau === '+' || p.dau === '×') && p.a !== p.b ? { dapAnKhac: [[p.b, p.a, p.kq]] } : {};
      const ngoac = dv ? ` (${dv})` : '';
      buoc.push(Q.o(`<b>Bước ${i * 2 + 2}.</b> Viết phép tính:<div class="dong-tinh">[[0]] ${p.dau} [[1]] = [[2]] <span class="don-vi">${ngoac}</span></div>`,
        [p.a, p.b, p.kq], Object.assign({ ghiMau: `${p.a} ${p.dau} ${p.b} = ${p.kq}${ngoac}`, goiY: p.goiY }, khac)));
    });
    const cuoi = o.phep[o.phep.length - 1];
    buoc.push(Q.o(`<b>Bước cuối.</b> Viết đáp số:<div class="dong-tinh">Đáp số: [[0]] <span class="don-vi">${o.donVi}</span></div>`,
      [o.dapSo != null ? o.dapSo : cuoi.kq], { ghiMau: `Đáp số: ${o.dapSo != null ? o.dapSo : cuoi.kq}${o.donVi ? ' ' + o.donVi : ''}.` }));
    return Q.buoc(o.de, buoc, {
      hinh: o.hinh, goiY: o.goiY, giaiToan: true,
      loiGiai: o.loiGiai || o.phep.map(p => `${p.cau || p.hoi.charAt(0).toUpperCase() + p.hoi.slice(1) + ' là:'} ${p.a} ${p.dau} ${p.b} = ${p.kq}${(p.donVi || o.donVi) ? ` (${p.donVi || o.donVi})` : ''}`)
        .concat([`Đáp số: ${o.dapSo != null ? o.dapSo : cuoi.kq}${o.donVi ? ' ' + o.donVi : ''}.`])
    });
  };

  /* Những số đặc biệt dùng trong đề nâng cao (theo cách gọi trên phiếu bài tập). */
  CT.SO_DB = [
    { ten: 'số bé nhất có một chữ số', gt: 0 },
    { ten: 'số lớn nhất có một chữ số', gt: 9 },
    { ten: 'số bé nhất có hai chữ số', gt: 10 },
    { ten: 'số lớn nhất có hai chữ số', gt: 99 },
    { ten: 'số bé nhất có hai chữ số giống nhau', gt: 11 },
    { ten: 'số lớn nhất có hai chữ số giống nhau', gt: 99 },
    { ten: 'số bé nhất có hai chữ số khác nhau', gt: 10 },
    { ten: 'số lớn nhất có hai chữ số khác nhau', gt: 98 },
    { ten: 'số tròn chục bé nhất có hai chữ số', gt: 10 },
    { ten: 'số tròn chục lớn nhất có hai chữ số', gt: 90 }
  ];
  CT.BANG_SO_DB = `<table class="bang-bk"><tbody>${CT.SO_DB.map(s => `<tr><td>${s.ten.charAt(0).toUpperCase() + s.ten.slice(1)}</td><td><b>${s.gt}</b></td></tr>`).join('')}</tbody></table>
    <p>“Số <b>nhỏ</b> nhất” cũng là “số <b>bé</b> nhất”.</p>`;

  g.CT = CT; g.Q = Q;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<!-- Các dạng bài, sắp theo đảo -->
<script>
/* ---- js/de-so-100.js ---- */
/* Đảo Số Đến 100 — Chủ đề 1: Ôn tập và bổ sung (kèm các dạng nâng cao trên phiếu Tuần 1, 2, 4, 5). */
(function () {
  'use strict';
  const { n, c, tron, lap } = T;
  const DB = CT.SO_DB;
  const hoa = s => s.charAt(0).toUpperCase() + s.slice(1);

  /* ================= 1. Chục và đơn vị ================= */
  const MO_TA_CHUC = [
    k => ({ ten: `số liền trước của ${k + 1}`, gt: k, hoi: `Số liền trước của ${k + 1} là?` }),
    k => ({ ten: `số liền sau của ${k - 1}`, gt: k, hoi: `Số liền sau của ${k - 1} là?` })
  ];
  CT.them({
    id: 'cau-tao-so', dao: 'so100', ten: 'Chục và đơn vị', bieu: '🧱',
    ghiNho: `<p><b>1 chục = 10 đơn vị.</b> Số có hai chữ số gồm <b>chữ số hàng chục</b> (bên trái) và <b>chữ số hàng đơn vị</b> (bên phải).</p>
      <p>Ví dụ: 47 gồm 4 chục và 7 đơn vị. Viết thành tổng: 47 = 40 + 7.</p>
      <p>Chữ số 0 không đứng ở hàng chục của số có hai chữ số.</p>`,
    cap: [
      () => {
        const ch = n(1, 9), dv = n(0, 9), so = ch * 10 + dv;
        return c([
          () => Q.so('Hình dưới đây biểu diễn số nào?', so, {
            hinh: { kieu: 'khoi', chuc: ch, dv },
            goiY: ['Mỗi thanh dài là 1 chục, tức là 10 khối nhỏ.', { hoi: 'Có mấy thanh chục?', dap: ch }, { hoi: 'Có mấy khối nhỏ lẻ?', dap: dv }],
            loiGiai: [`${ch} chục và ${dv} đơn vị viết là ${so}.`]
          }),
          () => Q.so(`Số gồm <b>${ch} chục</b> và <b>${dv} đơn vị</b> là:`, so, {
            goiY: ['Chữ số hàng chục viết trước, chữ số hàng đơn vị viết sau.'],
            loiGiai: [`Hàng chục là ${ch}, hàng đơn vị là ${dv} → ${so}.`],
            saiThuong: { [dv * 10 + ch]: 'Con viết ngược rồi. Hàng chục đứng trước nhé.' }
          }),
          () => Q.o(`Số <b>${so}</b> gồm [[0]] chục và [[1]] đơn vị.`, [ch, dv], {
            goiY: [`Chữ số bên trái của ${so} là hàng chục.`], loiGiai: [`${so} gồm ${ch} chục và ${dv} đơn vị.`]
          }),
          () => {
            const sai = new Set();
            [dv * 10 + ch, so + 1, so - 1, so + 10, so - 10].forEach(x => { if (x >= 10 && x <= 99 && x !== so) sai.add(x); });
            const ds = [so].concat(tron([...sai]).slice(0, 3));
            return Q.chon(`Số <b>${so}</b> đọc là:`, ds.map(T.soChu), 0, { loiGiai: [`${so} đọc là “${T.soChu(so)}”.`] });
          },
          () => Q.so(`Số “<b>${T.soChu(so)}</b>” viết là:`, so, { loiGiai: [`“${T.soChu(so)}” viết là ${so}.`] })
        ])();
      },
      () => {
        const ch = n(1, 9), dv = n(1, 9), so = ch * 10 + dv;
        return c([
          () => Q.o(`Viết số thành tổng của số tròn chục và số đơn vị:<div class="dong-tinh">${so} = [[0]] + [[1]]</div>`, [ch * 10, dv], {
            goiY: [`${so} gồm ${ch} chục và ${dv} đơn vị. ${ch} chục là mấy?`], loiGiai: [`${so} = ${ch * 10} + ${dv}`]
          }),
          () => {
            const ch2 = n(1, 7), le = n(11, 19), tong = ch2 * 10 + le;
            return Q.so(`Số gồm <b>${ch2} chục</b> và <b>${le} đơn vị</b> là:`, tong, {
              goiY: [{ hoi: `${le} đơn vị gồm 1 chục và mấy đơn vị?`, dap: le - 10 }, { hoi: `Vậy có tất cả mấy chục?`, dap: ch2 + 1 }],
              loiGiai: [`${le} đơn vị = 1 chục và ${le - 10} đơn vị.`, `${ch2} chục + 1 chục = ${ch2 + 1} chục. Số đó là ${tong}.`],
              saiThuong: { [ch2 * 10 + le - 10]: 'Gần đúng! 10 đơn vị đổi thành 1 chục, con nhớ cộng thêm 1 chục nhé.' }
            });
          },
          () => {
            const t = n(1, 7), so2 = t * 10 + t + 2;
            return Q.so(`Tìm số có hai chữ số, biết chữ số hàng chục là ${t} và chữ số hàng đơn vị hơn chữ số hàng chục 2 đơn vị.`, so2, {
              goiY: [{ hoi: 'Chữ số hàng đơn vị là?', dap: t + 2 }], loiGiai: [`Hàng đơn vị: ${t} + 2 = ${t + 2}. Số đó là ${so2}.`]
            });
          },
          () => Q.so(`<b>${ch} chục</b> viết là:`, ch * 10, { loiGiai: [`${ch} chục = ${ch * 10}.`] })
        ])();
      },
      () => c([
        () => {
          const ch = n(1, 9);
          const A = ch === 9 ? { ten: 'số lớn nhất có một chữ số', gt: 9, hoi: 'Số lớn nhất có một chữ số là?' } : c(MO_TA_CHUC)(ch);
          const dvLuaChon = [
            { ten: 'số lớn nhất có một chữ số', gt: 9, hoi: 'Số lớn nhất có một chữ số là?' },
            { ten: 'số bé nhất có một chữ số', gt: 0, hoi: 'Số bé nhất có một chữ số là?' },
            { ten: 'chữ số hàng chục', gt: ch, hoi: 'Chữ số hàng đơn vị bằng chữ số hàng chục, vậy là?' }
          ];
          const k = n(1, 8); dvLuaChon.push({ ten: `số liền sau của ${k - 1}`, gt: k, hoi: `Số liền sau của ${k - 1} là?` });
          if (ch <= 8) dvLuaChon.push({ ten: 'hơn chữ số hàng chục 1 đơn vị', gt: ch + 1, hoi: `${ch} + 1 = ?` });
          const B = c(dvLuaChon), so = ch * 10 + B.gt;
          return Q.so(`Tìm một số có hai chữ số, biết rằng chữ số hàng chục là ${A.ten}. Chữ số hàng đơn vị ${B.ten === 'chữ số hàng chục' ? 'bằng chữ số hàng chục' : B.ten === 'hơn chữ số hàng chục 1 đơn vị' ? B.ten : 'là ' + B.ten}. Vậy số đó là:`, so, {
            goiY: ['Tìm từng chữ số một.', { hoi: 'Chữ số hàng chục: ' + A.hoi, dap: ch }, { hoi: 'Chữ số hàng đơn vị: ' + B.hoi, dap: B.gt }],
            loiGiai: [`Chữ số hàng chục: ${ch}.`, `Chữ số hàng đơn vị: ${B.gt}.`, `Số đó là ${so}.`]
          });
        },
        () => {
          const coKhong = Math.random() < 0.6;
          let ds;
          do { ds = coKhong ? [0, n(1, 9), n(1, 9)] : [n(1, 9), n(1, 9), n(1, 9)]; } while (new Set(ds).size < 3);
          const lon = Math.random() < 0.5;
          const sx = ds.slice().sort((a, b) => b - a);
          let so;
          if (lon) so = sx[0] * 10 + sx[1];
          else { const kKhong = ds.filter(x => x > 0).sort((a, b) => a - b); const ch = kKhong[0]; const con = ds.filter(x => x !== ch).sort((a, b) => a - b); so = ch * 10 + con[0]; }
          return Q.so(`Từ ba chữ số <b>${ds.join(', ')}</b>, hãy lập số <b>${lon ? 'lớn nhất' : 'bé nhất'}</b> có hai chữ số khác nhau.`, so, {
            goiY: lon ? ['Muốn số lớn nhất: chữ số lớn nhất đặt ở hàng chục.', { hoi: 'Chữ số hàng chục là?', dap: Math.floor(so / 10) }, 'Hàng đơn vị lấy chữ số lớn nhất còn lại.']
              : ['Muốn số bé nhất: chữ số bé nhất đặt ở hàng chục, nhưng chữ số 0 không được đứng ở hàng chục.', { hoi: 'Chữ số hàng chục là?', dap: Math.floor(so / 10) }, 'Hàng đơn vị lấy chữ số bé nhất còn lại (có thể là 0).'],
            loiGiai: [`Hàng chục: ${Math.floor(so / 10)}, hàng đơn vị: ${so % 10}.`, `Số cần lập là ${so}.`],
            saiThuong: lon ? {} : { [ds.slice().sort((a, b) => a - b)[0] * 10 + ds.slice().sort((a, b) => a - b)[1]]: 'Số bắt đầu bằng 0 không phải số có hai chữ số đâu con.' }
          });
        }
      ])()
    ]
  });

  /* ================= 2. Số liền trước, số liền sau, tia số ================= */
  function tiaSo(buoc, dauMin) {
    const so = 7, dau = n(dauMin, Math.floor((99 - buoc * (so - 1)) / buoc)) * buoc;
    const vt = tron(lap(so, i => i).slice(1)).slice(0, 3).sort((a, b) => a - b);
    const o = {}; vt.forEach((v, i) => { o[v] = i; });
    return Q.o(`Điền số còn thiếu trên tia số:`, vt.map(v => dau + v * buoc), {
      hinh: { kieu: 'tia', dau, buoc, so, o },
      goiY: [`Hai vạch liền nhau hơn kém nhau ${buoc} đơn vị.`, { hoi: `Số đứng sau ${dau} là?`, dap: dau + buoc }],
      loiGiai: [`Các số trên tia: ${lap(so, i => dau + i * buoc).join(', ')}.`]
    });
  }
  CT.them({
    id: 'lien-truoc-sau', dao: 'so100', ten: 'Liền trước, liền sau, tia số', bieu: '➡️',
    ghiNho: `<p><b>Số liền sau</b> của một số thì lớn hơn số đó 1 đơn vị (cộng 1). <b>Số liền trước</b> thì bé hơn 1 đơn vị (trừ 1).</p>
      <p>Ví dụ: số liền trước của 40 là 39, số liền sau của 40 là 41.</p>
      <p>Trên tia số, số bên phải lớn hơn số bên trái.</p>`,
    cap: [
      () => {
        const x = n(11, 98);
        return c([
          () => Q.so(`Số liền sau của <b>${x}</b> là:`, x + 1, { goiY: ['Số liền sau thì thêm 1.'], loiGiai: [`${x} + 1 = ${x + 1}`], saiThuong: { [x - 1]: 'Đó là số liền trước. Liền sau thì đếm tiếp lên.' } }),
          () => Q.so(`Số liền trước của <b>${x}</b> là:`, x - 1, { goiY: ['Số liền trước thì bớt 1.'], loiGiai: [`${x} − 1 = ${x - 1}`], saiThuong: { [x + 1]: 'Đó là số liền sau. Liền trước thì đếm lùi xuống.' } }),
          () => Q.so(`Số ở giữa <b>${x - 1}</b> và <b>${x + 1}</b> là:`, x, { loiGiai: [`${x - 1}, ${x}, ${x + 1}`] }),
          () => tiaSo(1, 1)
        ])();
      },
      () => {
        const x = n(12, 97);
        return c([
          () => tiaSo(c([2, 5, 10]), 0),
          () => Q.so(`Số liền trước của số liền sau của <b>${x}</b> là:`, x, {
            goiY: [{ hoi: `Số liền sau của ${x} là?`, dap: x + 1 }, { hoi: `Số liền trước của ${x + 1} là?`, dap: x }],
            loiGiai: [`Số liền sau của ${x} là ${x + 1}.`, `Số liền trước của ${x + 1} là ${x}.`]
          }),
          () => Q.so(`<b>${x}</b> là số liền sau của số nào?`, x - 1, { goiY: ['Số liền sau lớn hơn 1 đơn vị, vậy số cần tìm bé hơn.'], loiGiai: [`${x} là số liền sau của ${x - 1}.`], saiThuong: { [x + 1]: `${x + 1} là số liền sau của ${x} mới đúng. Con đọc lại đề nhé.` } }),
          () => Q.o(`Viết ba số liên tiếp, biết số ở giữa là <b>${x}</b>:<div class="dong-tinh">[[0]], ${x}, [[1]]</div>`, [x - 1, x + 1], { loiGiai: [`${x - 1}, ${x}, ${x + 1}`] })
        ])();
      },
      () => {
        const ds = DB.filter(s => s.gt > 0 && s.gt < 99);
        const truoc = Math.random() < 0.5;
        return c([
          () => {
            const B = c(DB.filter(s => s.gt > 0));
            const kq = truoc ? B.gt - 1 : B.gt + 1;
            return Q.so(`Số liền ${truoc ? 'trước' : 'sau'} của ${B.ten} là:`, kq, {
              goiY: [{ hoi: hoa(B.ten) + ' là?', dap: B.gt }, { hoi: `Số liền ${truoc ? 'trước' : 'sau'} của ${B.gt} là?`, dap: kq }],
              loiGiai: [`${hoa(B.ten)} là ${B.gt}.`, `Số liền ${truoc ? 'trước' : 'sau'} của ${B.gt} là ${kq}.`]
            });

          () => Q.so(`<div class="dong-tinh">${a} ${dau} ${b} = [[0]]</div>`, kq, { goiY: ['Tính hàng đơn vị trước, rồi đến hàng chục.'], loiGiai: [`${a} ${dau} ${b} = ${kq}`] }),
          () => Q.o('Đặt tính rồi tính (điền chữ số vào kết quả):', String(kq).split('').map(Number), {
            hinh: datTinh(a, b, dau, kq, true),
            goiY: [{ hoi: `Hàng đơn vị: ${a % 10} ${dau} ${b % 10} = ?`, dap: cong ? a % 10 + b % 10 : a % 10 - b % 10 }, 'Rồi tính hàng chục.'],
            loiGiai: [`Đơn vị: ${a % 10} ${dau} ${b % 10} = ${cong ? a % 10 + b % 10 : a % 10 - b % 10}`, `Chục: ${Math.floor(a / 10)} ${dau} ${Math.floor(b / 10)} = ${cong ? Math.floor(a / 10) + Math.floor(b / 10) : Math.floor(a / 10) - Math.floor(b / 10)}`, `Kết quả: ${kq}`]
          })
        ])();
      },
      () => {
        const cong = Math.random() < 0.5, [a, b] = capKhongNho(cong), kq = cong ? a + b : a - b;
        return c([
          () => cong ? Q.so(`<div class="dong-tinh">[[0]] + ${b} = ${kq}</div>`, a, { goiY: ['Số hạng chưa biết = tổng − số hạng đã biết.', { hoi: `${kq} − ${b} = ?`, dap: a }], loiGiai: [`${kq} − ${b} = ${a}`] })
            : Q.so(`<div class="dong-tinh">${a} − [[0]] = ${kq}</div>`, b, { goiY: ['Số trừ = số bị trừ − hiệu.', { hoi: `${a} − ${kq} = ?`, dap: b }], loiGiai: [`${a} − ${kq} = ${b}`] }),
          () => { const t1 = n(1, 5) * 10, t2 = n(1, 4) * 10, t3 = n(1, Math.floor((t1 + t2) / 10)) * 10; return Q.so(`<div class="dong-tinh">${t1} + ${t2} − ${t3} = [[0]]</div>`, t1 + t2 - t3, { goiY: [{ hoi: `${t1} + ${t2} = ?`, dap: t1 + t2 }], loiGiai: [`${t1} + ${t2} = ${t1 + t2}`, `${t1 + t2} − ${t3} = ${t1 + t2 - t3}`] }); },
          () => cong ? Q.so(`<div class="dong-tinh">[[0]] − ${b} = ${a}</div>`, kq, { goiY: ['Số bị trừ = hiệu + số trừ.'], loiGiai: [`${a} + ${b} = ${kq}`], saiThuong: { [a - b]: 'Muốn tìm số bị trừ, con lấy hiệu cộng với số trừ.' } }) : Q.so(`<div class="dong-tinh">${b} + [[0]] = ${a}</div>`, kq, { loiGiai: [`${a} − ${b} = ${kq}`] })
        ])();
      },
      () => {
        const cong = Math.random() < 0.5, [a, b] = capKhongNho(cong), kq = cong ? a + b : a - b, dau = cong ? '+' : '−';
        const sa = String(a).split(''), sb = String(b).padStart(2, '0').split(''), sk = String(kq).padStart(2, '0').split('');
        if (b < 10 || kq < 10) return Q.so(`<div class="dong-tinh">${a} ${dau} [[0]] = ${kq}</div>`, b, { loiGiai: [`${b}`] });
        const hang = [[sa[0], '[[0]]'], [dau, '[[1]]', sb[1]]];
        return Q.o('Điền chữ số thích hợp vào ô trống:', [Number(sa[1]), Number(sb[0])], {
          hinh: { kieu: 'datTinh', dong: hang, kq: sk },
          goiY: [cong ? `Hàng đơn vị: ô trống + ${sb[1]} = ${sk[1]}.` : `Hàng đơn vị: ô trống − ${sb[1]} = ${sk[1]}.`, { hoi: 'Chữ số hàng đơn vị của số trên là?', dap: Number(sa[1]) }, cong ? `Hàng chục: ${sa[0]} + ô trống = ${sk[0]}.` : `Hàng chục: ${sa[0]} − ô trống = ${sk[0]}.`],
          loiGiai: [`${a} ${dau} ${b} = ${kq}`]
        });
      }
    ]
  });

  /* ================= 8. Đếm số các số trong dãy (Phiếu Tuần 4 số 2) ================= */
  CT.them({
    id: 'dem-day-so', dao: 'so100', ten: 'Đếm số các số trong dãy', bieu: '🔢',
    ghiNho: `<p>Trong dãy số tự nhiên liên tiếp, muốn tìm số các số hạng, ta tính:</p>
      <p class="cong-thuc">Số các số hạng = (Số cuối − Số đầu) + 1</p>
      <p><b>Ví dụ:</b> Từ số 31 đến số 78 có bao nhiêu số có hai chữ số?<br>Ta có: (78 − 31) + 1 = 48. Vậy có 48 số.</p>
      <p>“Lớn hơn 34 nhưng nhỏ hơn 79”: không lấy 34 và 79 → đếm từ <b>35</b> đến <b>78</b>.</p>
      <p>Số có hai chữ số bắt đầu từ <b>10</b> và kết thúc ở <b>99</b>.</p>`,
    cap: [
      () => {
        const a = n(1, 40), b = a + n(4, 9);
        return Q.so(`Từ <b>${a}</b> đến <b>${b}</b> có tất cả bao nhiêu số?`, b - a + 1, {
          hinh: { kieu: 'chu', chu: `<div class="dai-so">${lap(b - a + 1, i => `<span>${a + i}</span>`).join('')}</div>` },
          goiY: ['Con đếm từng số trên dải số, nhớ đếm cả số đầu và số cuối.', `Cách nhanh: (${b} − ${a}) + 1.`],
          loiGiai: [`(${b} − ${a}) + 1 = ${b - a + 1}`, `Có ${b - a + 1} số.`],
          saiThuong: { [b - a]: 'Gần đúng! Con quên đếm số đầu tiên rồi: phải cộng thêm 1.' }
        });
      },
      () => {
        const a = n(10, 60), b = n(a + 8, 99);
        return Q.so(`Từ số <b>${a}</b> đến số <b>${b}</b> có tất cả bao nhiêu số có hai chữ số?`, b - a + 1, {
          goiY: [{ hoi: `Số cuối trừ số đầu: ${b} − ${a} = ?`, dap: b - a }, { hoi: 'Cộng thêm 1 được?', dap: b - a + 1 }],
          loiGiai: [`(${b} − ${a}) + 1 = ${b - a + 1}`],
          saiThuong: { [b - a]: 'Con quên cộng 1 rồi. Phải tính cả số đầu.', [b - a + 2]: 'Con cộng thừa rồi. Chỉ cộng thêm 1 thôi.' }
        });
      },
      () => c([
        () => {
          const a = n(10, 60), b = n(a + 10, 99), dau = a + 1, cuoi = b - 1, kq = cuoi - dau + 1;
          return Q.so(`Có bao nhiêu số lớn hơn <b>${a}</b> nhưng nhỏ hơn <b>${b}</b>?`, kq, {
            goiY: [{ hoi: `Số đầu tiên lớn hơn ${a} là?`, dap: dau }, { hoi: `Số cuối cùng nhỏ hơn ${b} là?`, dap: cuoi }, { hoi: `(${cuoi} − ${dau}) + 1 = ?`, dap: kq }],
            loiGiai: [`Các số đó là ${dau}, ${dau + 1}, …, ${cuoi}.`, `(${cuoi} − ${dau}) + 1 = ${kq}`],
            saiThuong: { [b - a + 1]: `Không lấy ${a} và ${b} con nhé, vì đề nói “lớn hơn” và “nhỏ hơn”.`, [b - a]: `Không lấy cả ${a} và ${b}. Số đầu là ${dau}, số cuối là ${cuoi}.` }
          });
        },
        () => {
          const x = n(20, 90), be = Math.random() < 0.5;
          const kq = be ? x - 10 : 99 - x;
          return Q.so(`Có bao nhiêu số có hai chữ số ${be ? 'bé' : 'lớn'} hơn <b>${x}</b>?`, kq, {
            goiY: be ? [{ hoi: 'Số có hai chữ số bé nhất là?', dap: 10 }, { hoi: `Số cuối cùng bé hơn ${x} là?`, dap: x - 1 }, { hoi: `(${x - 1} − 10) + 1 = ?`, dap: kq }]
              : [{ hoi: `Số đầu tiên lớn hơn ${x} là?`, dap: x + 1 }, { hoi: 'Số có hai chữ số lớn nhất là?', dap: 99 }, { hoi: `(99 − ${x + 1}) + 1 = ?`, dap: kq }],
            loiGiai: be ? [`Các số từ 10 đến ${x - 1}.`, `(${x - 1} − 10) + 1 = ${kq}`] : [`Các số từ ${x + 1} đến 99.`, `(99 − ${x + 1}) + 1 = ${kq}`],
            saiThuong: be ? { [x]: 'Số có hai chữ số bắt đầu từ 10, không phải từ 0 hay 1.', [x - 1]: 'Số có hai chữ số bắt đầu từ 10.' } : { [99 - x + 1]: `Không lấy số ${x} vì đề nói “lớn hơn”.` }
          });
        },
        () => {
          const loai = c([['một chữ số', 10, 'Các số có một chữ số: 0, 1, 2, …, 9.'], ['hai chữ số', 90, 'Các số có hai chữ số: từ 10 đến 99 → (99 − 10) + 1 = 90.'], ['ba chữ số', 1, 'Chỉ có số 100.']]);
          return Q.so(`Trong các số từ 0 đến 100, có bao nhiêu số có ${loai[0]}?`, loai[1], { goiY: [loai[0] === 'một chữ số' ? 'Đừng quên số 0 cũng là số có một chữ số.' : 'Tìm số đầu và số cuối của nhóm đó.'], loiGiai: [loai[2]], saiThuong: { 9: 'Con quên số 0 rồi.', 89: 'Con quên cộng 1 rồi.' } });
        }
      ])()
    ]
  });

  /* ================= 9. Tìm số theo điều kiện chữ số (bảng số) ================= */
  const BANG = lap(90, i => i + 10);
  const tongCS = x => Math.floor(x / 10) + x % 10;
  function bang(de, loc, goiY, loiGiai) {
    const dung = BANG.map((x, i) => loc(x) ? i : -1).filter(i => i >= 0);
    return Q.nhieu(de, BANG, dung, { luoi: 10, nho: true, goiY, loiGiai: loiGiai || [BANG.filter(loc).join(', ')] });
  }
  CT.them({
    id: 'chu-so', dao: 'so100', ten: 'Tìm số theo chữ số', bieu: '🔎',
    ghiNho: `<p>Muốn tìm tất cả các số thỏa mãn điều kiện, con <b>đi lần lượt từng hàng chục</b> từ 1 đến 9 để không bỏ sót.</p>
      <p>Ví dụ: số có hai chữ số mà tổng hai chữ số bằng 5: hàng chục 1 → 14; 2 → 23; 3 → 32; 4 → 41; 5 → 50. Có 5 số.</p>
      <p>“Hai chữ số khác nhau” thì bỏ các số như 33.</p>`,
    cap: [
      () => {
        if (Math.random() < 0.5) { const ch = n(1, 9); return bang(`Chọn tất cả các số có chữ số <b>hàng chục là ${ch}</b>:`, x => Math.floor(x / 10) === ch, ['Hàng chục là chữ số bên trái.']); }
        const d = n(0, 9); return bang(`Chọn tất cả các số có chữ số <b>hàng đơn vị là ${d}</b>:`, x => x % 10 === d, ['Hàng đơn vị là chữ số bên phải. Các số này nằm cùng một cột.']);
      },
      () => {
        if (Math.random() < 0.6) { const k = n(3, 9); return bang(`Chọn tất cả các số có hai chữ số mà <b>tổng hai chữ số bằng ${k}</b>:`, x => tongCS(x) === k, ['Thử lần lượt hàng chục 1, 2, 3…', `Hàng chục là 1 thì hàng đơn vị là ${k - 1}.`]); }
        return bang('Chọn tất cả các số có hai chữ số mà khi đọc từ trái sang phải hay từ phải sang trái thì <b>giá trị số không đổi</b>:', x => Math.floor(x / 10) === x % 10, ['Ví dụ 23 đọc ngược thành 32 — khác nhau. Số nào đọc ngược vẫn như cũ?']);
      },
      () => c([
        () => { const k = n(4, 12); return bang(`Chọn tất cả các số có hai chữ số <b>khác nhau</b> mà tổng hai chữ số bằng <b>${k}</b>:`, x => tongCS(x) === k && Math.floor(x / 10) !== x % 10, ['Tìm hết các số có tổng chữ số bằng ' + k + ', rồi bỏ số có hai chữ số giống nhau.']); },
        () => {
          const k = n(2, 15), ds = BANG.filter(x => tongCS(x) === k);
          return Q.so(`Có bao nhiêu số có hai chữ số mà tổng hai chữ số bằng <b>${k}</b>?`, ds.length, { goiY: ['Viết lần lượt từng số theo hàng chục tăng dần.', { hoi: 'Số bé nhất như vậy là?', dap: ds[0] }], loiGiai: [`Các số: ${ds.join(', ')}.`, `Có ${ds.length} số.`] });
        },
        () => {
          const k = n(2, 17), lon = Math.random() < 0.5, ds = BANG.filter(x => tongCS(x) === k), kq = lon ? ds[ds.length - 1] : ds[0];
          return Q.so(`Số ${lon ? 'lớn' : 'nhỏ'} nhất có hai chữ số mà tổng các chữ số bằng <b>${k}</b> là:`, kq, {
            goiY: [lon ? 'Muốn số lớn nhất, chữ số hàng chục phải lớn nhất có thể.' : 'Muốn số nhỏ nhất, chữ số hàng chục phải nhỏ nhất có thể.', { hoi: 'Chữ số hàng chục là?', dap: Math.floor(kq / 10) }, { hoi: 'Chữ số hàng đơn vị là?', dap: kq % 10 }],
            loiGiai: [`Hàng chục ${Math.floor(kq / 10)}, hàng đơn vị ${kq % 10}: ${Math.floor(kq / 10)} + ${kq % 10} = ${k}.`, `Số đó là ${kq}.`]
          });
        }
      ])()
    ]
  });

  /* ================= 10. Chuỗi suy luận nhiều bước (Phiếu Tuần 5) ================= */
  const DB_PLUS = [
    { ten: 'số lớn nhất có hai chữ số mà tổng các chữ số bằng 3', gt: 30 },
    { ten: 'số lớn nhất có hai chữ số mà tổng các chữ số bằng 2', gt: 20 },
    { ten: 'số bé nhất có hai chữ số', gt: 10 },
    { ten: 'số lớn nhất có một chữ số', gt: 9 },
    { ten: 'số bé nhất có hai chữ số giống nhau', gt: 11 },
    { ten: 'số tròn chục bé nhất có hai chữ số', gt: 10 }
  ];
  CT.them({
    id: 'nhieu-buoc', dao: 'so100', ten: 'Thám tử nhiều bước', bieu: '🧩',
    ghiNho: `<p>Đề dài thì <b>chia nhỏ</b>: đọc từng câu, tìm từng số một, viết ra giấy rồi mới tính tiếp.</p>
      <p><b>Trong một phép cộng, tổng hơn số hạng thứ nhất bao nhiêu thì số hạng thứ hai bằng bấy nhiêu.</b> Ví dụ: tổng hơn số hạng thứ nhất 22 đơn vị → số hạng thứ hai là 22.</p>`,
    cap: [
      () => { const a = n(10, 40), b = n(5, 30), cc = n(1, a + b - 1); return Q.so(`Lấy <b>${a}</b> cộng với <b>${b}</b> rồi trừ đi <b>${cc}</b> được kết quả là:`, a + b - cc, { goiY: [{ hoi: `${a} + ${b} = ?`, dap: a + b }, { hoi: `${a + b} − ${cc} = ?`, dap: a + b - cc }], loiGiai: [`${a} + ${b} = ${a + b}`, `${a + b} − ${cc} = ${a + b - cc}`] }); },
      () => {
        const a = n(30, 90), b = n(10, a - 5), h = a - b, cc = n(5, 99 - h), cong = Math.random() < 0.5 || h < 10;
        const kq = cong ? h + cc : h - Math.min(cc, h);
        const c2 = cong ? cc : Math.min(cc, h);
        return Q.so(`Lấy hiệu của <b>${a}</b> và <b>${b}</b> rồi ${cong ? 'cộng với' : 'trừ đi'} <b>${c2}</b> được kết quả là:`, kq, { goiY: [{ hoi: `Hiệu của ${a} và ${b} là?`, dap: h }, { hoi: `${h} ${cong ? '+' : '−'} ${c2} = ?`, dap: kq }], loiGiai: [`${a} − ${b} = ${h}`, `${h} ${cong ? '+' : '−'} ${c2} = ${kq}`] });
      },
      () => c([
        () => {
          let A, B, x, s1, s2;
          do { A = c(DB_PLUS); B = c(DB.filter(s => s.gt >= 9 && s.gt <= 30)); x = n(5, 30); s1 = x + A.gt; s2 = s1 + B.gt; } while (s1 + s2 > 100);
          return Q.so(`Số thứ nhất là tổng của ${x} và ${A.ten}. Số thứ hai là tổng của số thứ nhất và ${B.ten}. Tìm tổng của hai số đó.`, s1 + s2, {
            goiY: [{ hoi: hoa(A.ten) + ' là?', dap: A.gt }, { hoi: `Số thứ nhất: ${x} + ${A.gt} = ?`, dap: s1 }, { hoi: hoa(B.ten) + ' là?', dap: B.gt }, { hoi: `Số thứ hai: ${s1} + ${B.gt} = ?`, dap: s2 }, { hoi: `Tổng hai số: ${s1} + ${s2} = ?`, dap: s1 + s2 }],
            loiGiai: [`${hoa(A.ten)} là ${A.gt}.`, `Số thứ nhất: ${x} + ${A.gt} = ${s1}.`, `Số thứ hai: ${s1} + ${B.gt} = ${s2}.`, `Tổng: ${s1} + ${s2} = ${s1 + s2}.`],
            saiThuong: { [s2]: 'Đó mới là số thứ hai. Đề hỏi tổng của hai số.' }
          });
        },
        () => {
          let t, s, d, sh1;
          do { t = n(2, 7); s = n(10, 30); d = n(10, 30); sh1 = t * 10 + s + 1; } while (sh1 + d > 99);
          return Q.so(`Trong một phép cộng, tổng hơn số hạng thứ nhất ${d} đơn vị. Số hạng thứ nhất là tổng của số tròn chục có chữ số hàng chục là ${t} và số liền sau của ${s}. Tính tổng của phép tính đó.`, sh1 + d, {
            goiY: [{ hoi: `Số tròn chục có chữ số hàng chục là ${t} là?`, dap: t * 10 }, { hoi: `Số liền sau của ${s} là?`, dap: s + 1 }, { hoi: `Số hạng thứ nhất: ${t * 10} + ${s + 1} = ?`, dap: sh1 }, `Tổng hơn số hạng thứ nhất ${d} đơn vị nghĩa là tổng = số hạng thứ nhất + ${d}.`],
            loiGiai: [`Số tròn chục: ${t * 10}. Liền sau của ${s}: ${s + 1}.`, `Số hạng thứ nhất: ${t * 10} + ${s + 1} = ${sh1}.`, `Tổng: ${sh1} + ${d} = ${sh1 + d}.`],
            saiThuong: { [sh1]: 'Đó là số hạng thứ nhất. Tổng còn hơn nó ' + d + ' đơn vị nữa.', [sh1 - d]: 'Tổng hơn số hạng thứ nhất, vậy phải cộng thêm.' }
          });
        },
        () => {
          const d = n(11, 40), a = n(10, 50);
          return Q.so(`Trong một phép cộng, tổng hơn số hạng thứ nhất <b>${d}</b> đơn vị. Số hạng thứ hai là:`, d, {
            goiY: ['Tổng = số hạng thứ nhất + số hạng thứ hai.', `Phần tổng hơn số hạng thứ nhất chính là số hạng thứ hai.`],
            hinh: { kieu: 'thanh', hang: [{ nhan: 'Tổng', doan: [{ dai: a, chu: 'Số hạng thứ nhất' }, { dai: d, chu: '?', loai: 'nhan-manh' }] }], ghiChu: `Phần tô đậm chính là ${d} đơn vị.` },
            loiGiai: [`Số hạng thứ hai = tổng − số hạng thứ nhất = ${d}.`]
          });
        }
      ])()
    ]
  });
})();

</script>
<script>
/* ---- js/de-qua-10.js ---- */
/* Đảo Qua Mười — Chủ đề 2: Phép cộng, phép trừ trong phạm vi 20; bài toán thêm, bớt; nhiều hơn, ít hơn;
   cùng các dạng nâng cao trên phiếu: tìm số ban đầu, thay đổi thành phần của phép tính. */
(function () {
  'use strict';
  const { n, c, tron, lap } = T;

  /* ================= 1. Cộng qua 10 ================= */
  const capCongQua10 = () => { const a = n(2, 9), b = n(11 - a, 9); return [a, b]; };
  CT.them({

            phep: [{ hoi: `số ${vat} ${B} có`, a, dau: nhieu ? '−' : '+', b: d, kq, saiPhep: { [nhieu ? 0 : 1]: `Đọc kĩ: ${A} ${nhieu ? 'nhiều' : 'ít'} hơn ${B}, vậy ${B} ${nhieu ? 'ít' : 'nhiều'} hơn ${A}.` } }], donVi: vat,
            goiY: [`${A} ${nhieu ? 'nhiều' : 'ít'} hơn ${B}. Vậy ${B} nhiều hơn hay ít hơn ${A}?`],
            hinh: { kieu: 'thanh', hang: nhieu ? [{ nhan: A, doan: [{ dai: a - d, chu: '' }, { dai: d, chu: d, loai: 'nhan-manh' }], sau: a }, { nhan: B, doan: [{ dai: a - d, chu: '?' }] }] : [{ nhan: A, doan: [{ dai: a, chu: a }] }, { nhan: B, doan: [{ dai: a, chu: '' }, { dai: d, chu: d, loai: 'nhan-manh' }], sau: '?' }] }
          });
        }
        const d2 = n(4, Math.min(15, a - 5)), b = a - d2;
        return Q.giaiToan({
          de: `Giỏ thứ nhất có ${a} ${vat}. Giỏ thứ hai có ít hơn giỏ thứ nhất ${d2} ${vat}. Hỏi cả hai giỏ có bao nhiêu ${vat}?`,
          phep: [{ hoi: `số ${vat} giỏ thứ hai có`, a, dau: '−', b: d2, kq: b }, { hoi: `số ${vat} cả hai giỏ có`, a, dau: '+', b, kq: a + b }], donVi: vat,
          goiY: ['Muốn tìm cả hai giỏ, trước hết phải biết giỏ thứ hai có bao nhiêu.']
        });
      }
    ]
  });

  /* ================= 6. Tìm số ban đầu (Phiếu Tuần 1 – tự luận) ================= */
  CT.them({
    id: 'tinh-nguoc', dao: 'qua10', ten: 'Tìm số ban đầu', bieu: '⏪',
    ghiNho: `<p><b>Đi ngược từ cuối về đầu:</b> phần nào đã <b>thêm vào</b> thì <b>bớt đi</b>; phần nào đã <b>bớt đi</b> thì <b>thêm vào</b>.</p>
      <p>Ví dụ: Mẹ bán đi 5 con gà thì còn lại 43 con. Trước khi bán: 43 + 5 = 48 con gà.</p>
      <p>Ví dụ: Bán 15 con vịt, rồi bà cho thêm 7 con thì có 47 con. Trước khi bà cho: 47 − 7 = 40. Trước khi bán: 40 + 15 = 55 con.</p>`,
    cap: [
      () => {
        const ban = Math.random() < 0.5, a = n(3, 15), con = n(10, 80 - a);
        if (ban) return Q.giaiToan({ de: `Nhà bạn Tú có một đàn gà. Sau khi mẹ bán đi ${a} con gà thì còn lại ${con} con gà. Hỏi trước khi bán, nhà bạn Tú có bao nhiêu con gà?`, hinh: { kieu: 'coMay', dau: '?', buoc: [`− ${a}`], cuoi: con }, phep: [{ hoi: 'số con gà nhà bạn Tú có trước khi bán', a: con, dau: '+', b: a, kq: con + a, saiPhep: { 1: 'Đã bán đi thì lúc đầu phải nhiều hơn bây giờ.' } }], donVi: 'con gà', goiYPhep: ['Lúc đầu nhiều hơn hay ít hơn lúc sau?'] });
        const co = con + a;
        return Q.giaiToan({ de: `Mai được mẹ cho thêm ${a} cái kẹo thì Mai có tất cả ${co} cái kẹo. Hỏi lúc đầu Mai có bao nhiêu cái kẹo?`, hinh: { kieu: 'coMay', dau: '?', buoc: [`+ ${a}`], cuoi: co }, phep: [{ hoi: 'số cái kẹo Mai có lúc đầu', a: co, dau: '−', b: a, kq: con, saiPhep: { 0: 'Được cho thêm thì lúc đầu phải ít hơn bây giờ.' } }], donVi: 'cái kẹo' });
      },
      () => {
        const chuc = n(1, 3), them = Math.random() < 0.5, kq = n(2, 6) * 10 + n(0, 9) * (Math.random() < 0.5 ? 1 : 0);
        if (them) {
          const cuoi = kq + chuc * 10;
          return Q.so(`Nếu cho Lan thêm ${chuc} chục nhãn vở thì Lan có ${cuoi} nhãn vở. Hỏi lúc đầu Lan có bao nhiêu nhãn vở?`, kq, {
            donVi: 'nhãn vở', hinh: { kieu: 'coMay', dau: '?', buoc: [`+ ${chuc} chục`], cuoi },
            goiY: [{ hoi: `${chuc} chục là bao nhiêu?`, dap: chuc * 10 }, { hoi: `Lúc đầu: ${cuoi} − ${chuc * 10} = ?`, dap: kq }],
            loiGiai: [`${chuc} chục = ${chuc * 10}.`, `Lúc đầu Lan có: ${cuoi} − ${chuc * 10} = ${kq} (nhãn vở).`], saiThuong: { [cuoi + chuc * 10]: 'Được cho thêm thì lúc đầu phải ít hơn.', [cuoi - chuc]: `${chuc} chục là ${chuc * 10} chứ không phải ${chuc}.` }
          });
        }
        const conLai = kq, dau = conLai + chuc * 10;
        return Q.so(`Tâm có một số nhãn vở. Tâm cho Hà ${chuc} chục nhãn vở thì Tâm còn lại ${conLai} nhãn vở. Hỏi lúc đầu Tâm có bao nhiêu nhãn vở?`, dau, {
          donVi: 'nhãn vở', hinh: { kieu: 'coMay', dau: '?', buoc: [`− ${chuc} chục`], cuoi: conLai },
          goiY: [{ hoi: `${chuc} chục là bao nhiêu?`, dap: chuc * 10 }, { hoi: `Lúc đầu: ${conLai} + ${chuc * 10} = ?`, dap: dau }],
          loiGiai: [`${chuc} chục = ${chuc * 10}.`, `Lúc đầu Tâm có: ${conLai} + ${chuc * 10} = ${dau} (nhãn vở).`], saiThuong: { [conLai - chuc * 10]: 'Đã cho đi thì lúc đầu phải nhiều hơn.' }
        });
      },
      () => c([
        () => {
          const a = n(2, 6), b = n(2, 6), cuoi = n(a + b + 3, 30), dau = cuoi - a - b;
          return Q.so(`Nếu mẹ cho Dũng thêm ${a} chiếc kẹo, anh cho Dũng thêm ${b} chiếc kẹo thì Dũng có tất cả ${cuoi} chiếc kẹo. Hỏi ban đầu Dũng có bao nhiêu chiếc kẹo?`, dau, {
            donVi: 'chiếc kẹo', hinh: { kieu: 'coMay', dau: '?', buoc: [`+ ${a}`, `+ ${b}`], cuoi },
            goiY: ['Đi ngược từ cuối.', { hoi: `Trước khi anh cho: ${cuoi} − ${b} = ?`, dap: cuoi - b }, { hoi: `Trước khi mẹ cho: ${cuoi - b} − ${a} = ?`, dap: dau }],
            loiGiai: [`Trước khi anh cho, Dũng có: ${cuoi} − ${b} = ${cuoi - b} (chiếc kẹo)`, `Ban đầu Dũng có: ${cuoi - b} − ${a} = ${dau} (chiếc kẹo)`, `Hoặc: cả mẹ và anh cho ${a} + ${b} = ${a + b}; ${cuoi} − ${a + b} = ${dau}.`]
          });
        },
        () => {
          const ban = n(8, 20), them = n(3, 12), cuoi = n(ban + 10, 70), giua = cuoi - them, dau = giua + ban;
          return Q.so(`Nhà Lan có một số con vịt. Mẹ Lan bán đi ${ban} con vịt, sau đó bà lại cho nhà Lan thêm ${them} con vịt thì nhà Lan có tất cả ${cuoi} con vịt. Hỏi lúc đầu nhà Lan có bao nhiêu con vịt?`, dau, {
            donVi: 'con vịt', hinh: { kieu: 'coMay', dau: '?', buoc: [`− ${ban}`, `+ ${them}`], cuoi },
            goiY: ['Đi ngược: việc xảy ra sau cùng thì tính ngược trước.', { hoi: `Trước khi bà cho thêm ${them} con: ${cuoi} − ${them} = ?`, dap: giua }, { hoi: `Trước khi bán ${ban} con: ${giua} + ${ban} = ?`, dap: dau }],
            loiGiai: [`Trước khi bà cho: ${cuoi} − ${them} = ${giua} (con vịt)`, `Lúc đầu: ${giua} + ${ban} = ${dau} (con vịt)`],
            saiThuong: { [cuoi + them - ban]: 'Con đổi ngược phép tính chưa đúng: bà cho thêm thì phải trừ đi, đã bán thì phải cộng vào.' }
          });
        },
        () => {
          const cho = n(3, 9), nhan = n(2, 9), cuoi = n(cho + 6, 30), giua = cuoi - nhan, dau = giua + cho;
          return Q.so(`Hà cho Hùng ${cho} quả bóng bay, Lan lại cho Hà ${nhan} quả bóng bay thì Hà có ${cuoi} quả bóng bay. Hỏi lúc đầu, Hà có bao nhiêu quả bóng bay?`, dau, {
            donVi: 'quả bóng bay', hinh: { kieu: 'coMay', dau: '?', buoc: [`− ${cho}`, `+ ${nhan}`], cuoi },
            goiY: ['Hà cho đi thì số bóng của Hà ít đi; Hà được cho thì nhiều lên.', { hoi: `Trước khi Lan cho: ${cuoi} − ${nhan} = ?`, dap: giua }, { hoi: `Trước khi Hà cho Hùng: ${giua} + ${cho} = ?`, dap: dau }],
            loiGiai: [`${cuoi} − ${nhan} = ${giua}`, `${giua} + ${cho} = ${dau}`, `Lúc đầu Hà có ${dau} quả bóng bay.`]
          });
        }
      ])()
    ]
  });

  /* ================= 7. Thay đổi thành phần (Phiếu Tuần 5 bài 7, 8, 9) ================= */
  CT.them({
    id: 'thay-doi', dao: 'qua10', ten: 'Thay đổi số hạng, số trừ', bieu: '🔄',
    ghiNho: `<p><b>Phép cộng:</b> giữ nguyên một số hạng, số hạng kia <b>thêm</b> (bớt) bao nhiêu thì tổng cũng <b>thêm</b> (bớt) bấy nhiêu.</p>
      <p><b>Phép trừ:</b> số bị trừ thêm bao nhiêu thì hiệu thêm bấy nhiêu. Nhưng <b>số trừ thêm</b> bao nhiêu thì <b>hiệu bớt</b> bấy nhiêu (trừ nhiều hơn thì còn ít hơn).</p>
      <p>Ví dụ: Hai số có hiệu 56. Giữ nguyên số bị trừ, thêm vào số trừ 3 → hiệu mới 56 − 3 = 53.</p>`,
    cap: [
      () => {
        const a = n(11, 40), b = n(11, 40), k = n(2, 9), them = Math.random() < 0.5;
        const t = a + b, moi = them ? t + k : t - k;
        return Q.so(`<div class="dong-tinh">${a} + ${b} = ${t}</div>Nếu giữ nguyên ${a} và ${them ? `thêm ${k} đơn vị vào số ${b}` : `bớt ${k} đơn vị ở số ${b}`} thì tổng mới là:`, moi, {
          hinh: { kieu: 'thanh', hang: [{ nhan: 'Tổng cũ', doan: [{ dai: a, chu: a }, { dai: b, chu: b }] }, { nhan: 'Tổng mới', doan: [{ dai: a, chu: a }, { dai: them ? b + k : b - k, chu: them ? `${b} + ${k}` : `${b} − ${k}`, loai: 'nhan-manh' }] }] },
          goiY: [{ hoi: `Số hạng mới: ${b} ${them ? '+' : '−'} ${k} = ?`, dap: them ? b + k : b - k }, { hoi: `Tổng mới: ${a} + ${them ? b + k : b - k} = ?`, dap: moi }],
          loiGiai: [`${a} + ${them ? b + k : b - k} = ${moi}`, `Nhận xét: tổng cũng ${them ? 'thêm' : 'bớt'} ${k} đơn vị: ${t} ${them ? '+' : '−'} ${k} = ${moi}.`]
        });
      },
      () => {
        const cong = Math.random() < 0.5, t = n(30, 90), k = n(3, 15), them = Math.random() < 0.5;
        if (cong) {
          const moi = them ? t + k : t - k;
          return Q.so(`Hai số có tổng là <b>${t}</b>. Nếu giữ nguyên số hạng thứ nhất và ${them ? 'thêm vào' : 'giảm bớt'} số hạng thứ hai <b>${k}</b> đơn vị thì tổng mới bằng bao nhiêu?`, moi, {
            goiY: [`Số hạng thứ hai ${them ? 'thêm' : 'bớt'} ${k} thì tổng cũng ${them ? 'thêm' : 'bớt'} ${k}.`, { hoi: `${t} ${them ? '+' : '−'} ${k} = ?`, dap: moi }],
            loiGiai: [`Tổng mới: ${t} ${them ? '+' : '−'} ${k} = ${moi}`], saiThuong: { [them ? t - k : t + k]: 'Ngược rồi. Số hạng thêm thì tổng thêm, số hạng bớt thì tổng bớt.' }
          });
        }
        const moi = them ? t - k : t + k;
        return Q.so(`Hai số có hiệu bằng <b>${t}</b>. Nếu giữ nguyên số bị trừ và ${them ? 'thêm vào' : 'bớt đi ở'} số trừ <b>${k}</b> đơn vị thì hiệu mới bằng bao nhiêu?`, moi, {
          goiY: [them ? 'Trừ đi nhiều hơn thì còn lại nhiều hơn hay ít hơn?' : 'Trừ đi ít hơn thì còn lại nhiều hơn hay ít hơn?', `Ví dụ: 10 − 3 = 7; 10 − ${them ? 5 : 1} = ${them ? 5 : 9}.`],
          loiGiai: [`Số trừ ${them ? 'thêm' : 'bớt'} ${k} thì hiệu ${them ? 'bớt' : 'thêm'} ${k}.`, `Hiệu mới: ${t} ${them ? '−' : '+'} ${k} = ${moi}`],
          saiThuong: { [them ? t + k : t - k]: 'Cẩn thận! Số trừ thêm thì hiệu lại bớt đi.' }
        });
      },
      () => c([
        () => {
          const t = n(30, 80), a = n(3, 12), b = n(2, 12), kq = t + a - b;
          return Q.so(`Hai số có tổng là <b>${t}</b>. Nếu thêm vào số hạng thứ nhất <b>${a}</b> đơn vị và bớt ở số hạng thứ hai <b>${b}</b> đơn vị thì tổng mới là bao nhiêu?`, kq, {
            goiY: [{ hoi: `Thêm ${a} vào số hạng thứ nhất: tổng thành ${t} + ${a} = ?`, dap: t + a }, { hoi: `Bớt ${b} ở số hạng thứ hai: ${t + a} − ${b} = ?`, dap: kq }],
            loiGiai: [`${t} + ${a} = ${t + a}`, `${t + a} − ${b} = ${kq}`]
          });
        },
        () => {
          const h = n(20, 70), k = n(3, 15);
          return Q.so(`Hai số có hiệu là <b>${h}</b>. Nếu thêm vào số bị trừ <b>${k}</b> đơn vị và thêm vào số trừ <b>${k}</b> đơn vị thì hiệu mới là bao nhiêu?`, h, {
            goiY: [`Số bị trừ thêm ${k} → hiệu thêm ${k}. Số trừ thêm ${k} → hiệu bớt ${k}.`, 'Thêm rồi lại bớt cùng một số thì sao?', 'Thử với số nhỏ: 10 − 4 = 6; (10 + 2) − (4 + 2) = ?'],
            loiGiai: [`${h} + ${k} − ${k} = ${h}`, 'Hiệu không thay đổi.'], saiThuong: { [h + 2 * k]: 'Số trừ thêm thì hiệu bớt đi. Hai việc bù cho nhau.', [h + k]: 'Còn việc thêm vào số trừ nữa.' }
          });
        },
        () => {
          const t = n(40, 95), sh1 = n(10, t - 10);
          return Q.so(`Trong một phép cộng, tổng hơn số hạng thứ nhất <b>${t - sh1}</b> đơn vị. Nếu số hạng thứ nhất là <b>${sh1}</b> thì tổng là:`, t, {
            goiY: ['Tổng hơn số hạng thứ nhất bao nhiêu thì cộng thêm bấy nhiêu.', { hoi: `${sh1} + ${t - sh1} = ?`, dap: t }],
            loiGiai: [`Tổng = ${sh1} + ${t - sh1} = ${t}`]
          });
        }
      ])()
    ]
  });
})();

</script>
<script>
/* ---- js/de-can-conho.js ---- */
/* Đảo Cân và Bình (Chủ đề 3: ki-lô-gam, lít) và Đảo Có Nhớ (Chủ đề 4: cộng, trừ có nhớ trong phạm vi 100). */
(function () {
  'use strict';
  const { n, c, tron, lap } = T;
  const VAT_CAN = [['🍉', 'quả dưa hấu'], ['🎃', 'quả bí'], ['🍍', 'quả dứa'], ['🐱', 'con mèo'], ['🎒', 'cái cặp']];
  const qc = so => { const ds = []; let r = so; [5, 2, 1].forEach(k => { while (r >= k) { ds.push(k + 'kg'); r -= k; } }); return ds; };

  /* ================= Ki-lô-gam ================= */
  CT.them({
    id: 'ki-lo-gam', dao: 'can', ten: 'Ki-lô-gam', bieu: '⚖️',
    ghiNho: `<p>Ki-lô-gam viết tắt là <b>kg</b>. Cân dùng để biết vật nặng bao nhiêu.</p>
      <p>Cân <b>thăng bằng</b>: hai đĩa nặng bằng nhau. Đĩa nào <b>thấp xuống</b> thì đĩa đó <b>nặng hơn</b>.</p>
      <p>Tính với số đo: 5 kg + 3 kg = 8 kg (nhớ viết kg ở kết quả).</p>`,
    cap: [
      () => {
        const [v, ten] = c(VAT_CAN), so = n(2, 9);
        return c([
          () => Q.so(`Cân thăng bằng. ${ten.charAt(0).toUpperCase() + ten.slice(1)} nặng mấy ki-lô-gam?`, so, { donVi: 'kg', hinh: { kieu: 'can', trai: [v], phai: qc(so) }, goiY: ['Cân thăng bằng nên vật nặng bằng tổng các quả cân.'], loiGiai: [`${qc(so).map(x => x.replace('kg', '')).join(' + ')} = ${so} (kg)`] }),
          () => { const a = n(2, 40), b = n(2, 40); return Q.so(`<div class="dong-tinh">${a} kg + ${b} kg = [[0]] kg</div>`, a + b, { loiGiai: [`${a} + ${b} = ${a + b}, viết ${a + b} kg`] }); },
          () => { const a = n(20, 60), b = n(2, a - 5); return Q.so(`<div class="dong-tinh">${a} kg − ${b} kg = [[0]] kg</div>`, a - b, { loiGiai: [`${a} − ${b} = ${a - b}, viết ${a - b} kg`] }); }
        ])();
      },
      () => c([
        () => {
          const [[v1, t1], [v2, t2]] = tron(VAT_CAN).slice(0, 2), trai = Math.random() < 0.5;
          return Q.chon(`Nhìn cân, vật nào <b>nặng hơn</b>?`, [`${v1} ${t1}`, `${v2} ${t2}`], trai ? 0 : 1, {
            giuThuTu: true, hinh: { kieu: 'can', trai: [v1], phai: [v2], nghieng: trai ? -1 : 1 },
            goiY: ['Đĩa nào thấp xuống thì vật trên đĩa đó nặng hơn.'], loiGiai: [`Đĩa ${trai ? 'bên trái' : 'bên phải'} thấp hơn, nên ${trai ? t1 : t2} nặng hơn.`]
          });
        },
        () => {
          const a = n(20, 60), d = n(3, 15), nang = Math.random() < 0.5, kq = nang ? a + d : a - d;
          return Q.giaiToan({ de: `Bao gạo nặng ${a} kg. Bao ngô ${nang ? 'nặng' : 'nhẹ'} hơn bao gạo ${d} kg. Hỏi bao ngô nặng bao nhiêu ki-lô-gam?`, phep: [{ hoi: 'bao ngô nặng', a, dau: nang ? '+' : '−', b: d, kq }], donVi: 'kg', goiYPhep: [nang ? 'Nặng hơn → nhiều ki-lô-gam hơn.' : 'Nhẹ hơn → ít ki-lô-gam hơn.'] });
        }
      ])(),
      () => c([
        () => {
          const [v, ten] = c(VAT_CAN), x = n(1, 6), bTrai = n(1, 3), phai = x + bTrai;
          return Q.so(`Cân thăng bằng. ${ten.charAt(0).toUpperCase() + ten.slice(1)} nặng mấy ki-lô-gam?`, x, {
            donVi: 'kg', hinh: { kieu: 'can', trai: [v].concat(qc(bTrai)), phai: qc(phai) },
            goiY: [{ hoi: 'Đĩa bên phải nặng tất cả bao nhiêu kg?', dap: phai }, `Đĩa trái có ${ten} và quả cân ${bTrai} kg.`, { hoi: `${phai} − ${bTrai} = ?`, dap: x }],
            loiGiai: [`Đĩa phải: ${phai} kg.`, `${ten.charAt(0).toUpperCase() + ten.slice(1)}: ${phai} − ${bTrai} = ${x} (kg)`], saiThuong: { [phai]: `Bên trái còn có quả cân ${bTrai} kg nữa đấy.` }
          });
        },
        () => {
          const [v, ten] = c(VAT_CAN.slice(0, 3)), x = n(1, 4);

    const kq = dau === '+' ? a + b : a - b;

    const loiGiai = dau === '+'
      ? [`${a % 10} + ${b % 10} = ${dv}, viết ${dv % 10} nhớ 1.`, `${chA} + ${chB} = ${chA + chB}, thêm 1 bằng ${chA + chB + 1}, viết ${chA + chB + 1}.`, `${a} + ${b} = ${kq}`]
      : [`${a % 10 + 10} − ${b % 10} = ${dv}, viết ${dv} nhớ 1.`, chA - chB - 1 ? `${chB} thêm 1 bằng ${chB + 1}; ${chA} − ${chB + 1} = ${chA - chB - 1}, viết ${chA - chB - 1}.` : `${chB} thêm 1 bằng ${chB + 1}; ${chA} − ${chB + 1} = 0, không cần viết.`, `${a} − ${b} = ${kq}`];
    return { kq, goiY, loiGiai };
  }
  function datTinhCau(a, b, dau) {
    const r = cotTinh(a, b, dau), sk = String(r.kq).split('');
    return Q.o('Đặt tính rồi tính (điền chữ số vào kết quả):', sk.map(Number), { hinh: CT.datTinh(a, b, dau, r.kq, true), goiY: r.goiY, loiGiai: r.loiGiai });
  }
  function thieuChuSo(dau) {
    // a = x?  b = ?y ; một chữ số ẩn ở mỗi số, phép tính có nhớ, đáp án duy nhất
    for (; ;) {

      // kiểm tra đáp án duy nhất

      for (let x = 0; x <= 9; x++) for (let y = 0; y <= 9; y++) {

  function dienDau(soSo) {

      // đáp án duy nhất
      let dem = 0; const tat = soSo === 2 ? [['+'], ['−']] : [['+', '+'], ['+', '−'], ['−', '+'], ['−', '−']];
      tat.forEach(t => { let v = ds[0]; t.forEach((d, i) => { v = d === '+' ? v + ds[i + 1] : v - ds[i + 1]; }); if (v === kq) dem++; });
      if (dem !== 1) continue;
      const de = ds.map((x, i) => i < soSo - 1 ? `${x} {{${i}}}` : `${x}`).join(' ') + ` = ${kq}`;
      return Q.tha(`Kéo dấu + hoặc − vào ô trống cho đúng:<div class="dong-tinh">${de}</div>`, ['+', '−'], dau, { dungLai: true, goiY: ['Thử dấu + trước, tính xem có ra đúng kết quả không. Nếu không, đổi sang dấu −.'], loiGiai: [ds.map((x, i) => i < soSo - 1 ? `${x} ${dau[i]}` : `${x}`).join(' ') + ` = ${kq}`] });
    }

  function capTron(cong) { const a = n(1, 8) * 100, b = n(1, cong ? 9 - a / 100 : a / 100) * 100; return cong ? [a, b] : [Math.max(a, b), Math.min(a, b)]; }
