  CT.them({ id: 'cong-1000', dao: 'cong1000', ten: 'Phép cộng trong phạm vi 1000', bieu: '➕', ghiNho: `<p>Đặt tính thẳng hàng: trăm dưới trăm, chục dưới chục, đơn vị dưới đơn vị.</p><p>Tính từ phải sang trái. Hàng nào cộng được 10 trở lên thì <b>viết chữ số hàng đơn vị, nhớ 1</b> sang hàng bên trái.</p><p>Cộng số tròn trăm: 300 + 400 = 3 trăm + 4 trăm = 7 trăm = 700.</p>`, cap: tinh1000(true) });
  CT.them({ id: 'tru-1000', dao: 'cong1000', ten: 'Phép trừ trong phạm vi 1000', bieu: '➖', ghiNho: `<p>Đặt tính thẳng hàng rồi trừ từ phải sang trái.</p><p>Hàng đơn vị không trừ được thì <b>mượn 1 chục</b> (thêm 10), rồi <b>nhớ 1</b> vào số trừ ở hàng chục.</p><p>Thử lại: hiệu + số trừ = số bị trừ.</p>`, cap: tinh1000(false) });

  /* ================= Biểu đồ tranh ================= */
  const LOAI_BD = [{ ten: ['Táo', 'Cam', 'Chuối', 'Lê'], bieu: ['🍎', '🍊', '🍌', '🍐'], de: 'Số quả mỗi loại trong giỏ', dv: 'quả' }, { ten: ['Thỏ', 'Gà', 'Vịt', 'Mèo'], bieu: ['🐰', '🐔', '🦆', '🐱'], de: 'Số con vật trong vườn', dv: 'con' }];
  CT.them({
    id: 'bieu-do-tranh', dao: 'thongke', ten: 'Biểu đồ tranh', bieu: '📊',
    ghiNho: `<p><b>Biểu đồ tranh</b> dùng hình vẽ để biểu diễn số lượng. Mỗi hình là 1 đơn vị.</p>
      <p>Đếm số hình ở mỗi hàng. Hàng dài nhất là nhiều nhất, hàng ngắn nhất là ít nhất.</p>`,
    cap: [
      () => { const L = c(LOAI_BD), so = lap(4, () => n(2, 8)), i = n(0, 3); return Q.so(`Có bao nhiêu ${L.dv} ${L.ten[i].toLowerCase()}?`, so[i], { hinh: { kieu: 'bieuDo', hang: L.ten.map((t, k) => ({ ten: t, bieu: L.bieu[k], so: so[k] })), chuThich: L.de + ' (mỗi hình là 1 ' + L.dv + ')' }, loiGiai: [`Hàng ${L.ten[i]} có ${so[i]} hình.`] }); },
      () => {
        const L = c(LOAI_BD); let so; do { so = lap(4, () => n(2, 9)); } while (new Set(so).size < 4);
        const hinh = { kieu: 'bieuDo', hang: L.ten.map((t, k) => ({ ten: t, bieu: L.bieu[k], so: so[k] })), chuThich: L.de };
        if (Math.random() < 0.5) { const nhieu = Math.random() < 0.5, kq = so.indexOf(nhieu ? Math.max(...so) : Math.min(...so)); return Q.chon(`Loại nào có <b>${nhieu ? 'nhiều' : 'ít'} nhất</b>?`, L.ten, kq, { giuThuTu: true, cot: 4, hinh, loiGiai: [`${L.ten[kq]}: ${so[kq]} ${L.dv}.`] }); }
        const [i, j] = tron([0, 1, 2, 3]).slice(0, 2), lon = so[i] > so[j] ? i : j, be = lon === i ? j : i;
        return Q.so(`${L.ten[lon]} nhiều hơn ${L.ten[be].toLowerCase()} bao nhiêu ${L.dv}?`, so[lon] - so[be], { hinh, goiY: [{ hoi: `Có mấy ${L.ten[lon].toLowerCase()}?`, dap: so[lon] }, { hoi: `Có mấy ${L.ten[be].toLowerCase()}?`, dap: so[be] }], loiGiai: [`${so[lon]} − ${so[be]} = ${so[lon] - so[be]}`] });
      },
      () => {
        const L = c(LOAI_BD), so = lap(4, () => n(2, 9)), hinh = { kieu: 'bieuDo', hang: L.ten.map((t, k) => ({ ten: t, bieu: L.bieu[k], so: so[k] })), chuThich: L.de };
        if (Math.random() < 0.5) return Q.so(`Có tất cả bao nhiêu ${L.dv}?`, T.tong(so), { hinh, goiY: ['Đếm từng hàng rồi cộng lại.'], loiGiai: [`${so.join(' + ')} = ${T.tong(so)}`] });
        const i = n(0, 3), them = n(2, 5);
        return Q.so(`Nếu có thêm ${them} ${L.dv} ${L.ten[i].toLowerCase()} nữa thì ${L.ten[i].toLowerCase()} có tất cả bao nhiêu ${L.dv}?`, so[i] + them, { hinh, goiY: [{ hoi: `Bây giờ có mấy ${L.ten[i].toLowerCase()}?`, dap: so[i] }], loiGiai: [`${so[i]} + ${them} = ${so[i] + them}`] });
      }
    ]
  });

  /* ================= Chắc chắn, có thể, không thể ================= */
  const KN = ['Chắc chắn', 'Có thể', 'Không thể'];
  CT.them({
    id: 'kha-nang', dao: 'thongke', ten: 'Chắc chắn, có thể, không thể', bieu: '🎲',
    ghiNho: `<p><b>Chắc chắn</b>: luôn luôn xảy ra. <b>Có thể</b>: lúc xảy ra, lúc không. <b>Không thể</b>: không bao giờ xảy ra.</p>
      <p>Hộp toàn bi đỏ: lấy 1 viên <b>chắc chắn</b> là bi đỏ, <b>không thể</b> là bi xanh.</p>
      <p><b>Nâng cao</b> – muốn <b>chắc chắn</b> lấy được bi xanh: nghĩ đến trường hợp <b>xui nhất</b> — lấy hết các bi màu khác trước, rồi thêm 1 viên.</p>`,
    cap: [
      () => {
        const loai = n(0, 2), soDo = n(3, 6), soXanh = loai === 0 ? 0 : n(2, 5);
        const bi = loai === 0 ? [['🔴', soDo]] : [['🔴', soDo], ['🔵', soXanh]];
        const hoiMau = loai === 2 ? c(['🔴', '🟡']) : '🔴';
        const kq = loai === 0 ? 0 : loai === 2 && hoiMau === '🟡' ? 2 : 1;
        return Q.chon(`Không nhìn, lấy 1 viên bi trong hộp. ${'Lấy được bi ' + (hoiMau === '🔴' ? 'đỏ' : 'vàng')} là:`, KN, kq, { giuThuTu: true, cot: 3, hinh: { kieu: 'hop', bi }, loiGiai: [kq === 0 ? 'Hộp toàn bi đỏ nên chắc chắn lấy được bi đỏ.' : kq === 1 ? 'Hộp có cả bi đỏ và bi xanh nên có thể lấy được bi đỏ.' : 'Hộp không có bi vàng nên không thể lấy được bi vàng.'] });
      },
      () => {
        const cau = c([['Ngày mai mặt trời mọc ở phía đông.', 0], ['Hôm nay trời có mưa.', 1], ['Con mèo biết bay lên trời.', 2], ['Gieo xúc xắc được mặt 7 chấm.', 2], ['Gieo xúc xắc được mặt 6 chấm.', 1], ['Sau thứ hai là thứ ba.', 0], ['Em được điểm 10 bài kiểm tra tới.', 1], ['Tháng 2 có 32 ngày.', 2]]);
        return Q.chon(`“${cau[0]}” — sự việc này:`, KN, cau[1], { giuThuTu: true, cot: 3, loiGiai: [`${KN[cau[1]]} xảy ra.`] });
      },
      () => {
        const soDo = n(2, 6), soXanh = n(2, 6), muon = c(['xanh', 'đỏ']);
        const kq = (muon === 'xanh' ? soDo : soXanh) + 1;
        return Q.so(`Hộp có ${soDo} bi đỏ và ${soXanh} bi xanh. Không nhìn vào hộp, phải lấy ít nhất bao nhiêu viên bi để <b>chắc chắn</b> có 1 viên bi ${muon}?`, kq, {
          donVi: 'viên bi', hinh: { kieu: 'hop', bi: [['🔴', soDo], ['🔵', soXanh]] },
          goiY: ['Nghĩ đến trường hợp xui nhất: lấy mãi mà chưa được màu mình cần.', { hoi: `Xui nhất là lấy hết bi ${muon === 'xanh' ? 'đỏ' : 'xanh'} trước. Có mấy viên như vậy?`, dap: muon === 'xanh' ? soDo : soXanh }, 'Lấy thêm 1 viên nữa thì chắc chắn được màu cần.'],
          loiGiai: [`Xui nhất: lấy hết ${muon === 'xanh' ? soDo + ' bi đỏ' : soXanh + ' bi xanh'} trước.`, `Lấy thêm 1 viên: ${kq - 1} + 1 = ${kq} (viên bi)`], saiThuong: { 1: 'Lấy 1 viên có thể được, nhưng chưa chắc chắn. Nghĩ trường hợp xui nhất.', [kq - 1]: 'Gần đúng! Lấy hết màu kia rồi, cần thêm 1 viên nữa.' }
        });
      }
    ]
  });
})();

</script>
<script>
/* ---- js/de-tham-tu.js ---- */
/* Đảo Thám Tử — các dạng tư duy nâng cao xuất hiện trên phiếu bài tập: suy luận so sánh, khoảng cách (±1),
   quy luật dãy số, bài toán tuổi. */
(function () {
  'use strict';
  const { n, c, tron, lap } = T;
  const hoa = s => s.charAt(0).toUpperCase() + s.slice(1);
  const BA = [['An', 'Bình', 'Căn'], ['Lan', 'Mai', 'Hoa'], ['Nam', 'Minh', 'Hùng']];

  /* ================= Suy luận so sánh ================= */
  CT.them({
    id: 'suy-luan', dao: 'thamtu', ten: 'Suy luận so sánh', bieu: '🧠',
    ghiNho: `<p>Đọc từng câu, <b>vẽ sơ đồ</b> hoặc viết ra: ai hơn ai, hơn bao nhiêu.</p>
      <p>Bắt đầu từ người <b>đã biết số</b>, rồi suy ra người tiếp theo.</p>
      <p>“A <b>ít hơn</b> B 2 hòn bi” → B <b>nhiều hơn</b> A 2 hòn bi → B = A + 2.</p>
      <p>Nếu A + B = C + D mà A lớn hơn C thì B phải bé hơn D (để hai tổng vẫn bằng nhau).</p>`,
    cap: [
      () => {
        const [A, B, C] = c(BA), a = n(5, 15), b = a + n(1, 5), cc = b + n(1, 5), nhieu = Math.random() < 0.5;
        const ds = tron([[A, a], [B, b], [C, cc]]);
        return Q.chon(`${ds.map(([t, so]) => `${t} có ${so} viên bi`).join(', ')}. Ai có <b>${nhieu ? 'nhiều' : 'ít'}</b> viên bi nhất?`, [A, B, C], nhieu ? 2 : 0, {
          giuThuTu: true, loiGiai: [`${a} < ${b} < ${cc}`, `${nhieu ? C : A} có ${nhieu ? 'nhiều' : 'ít'} viên bi nhất.`]
        });
      },
      () => {
        const [A, B, C] = c(BA), a = n(3, 12), d1 = n(1, 5), d2 = n(1, 5), b = a + d1, cc = b + d2;
        return Q.so(`${A} có ít hơn ${B} ${d1} hòn bi, ${B} có ít hơn ${C} ${d2} hòn bi. Hỏi ${C} có mấy hòn bi, biết rằng ${A} có ${a} hòn bi.`, cc, {
          donVi: 'hòn bi', hinh: { kieu: 'thanh', hang: [{ nhan: A, doan: [{ dai: a, chu: a }] }, { nhan: B, doan: [{ dai: a, chu: '' }, { dai: d1, chu: d1, loai: 'nhan-manh' }] }, { nhan: C, doan: [{ dai: b, chu: '' }, { dai: d2, chu: d2, loai: 'nhan-manh' }], sau: '?' }] },
          goiY: [`${A} ít hơn ${B} → ${B} nhiều hơn ${A}.`, { hoi: `${B} có mấy hòn bi?`, dap: b }, { hoi: `${C} có mấy hòn bi?`, dap: cc }],
          loiGiai: [`${B}: ${a} + ${d1} = ${b} (hòn bi)`, `${C}: ${b} + ${d2} = ${cc} (hòn bi)`], saiThuong: { [a - d1 - d2]: `${A} ít hơn, vậy ${B} và ${C} phải nhiều hơn.` }
        });
      },
      () => c([
        () => {
          const [A, B] = c(BA), k = n(2, 6), tong = k + n(3, 9);
          return Q.o(`Tổng số táo của ${A} và ${B} là ${tong} quả. Biết rằng nếu ${A} cho ${B} ${k} quả táo thì ${A} không còn quả nào. Hỏi mỗi bạn có bao nhiêu quả táo?<div class="dong-tinh">${A}: [[0]] quả &nbsp; ${B}: [[1]] quả</div>`, [k, tong - k], {
            goiY: [`${A} cho đi ${k} quả thì hết. Vậy lúc đầu ${A} có mấy quả?`, { hoi: `${A} có mấy quả?`, dap: k }, { hoi: `${B}: ${tong} − ${k} = ?`, dap: tong - k }],
            loiGiai: [`${A} cho ${k} quả thì hết → ${A} có ${k} quả.`, `${B} có: ${tong} − ${k} = ${tong - k} (quả)`]
          });
        },
        () => {
          const [A, B] = c(BA), k = n(2, 6), b = n(5, 15), a = b + 2 * k;
          return Q.so(`${A} có ${a} cái kẹo. Nếu ${A} cho ${B} ${k} cái kẹo thì số kẹo của hai bạn bằng nhau. Hỏi lúc đầu ${B} có bao nhiêu cái kẹo?`, b, {
            donVi: 'cái kẹo', goiY: [{ hoi: `Sau khi cho, ${A} còn mấy cái?`, dap: a - k }, `Lúc đó ${B} cũng có ${a - k} cái — sau khi đã nhận thêm ${k} cái.`, { hoi: `Lúc đầu ${B} có: ${a - k} − ${k} = ?`, dap: b }],
            loiGiai: [`${A} còn: ${a} − ${k} = ${a - k} (cái)`, `${B} sau khi nhận có ${a - k} cái.`, `Lúc đầu ${B} có: ${a - k} − ${k} = ${b} (cái kẹo)`], saiThuong: { [a - k]: `Đó là số kẹo của ${B} sau khi đã nhận thêm ${k} cái.` }
          });
        },
        () => {
          const [A, B, C] = c(BA), D = 'Hương', nhieu = Math.random() < 0.5;
          return Q.chon(`Số tuổi của ${A} và ${B} cộng lại bằng số tuổi của ${C} và ${D} cộng lại. ${A} ${nhieu ? 'nhiều' : 'ít'} tuổi hơn ${C}. Hỏi ${B} nhiều tuổi hơn hay ít tuổi hơn ${D}?`, [`${B} nhiều tuổi hơn ${D}`, `${B} ít tuổi hơn ${D}`, `${B} bằng tuổi ${D}`], nhieu ? 1 : 0, {
            giuThuTu: true, goiY: ['Hai tổng bằng nhau giống như cân thăng bằng.', `Bên ${A} nặng hơn bên ${C} thì bên ${B} phải thế nào để hai bên vẫn bằng nhau?`, 'Thử bằng số: 5 + 3 = 4 + 4.'],
            loiGiai: [`${A} + ${B} = ${C} + ${D}.`, `${A} ${nhieu ? 'nhiều' : 'ít'} hơn ${C} nên ${B} phải ${nhieu ? 'ít' : 'nhiều'} hơn ${D}.`]
          });
        },
        () => {
          const ss = c([[9, 'số lớn nhất có một chữ số', 10, 'số nhỏ nhất có hai chữ số khác nhau', 1], [9, 'số lớn nhất có một chữ số', 11, 'số bé nhất có hai chữ số giống nhau', 2], [9, 'số lớn nhất có một chữ số', 10, 'số nhỏ nhất có hai chữ số khác nhau', 2], [8, 'số liền trước của số lớn nhất có một chữ số', 11, 'số bé nhất có hai chữ số giống nhau', 1]]);
          const tuoiAnh = ss[2] - ss[4];
          const kq = ss[0] === tuoiAnh ? 2 : ss[0] > tuoiAnh ? 0 : 1;
          return Q.chon(`Hải nói với Hà: “Chị mình bảo Tết này tuổi chị mình bằng ${ss[1]}”. Hà nói: “Còn anh mình bảo, Tết này anh còn thiếu ${ss[4]} tuổi nữa thì bằng ${ss[3]}”. Hỏi chị của Hải và anh của Hà, ai nhiều tuổi hơn?`, ['Chị của Hải nhiều tuổi hơn', 'Anh của Hà nhiều tuổi hơn', 'Hai người bằng tuổi nhau'], kq, {
            giuThuTu: true, goiY: [{ hoi: 'Chị của Hải bao nhiêu tuổi?', dap: ss[0] }, { hoi: hoa(ss[3]) + ' là?', dap: ss[2] }, { hoi: `Anh của Hà: ${ss[2]} − ${ss[4]} = ?`, dap: tuoiAnh }],
            loiGiai: [`Chị của Hải: ${ss[0]} tuổi.`, `Anh của Hà: ${ss[2]} − ${ss[4]} = ${tuoiAnh} tuổi.`, kq === 2 ? 'Hai người bằng tuổi nhau.' : kq === 0 ? 'Chị của Hải nhiều tuổi hơn.' : 'Anh của Hà nhiều tuổi hơn.']
          });
        }
      ])()
    ]
  });

  /* ================= Khoảng cách: cầu thang, trồng cây, cưa gỗ (Phiếu Tuần 5 bài 16, 19, 20) ================= */
  CT.them({
    id: 'khoang-cach', dao: 'thamtu', ten: 'Cầu thang, trồng cây, cưa gỗ', bieu: '🪜',
    ghiNho: `<p><b>Cầu thang:</b> đi từ tầng 1 lên tầng 4 chỉ phải leo <b>3</b> lần cầu thang (4 − 1 = 3).</p>
      <p><b>Trồng cây thẳng hàng:</b> 5 cây thì có <b>4</b> khoảng cách giữa hai cây liền nhau.</p>
      <p><b>Cưa gỗ:</b> cưa thành 4 đoạn chỉ cần cưa <b>3</b> lần.</p>
      <p>Mẹo: <b>vẽ hình ra</b> rồi đếm — đừng vội tính.</p>`,
    cap: [
      () => c([
        () => { const t = n(3, 6); return Q.so(`Từ tầng 1 lên tầng ${t}, An phải đi qua mấy lần cầu thang?`, t - 1, { hinh: { kieu: 'toaNha', tang: t, nguoi: 1 }, goiY: ['Mỗi lần lên cầu thang thì lên được 1 tầng. Đếm trên hình.'], loiGiai: [`${t} − 1 = ${t - 1} lần.`], saiThuong: { [t]: `Từ tầng 1 không cần leo để đến tầng 1. Chỉ leo ${t - 1} lần.` } }); },
        () => { const k = n(3, 7); return Q.so(`Trồng ${k} cây thành một hàng thẳng. Hỏi có bao nhiêu khoảng cách giữa hai cây liền nhau?`, k - 1, { hinh: { kieu: 'hang', ds: lap(k, () => '🌳') }, goiY: ['Đếm khoảng trống giữa các cây trên hình.'], loiGiai: [`${k} cây có ${k - 1} khoảng cách.`] }); }
      ])(),
      () => c([
        () => { const p = c([2, 3]), t = n(3, 5), lan = t - 1; return Q.so(`An mất ${p} phút để đi bộ từ tầng này tới tầng kế tiếp. Hỏi An đi bộ từ tầng 1 đến tầng ${t} mất bao lâu?`, p * lan, { donVi: 'phút', hinh: { kieu: 'toaNha', tang: t, nguoi: 1 }, goiY: [{ hoi: `Từ tầng 1 đến tầng ${t} phải đi qua mấy lần cầu thang?`, dap: lan }, `Mỗi lần ${p} phút: cộng ${lap(lan, () => p).join(' + ')}.`], loiGiai: [`Số lần đi cầu thang: ${t} − 1 = ${lan}.`, `${lap(lan, () => p).join(' + ')} = ${p * lan} (phút)`], saiThuong: { [p * t]: `Con tính thừa một tầng rồi. Từ tầng 1 lên tầng ${t} chỉ đi ${lan} lần.` } }); },
        () => { const doan = n(3, 6); return Q.so(`Bố cưa một thanh gỗ thành ${doan} đoạn. Hỏi bố phải cưa mấy lần?`, doan - 1, { hinh: { kieu: 'chu', chu: `<div class="go">${lap(doan, () => '<span></span>').join('<i>✂</i>')}</div>` }, goiY: ['Đếm số vết cưa (✂) trên hình.'], loiGiai: [`${doan} đoạn cần ${doan - 1} lần cưa.`], saiThuong: { [doan]: 'Lần cưa cuối cùng đã tạo ra 2 đoạn rồi.' } }); }
      ])(),
      () => c([

<script>
/* ---- js/de-tren-lop.js ---- */
/* Các dạng bài luyện ngẫu nhiên soạn theo đúng kiểu đề trong tập phiếu trên lớp
   (phiếu tuần, nâng cao 2Q, chuyên đề): số chẵn – số lẻ, lập số từ chữ số, tìm số theo tổng / hiệu chữ số,
   chuỗi phép tính, tìm tổng ban đầu, tổng số tuổi, thứ – ngày trong tuần. */
(function () {
  'use strict';
  const { n, c, tron, lap } = T;
  const hoa = s => s.charAt(0).toUpperCase() + s.slice(1);
  const chan = x => x % 2 === 0;
  const BANG = lap(90, i => i + 10);
  const cs = x => [Math.floor(x / 10), x % 10];

  /* ================= Số chẵn, số lẻ ================= */
  const DAC_BIET_CL = [
    ['số chẵn lớn nhất có hai chữ số', 98], ['số lẻ lớn nhất có hai chữ số', 99],
    ['số chẵn bé nhất có hai chữ số', 10], ['số lẻ bé nhất có hai chữ số', 11],
    ['số lẻ bé nhất có hai chữ số khác nhau', 13], ['số lẻ lớn nhất có hai chữ số khác nhau', 97],
    ['số chẵn lớn nhất có một chữ số', 8], ['số lẻ bé nhất có một chữ số', 1], ['số lẻ lớn nhất có một chữ số', 9]
  ];
  CT.them({
    id: 'chan-le', dao: 'so100', ten: 'Số chẵn, số lẻ', bieu: '⚪',
    ghiNho: `<p><b>Các số lẻ</b> là các số có chữ số hàng đơn vị là 1, 3, 5, 7, 9.</p>
      <p><b>Các số chẵn</b> là các số có chữ số hàng đơn vị là 0, 2, 4, 6, 8.</p>
      <p>Hai số chẵn (hoặc hai số lẻ) liên tiếp hơn kém nhau 2 đơn vị. Số tròn chục là số chẵn.</p>
      <p>Muốn biết chẵn hay lẻ, <b>chỉ cần nhìn chữ số hàng đơn vị</b>.</p>`,
    cap: [
      () => {
        const le = Math.random() < 0.5, s = new Set(); while (s.size < 8) s.add(n(1, 99));
        const ds = [...s];
        if (!ds.some(x => chan(x) !== le)) ds[0] = le ? 11 : 10;
        if (ds.every(x => chan(x) !== le)) ds[1] = le ? 24 : 35;
        return Q.nhieu(`Chọn <b>tất cả</b> các số ${le ? 'lẻ' : 'chẵn'}:`, ds, ds.map((x, i) => chan(x) !== le ? i : -1).filter(i => i >= 0),
          { luoi: 4, goiY: [`Nhìn chữ số hàng đơn vị: ${le ? '1, 3, 5, 7, 9 là số lẻ' : '0, 2, 4, 6, 8 là số chẵn'}.`], loiGiai: [`Các số ${le ? 'lẻ' : 'chẵn'}: ${ds.filter(x => chan(x) !== le).join(', ')}.`] });
      },
      () => c([
        () => { const p = c(DAC_BIET_CL); return Q.so(hoa(p[0]) + ' là:', p[1], { goiY: [p[0].includes('khác nhau') ? 'Hai chữ số phải khác nhau. Thử dần từ số lớn nhất (hoặc bé nhất) có thể.' : 'Nhớ: số chẵn tận cùng 0, 2, 4, 6, 8; số lẻ tận cùng 1, 3, 5, 7, 9.'], loiGiai: [`${hoa(p[0])} là ${p[1]}.`], saiThuong: p[1] === 13 ? { 11: '11 là số lẻ nhưng hai chữ số giống nhau.' } : p[1] === 97 ? { 99: '99 có hai chữ số giống nhau.' } : {} }); },
        () => {
          const le = Math.random() < 0.5, a = n(10, 60), b = a + n(8, 14), ds = lap(b - a - 1, i => a + 1 + i).filter(x => chan(x) !== le);
          return Q.o(`Viết các số ${le ? 'lẻ' : 'chẵn'} lớn hơn ${a} và bé hơn ${b}:<div class="dong-tinh">${ds.map((_, i) => `[[${i}]]`).join(' ; ')}</div>`, ds,
            { khongThuTu: true, goiY: [`Số ${le ? 'lẻ' : 'chẵn'} đầu tiên lớn hơn ${a} là?`, `Hai số ${le ? 'lẻ' : 'chẵn'} liên tiếp hơn kém nhau 2.`], loiGiai: [ds.join(', ')], saiThuong: {} });
        }
      ])(),
      () => {
        const le = Math.random() < 0.5, lon = Math.random() < 0.5, a = n(11, 45), b = n(a + 25, 95), k = b - a;
        // a + … < b (số lớn nhất) hoặc … + a > b (số bé nhất)
        let kq = lon ? k - 1 : k + 1; if (chan(kq) === le) kq += lon ? -1 : 1;
        const de = lon ? `${a} + …… &lt; ${b}` : `…… + ${a} &gt; ${b}`;
        return Q.so(`Số ${le ? 'lẻ' : 'chẵn'} ${lon ? 'lớn' : 'bé'} nhất điền vào chỗ chấm là số nào?<div class="dong-tinh">${de}</div>`, kq, {
          goiY: [{ hoi: `${a} cộng mấy thì bằng ${b}?`, dap: k }, lon ? `Số cần điền phải bé hơn ${k}.` : `Số cần điền phải lớn hơn ${k}.`, `Trong các số đó, chọn số ${le ? 'lẻ' : 'chẵn'} ${lon ? 'lớn' : 'bé'} nhất.`],
          loiGiai: [`${a} + ${k} = ${b}.`, `Số cần điền ${lon ? 'bé' : 'lớn'} hơn ${k}; số ${le ? 'lẻ' : 'chẵn'} ${lon ? 'lớn' : 'bé'} nhất là ${kq}.`],
          saiThuong: { [k]: `${a} + ${k} = ${b}, bằng chứ không ${lon ? 'bé' : 'lớn'} hơn.` }
        });
      }
    ]
  });

  /* ================= Lập số từ các chữ số ================= */
  function lapSo(dsCs, khacNhau) {
    const kq = [];
    dsCs.forEach(a => dsCs.forEach(b => { if (a !== 0 && (!khacNhau || a !== b)) kq.push(a * 10 + b); }));
    return [...new Set(kq)].sort((x, y) => x - y);
  }
  function chonCs(k, coKhong) {
    let ds; do { ds = lap(k, () => n(1, 9)); if (coKhong) ds[n(0, k - 1)] = 0; } while (new Set(ds).size < k);
    return ds;
  }
  CT.them({
    id: 'lap-so', dao: 'so100', ten: 'Lập số từ các chữ số', bieu: '🃏',
    ghiNho: `<p>Viết lần lượt theo <b>chữ số hàng chục</b> để không sót: hàng chục là chữ số thứ nhất, rồi thứ hai…</p>
      <p><b>Chữ số 0 không đứng ở hàng chục.</b></p>
      <p>Đề nói “<b>khác nhau</b>” thì hai chữ số phải khác nhau (bỏ số như 33). Đề không nói thì được dùng lặp lại.</p>
      <p>Ví dụ từ 2, 0, 6 lập các số có hai chữ số khác nhau: 20, 26, 60, 62.</p>`,
    cap: [
      () => {
        const ds = chonCs(2, false), kq = lapSo(ds, false);
        return Q.o(`Từ hai chữ số <b>${ds.join(', ')}</b>, viết tất cả các số có hai chữ số (được dùng lặp lại):<div class="dong-tinh">${kq.map((_, i) => `[[${i}]]`).join(' ; ')}</div>`, kq,
          { khongThuTu: true, goiY: [`Hàng chục là ${ds[0]} thì viết được những số nào?`, 'Đề không nói “khác nhau” nên được viết số có hai chữ số giống nhau.'], loiGiai: [kq.join(', ')] });
      },
      () => {
        const coKhong = Math.random() < 0.6, ds = chonCs(3, coKhong), khac = true, kq = lapSo(ds, khac);
        if (Math.random() < 0.5) return Q.so(`Từ ba chữ số <b>${ds.join(', ')}</b> lập được tất cả bao nhiêu số có hai chữ số khác nhau?`, kq.length, {
          donVi: 'số', goiY: ['Liệt kê theo từng chữ số hàng chục.', coKhong ? 'Chữ số 0 không đứng ở hàng chục.' : 'Mỗi chữ số hàng chục đi với 2 chữ số còn lại.'], loiGiai: [kq.join(', '), `Có ${kq.length} số.`]
        });
        return Q.o(`Từ ba chữ số <b>${ds.join(', ')}</b>, viết tất cả các số có hai chữ số khác nhau:<div class="dong-tinh">${kq.map((_, i) => `[[${i}]]`).join(' ; ')}</div>`, kq,
          { khongThuTu: true, goiY: [coKhong ? 'Chữ số 0 không đứng ở hàng chục.' : 'Mỗi chữ số hàng chục đi với hai chữ số còn lại.'], loiGiai: [kq.join(', ')] });
      },
      () => {
        const coKhong = Math.random() < 0.5, ds = chonCs(3, coKhong), khac = Math.random() < 0.6, kq = lapSo(ds, khac);
        const lon = kq[kq.length - 1], be = kq[0];
        return c([
          () => Q.so(`Từ các chữ số <b>${ds.join(', ')}</b>, tính tổng của số lớn nhất và số bé nhất có hai chữ số${khac ? ' khác nhau' : ''} lập được.`, lon + be, {
            goiY: [{ hoi: 'Số lớn nhất lập được là?', dap: lon }, { hoi: 'Số bé nhất lập được là?', dap: be }], loiGiai: [`Số lớn nhất: ${lon}; số bé nhất: ${be}.`, `${lon} + ${be} = ${lon + be}`],
            saiThuong: khac ? {} : {}
          }),
          () => Q.so(`Từ các chữ số <b>${ds.join(', ')}</b>, tính hiệu của số lớn nhất và số bé nhất có hai chữ số${khac ? ' khác nhau' : ''} lập được.`, lon - be, {
            goiY: [{ hoi: 'Số lớn nhất lập được là?', dap: lon }, { hoi: 'Số bé nhất lập được là?', dap: be }], loiGiai: [`${lon} − ${be} = ${lon - be}`]
          }),

<script>
/* ---- js/van-ban.js ---- */
/* Đọc bài tập do phụ huynh soạn bằng chữ thường (xem HUONG-DAN.md, mục "Thêm bài của cô").

  const KHOA = Object.entries(KIEU_TU_TINH).concat([
    ['hinh-json', /^hinh json\s*:/], ['dong-ho', /^dong ho\s*:/],
    ['cau-giai', /^cau giai toan\s*:/], ['cau', /^cau\s*\d*\s*:/], ['dap-an', /^dap an\s*:/], ['lua-chon', /^lua chon\s*:/],
    ['goi-y', /^goi y\s*:/], ['cach-giai', /^cach giai\s*:/], ['sai', /^sai thuong gap\s*:/], ['don-vi', /^don vi\s*:/],

  /* Tính một dãy cộng trừ từ trái sang phải: "90 − 10 − 20" → 60. Bỏ qua chữ cm, kg, l. */
  const tinhDay = s => {
    const t = String(s).replace(/(\d)\s*(cm|dm|kg|l|m)\b/g, '$1').replace(/[−–]/g, '-').replace(/\s+/g, '');

    const m = String(s).replace(/\s+/g, ' ').match(/^\s*([\d\s.]+?)\s*([+\-−×x*:\/])\s*([\d\s.]+?)\s*=\s*([\d\s.]+?)\s*(\(.*\))?\s*$/);

  VB.phanTich = function (chuoi) {
    const dong = String(chuoi || '').replace(/\r/g, '').split('\n');

    let phieu = null, cau = null, khoaTruoc = null;

    function moPhieu(ten) { phieu = { id: 'p-' + boDau(ten).replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') + '-' + ds.length, ten, nguon: '', cau: [] }; ds.push(phieu); }

      if (q) { if (!phieu) moPhieu('Bài của cô'); phieu.cau.push(q); }
      cau = null;
    }

    dong.forEach((raw, i) => {
      const s = raw.replace(/^\s*[-•]\s+/, '').trim();
      if (!s || s.startsWith('//')) { if (!s) khoaTruoc = null; return; }
      if (s.startsWith('#')) { dongCau(); moPhieu(s.replace(/^#+\s*/, '')); return; }
      const kd = boDau(s);
      const k = KHOA.find(([, re]) => re.test(kd));
      if (!k) {
        if (cau && cau.dapAn == null && !cau.phepTinh.length && (khoaTruoc === 'cau' || khoaTruoc === 'cau-giai' || khoaTruoc === 'hinh' || khoaTruoc === 'hinh-json' || khoaTruoc === 'dong-ho')) { cau.de += '<br>' + T.esc(s); return; }
        if (cau && khoaTruoc === 'goi-y') { cau.goiY[cau.goiY.length - 1] += ' ' + s; return; }

          else if (k[0] === 'lua-chon') cau.luaChon = giaTri.split('|').map(x => x.trim()).filter(Boolean);
          else if (k[0] === 'goi-y') cau.goiY.push(giaTri);
          else if (k[0] === 'cach-giai') cau.cachGiai.push(giaTri);
          else if (k[0] === 'sai') { const m = giaTri.match(/^(\d+)\s*=>\s*(.+)$/); if (m) cau.sai[m[1]] = m[2]; else loi.push(`Dòng ${i + 1}: viết “Sai thường gặp: 15 => lời nhắc”`); }
          else if (k[0] === 'don-vi') cau.donVi = giaTri;
          else if (k[0] === 'loi-giai') cau.loiGiai.push(giaTri);
          else if (k[0] === 'phep-tinh') cau.phepTinh.push(giaTri);
          else if (k[0] === 'dap-so') cau.dapSo = giaTri;

          else if (k[0] === 'dong-ho') { const m = giaTri.match(/^(\d{1,2})\s*[:h]\s*(\d{1,2})$/); if (m) cau.dongHo = { gio: +m[1], phut: +m[2] }; else loi.push(`Dòng ${i + 1}: viết “Đồng hồ: 8:30”`); }

  }

  function dungCau(c, loi) {
    const bao = m => loi.push(`Câu ở dòng ${c.dong}: ${m}`);

    if (k && k !== so.length) { bao(`đề có ${k} ô trống nhưng đáp án có ${so.length} số`); return null; }

      if (so.length === 1) return Object.assign(Q.so(de, so[0], { donVi: c.donVi }), chung, { loiGiai });
      de += `<div class="dong-tinh">${so.map((_, i) => `[[${i}]]`).join(' ; ')}</div>`;
    }
    if (so.length === 1) return Object.assign(Q.so(de, so[0], { donVi: c.donVi }), chung, { loiGiai });

  }

  /* ---------- Các kiểu câu ứng dụng tự tính đáp án ---------- */
  function dungTuTinh(c, chung, bao) {
    const lg = chung.loiGiai.length ? chung.loiGiai : null;
    switch (c.kieu) {
      case 'cau-tinh': case 'cau-tinh-cm': {
        const cm = c.kieu === 'cau-tinh-cm', ds = tachDs(c.tho), kq = ds.map(tinhDay);
        if (!ds.length || kq.some(x => x == null || x < 0)) { bao('không tính được dãy “' + c.tho + '”'); return null; }
        const hien = e => cm ? viet(e).replace(/(\d+)/g, '$1cm') : viet(e);
        return Q.o('Tính:' + ds.map((e, i) => `<div class="dong-tinh">${hien(e)} = [[${i}]]${cm ? ' <span class="don-vi">cm</span>' : ''}</div>`).join(''), kq,
          Object.assign({}, chung, { goiY: chung.goiY.length ? chung.goiY : ['Tính lần lượt từ trái sang phải.', cm ? 'Tính với các số trước, rồi viết thêm “cm” ở kết quả.' : 'Gặp phép tính khó thì đặt tính ra nháp.'], loiGiai: lg || ds.map((e, i) => `${hien(e)} = ${kq[i]}${cm ? 'cm' : ''}`) }));

              nho ? (dau === '+' ? 'Được 10 trở lên thì viết chữ số hàng đơn vị, nhớ 1 sang hàng chục.' : 'Nhớ 1 thì cộng thêm 1 vào chữ số hàng chục của số trừ.') : 'Rồi tính tiếp hàng chục.']

        return Q.buoc('Đặt tính rồi tính từng phép (thẳng hàng: đơn vị dưới đơn vị, chục dưới chục).', buoc, Object.assign({}, chung, { loiGiai: lg || buoc.map(b => b.ghiMau) }));
      }
      case 'cau-so-sanh': {
        const cap = [];
        for (const e of tachDs(c.tho)) {
          const [L, R] = e.split('?').map(x => x && x.trim()), a = tinhDay(L), b = tinhDay(R);
          if (a == null || b == null) { bao('không so sánh được “' + e + '”'); return null; }
          cap.push({ L: viet(L), R: viet(R), a, b });
        }
        return Q.tha('Kéo dấu &lt;, &gt;, = vào ô trống:<div class="cot-ss">' + cap.map((p, i) => `<div>${p.L} {{${i}}} ${p.R}</div>`).join('') + '</div>',
          ['<', '>', '='], cap.map(p => soSanh(p.a, p.b)), Object.assign({}, chung, { dungLai: true, goiY: chung.goiY.length ? chung.goiY : ['Tính kết quả mỗi bên ra nháp trước, rồi mới so sánh.'], loiGiai: lg || cap.map(p => `${p.L === String(p.a) ? p.a : p.L + ' = ' + p.a}; ${p.R === String(p.b) ? p.b : p.R + ' = ' + p.b} → ${p.a} ${soSanh(p.a, p.b)} ${p.b}`) }));
      }
      case 'cau-dung-sai': {
        let dung = null, giaiThich = '';

        else {

        if (dung == null) { bao('Đáp án phải là Đ hoặc S'); return null; }
        return Q.chon(`Đúng ghi Đ, sai ghi S:<div class="dong-tinh">${T.esc(viet(c.tho))}</div>`, ['Đ (đúng)', 'S (sai)'], dung ? 0 : 1,
          Object.assign({}, chung, { giuThuTu: true, cot: 2, goiY: chung.goiY.length ? chung.goiY : ['Tính từng bên rồi kiểm tra.', 'Nếu có đơn vị đo (cm, kg…) thì các số phải viết đủ đơn vị.'], loiGiai: lg || [giaiThich || (dung ? 'Câu này đúng.' : 'Câu này sai.')] }));
      }
      case 'cau-dien-dau': {
        const m = c.tho.match(/^(.+?)=\s*(\d+)\s*$/);
        const so = m ? m[1].split('?').map(x => docSo(x)) : [];
        if (!m || so.length < 2 || so.some(x => x == null)) { bao('viết “Câu điền dấu: 12 ? 3 ? 1 = 14”'); return null; }
        const kq = Number(m[2]), loiDung = [];
        const thu = (i, v, dau) => { if (i === so.length) { if (v === kq) loiDung.push(dau.slice()); return; } ['+', '−'].forEach(d => { dau.push(d); thu(i + 1, d === '+' ? v + so[i] : v - so[i], dau); dau.pop(); }); };
        thu(1, so[0], []);
        if (!loiDung.length) { bao('không có cách điền dấu nào đúng'); return null; }
        const de = so.map((x, i) => i < so.length - 1 ? `${x} {{${i}}}` : `${x}`).join(' ') + ` = ${kq}`;
        return Q.tha(`Kéo dấu + hoặc − vào ô trống cho đúng:<div class="dong-tinh">${de}</div>`, ['+', '−'], loiDung[0], Object.assign({}, chung, {
          dungLai: true, dapAnKhac: loiDung.slice(1), goiY: chung.goiY.length ? chung.goiY : ['Thử dấu + trước, tính từ trái sang phải. Không đúng thì đổi sang dấu −.', 'Kết quả bé hơn số đầu tiên thì chắc chắn phải có dấu −.'],
          loiGiai: lg || loiDung.map(d => so.map((x, i) => i < so.length - 1 ? `${x} ${d[i]}` : `${x}`).join(' ') + ` = ${kq}`)
        }));
      }
      case 'cau-xep-tang': case 'cau-xep-giam': {
        const ds = String(c.dapAn || '').split(/[;,]/).map(docSo);
        if (ds.length < 2 || ds.some(x => x == null)) { bao('Đáp án phải là các số cần xếp, cách nhau bằng dấu phẩy'); return null; }
        const tang = c.kieu === 'cau-xep-tang', sx = ds.slice().sort((a, b) => tang ? a - b : b - a);
        return Q.sapXep(c.de, ds, sx, Object.assign({}, chung, { goiY: chung.goiY.length ? chung.goiY : [`Tìm số ${tang ? 'bé' : 'lớn'} nhất trước, chạm vào nó. Rồi tìm số ${tang ? 'bé' : 'lớn'} nhất trong các số còn lại.`, 'So sánh chữ số hàng chục trước, hàng chục bằng nhau thì so sánh hàng đơn vị.'], loiGiai: lg || [sx.join(tang ? ' < ' : ' > ')] }));
      }
      case 'cau-doc-so': {
        const buoc = tachDs(c.tho).map(docSo);
        if (buoc.some(x => x == null || x > 1000)) { bao('đọc số chỉ nhận số từ 0 đến 1000'); return null; }
        return Q.buoc('Chọn cách đọc đúng của mỗi số.', buoc.map(x => {
          const sai = new Set();
          const dao = x >= 10 && x < 100 ? Number(String(x).split('').reverse().join('')) : null;
          [dao, x + 1, x - 1, x + 10, x - 10].forEach(y => { if (y != null && y >= 0 && y <= 1000 && y !== x && sai.size < 3) sai.add(y); });
          const lc = [T.soChu(x)].concat([...sai].map(T.soChu));
          if (x % 10 === 5 && x > 10) lc[1] = T.soChu(x).replace(/lăm$/, 'năm');
          if (x % 10 === 1 && x > 20) lc[1] = T.soChu(x).replace(/mốt$/, 'một');
          return Q.chon(`Số <b>${x}</b> đọc là:`, [...new Set(lc)], 0, { ghi: `${x}: ${T.soChu(x)}`, goiY: ['Đọc hàng chục trước rồi đến hàng đơn vị. Hàng đơn vị là 5 thì đọc “lăm”, là 1 (từ 21 trở đi) thì đọc “mốt”, là 4 có thể đọc “tư”.'] });
        }), Object.assign({}, chung, { loiGiai: lg || buoc.map(x => `${x}: ${T.soChu(x)}`) }));
      }
      case 'cau-tach-gop': {
        const buoc = [];
        for (const e of tachDs(c.tho)) {
          const m = viet(e).match(/^(\d) \+ (\d)$/), a = m && +m[1], b = m && +m[2];
          if (!m || a + b <= 10) { bao('tách gộp cần hai số có một chữ số, tổng lớn hơn 10: “' + e + '”'); return null; }
          const bu = 10 - a, du = b - bu;
          buoc.push(Q.o(`<div class="dong-tinh">${a} + ${b} = ${a} + [[0]] + [[1]] = 10 + [[2]] = [[3]]</div>`, [bu, du, du, a + b], {
            ghiMau: `${a} + ${b} = ${a} + ${bu} + ${du} = 10 + ${du} = ${a + b}`, hinh: { kieu: 'khung10', a, b },
            goiY: [{ hoi: `${a} cần thêm mấy để được 10?`, dap: bu }, { hoi: `Tách ${b} thành ${bu} và mấy?`, dap: du }]
          }));
        }
        return Q.buoc('Tách – gộp để cộng có nhớ (mẫu: 9 + 7 = 9 + 1 + 6 = 10 + 6 = 16).', buoc, Object.assign({}, chung, { loiGiai: lg || buoc.map(b => b.ghiMau) }));
      }
      case 'cau-chon-nhieu': {
        if (!c.luaChon) { bao('cần dòng Lựa chọn:'); return null; }
        const dung = String(c.dapAn || '').split('|').map(x => x.trim()).filter(Boolean).map(x => c.luaChon.findIndex(y => boDau(y) === boDau(x)));
        if (!dung.length || dung.some(i => i < 0)) { bao('mỗi đáp án phải có trong Lựa chọn (cách nhau bằng |)'); return null; }
        return Q.nhieu(c.de, c.luaChon.map(T.esc), dung, Object.assign({}, chung, { luoi: c.luaChon.length > 6 ? 5 : Math.min(4, c.luaChon.length), loiGiai: lg || ['Đáp án: ' + dung.map(i => c.luaChon[i]).join('; ')] }));
      }
    }
    return null;
  }

  /* Mẫu dùng cho nút "Chèn mẫu" ở Góc phụ huynh */
  VB.MAU = {
    so: 'Câu: Lấy hiệu của 25 và 12 rồi cộng với 36 được kết quả là:\nĐáp án: 49\nGợi ý: Hiệu của 25 và 12 là bao nhiêu? = 13\nGợi ý: Lấy 13 cộng với 36 được bao nhiêu? = 49\nCách giải: 25 − 12 = 13\nCách giải: 13 + 36 = 49\n',
    o: 'Câu: Điền số: 9 + □ = 7 + 8\nĐáp án: 6\nGợi ý: 7 + 8 bằng bao nhiêu? = 15\nCách giải: 7 + 8 = 15; 9 + 6 = 15\n',
    nhieu: 'Câu: Tìm hai số tự nhiên liên tiếp mà tổng của chúng là số lớn nhất có một chữ số.\nĐáp án: 4; 5\nKhông cần thứ tự\nGợi ý: Số lớn nhất có một chữ số là? = 9\nCách giải: 4 + 5 = 9\n',
    chon: 'Câu: An + Ba = Hương + Lan. An nhiều tuổi hơn Lan. Hỏi Ba nhiều tuổi hơn hay ít tuổi hơn Hương?\nLựa chọn: Ba nhiều tuổi hơn Hương | Ba ít tuổi hơn Hương | Bằng tuổi nhau\nĐáp án: Ba ít tuổi hơn Hương\nGợi ý: Hai tổng bằng nhau giống như cân thăng bằng.\n',
    giai: 'Câu giải toán: Nhà bạn Tú có một đàn gà. Sau khi mẹ bán đi 5 con gà thì còn lại 43 con gà. Hỏi trước khi bán, nhà bạn Tú có bao nhiêu con gà?\nLời giải: Trước khi bán, nhà bạn Tú có số con gà là:\nPhép tính: 43 + 5 = 48\nĐáp số: 48 con gà\nGợi ý: Đã bán đi thì lúc đầu nhiều hơn hay ít hơn bây giờ?\n',
    tuCham: 'Câu: Vẽ một đường gấp khúc gồm 3 đoạn thẳng vào vở.\nTự chấm\nĐáp án: Ba đoạn thẳng nối tiếp nhau, không cùng nằm trên một đường thẳng.\n',
    tinh: 'Câu tính: 27 + 18 − 16; 63 − 27 + 19; 92 − 46 − 18\n',
    datTinh: 'Câu đặt tính: 38 + 27; 45 + 36; 96 − 38; 84 − 27\n',
    soSanh: 'Câu so sánh: 72 + 19 ? 65 + 28; 83 − 27 ? 64 − 19\n',
    dungSai: 'Câu đúng sai: 45 + 23 > 25 + 31\n\nCâu đúng sai: 42 − 2cm = 40cm\nĐáp án: S\nCách giải: Số 42 thiếu đơn vị cm.\n',
    dienDau: 'Câu điền dấu: 18 ? 4 ? 2 ? 3 = 13\n'
  };

  g.VB = VB;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* ---- js/kieu-cau.js ---- */
/* Các kiểu câu hỏi tương tác (chạm, kéo thả, bàn phím số trên màn hình).
   KC.ve(cau, khung, ctx) → { canKiem, layGiaTri, daDu, danhDau(kq), hienDapAn, khoa }
   KC.kiem(cau, giaTri) → { dung, chiTiet, loi } */
(function (g) {
  'use strict';
  const KC = {};
  const { $, $$, el } = T;

  /* ---------- Thay ô [[i]] và {{i}} bằng phần tử ---------- */
  KC.oTrong = html => String(html)
    .replace(/\[\[(\d+)\]\]/g, (_, i) => `<span class="o-nhap" data-i="${i}" role="textbox" aria-label="Ô trống ${Number(i) + 1}" tabindex="0"></span>`)
    .replace(/\{\{(\d+)\}\}/g, (_, i) => `<span class="o-tha" data-i="${i}" aria-label="Chỗ thả ${Number(i) + 1}"></span>`);

  /* ================= BÀN PHÍM SỐ ================= */
  const BP = KC.banPhim = {
    goc: null, dangChon: null, khiXong: null,
    tao() {
      this.goc = $('#ban-phim');
      this.goc.innerHTML = `<div class="bp-luoi">${[1, 2, 3, 4, 5, 6, 7, 8, 9].map(k => `<button class="bp-phim" data-k="${k}">${k}</button>`).join('')}
        <button class="bp-phim bp-xoa" data-k="xoa" aria-label="Xoá">⌫</button><button class="bp-phim" data-k="0">0</button><button class="bp-phim bp-ok" data-k="ok" aria-label="Xong">✓</button></div>`;
      this.goc.addEventListener('pointerdown', e => {
        const b = e.target.closest('.bp-phim'); if (!b) return;
        e.preventDefault(); this.bam(b.dataset.k); b.classList.add('nhan'); setTimeout(() => b.classList.remove('nhan'), 120);
      });
      document.addEventListener('keydown', e => {
        if (!this.dangChon || !document.body.contains(this.dangChon) || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT') return;
        if (/^\d$/.test(e.key)) { this.bam(e.key); e.preventDefault(); }
        else if (e.key === 'Backspace') { this.bam('xoa'); e.preventDefault(); }
        else if (e.key === 'Enter') { this.bam('ok'); e.preventDefault(); }
        else if (e.key === 'Tab') { this.chuyen(e.shiftKey ? -1 : 1); e.preventDefault(); }
      });
    },
    nhom() { return this.dangChon ? $$('.o-nhap:not(.khoa)', this.dangChon.closest('.nhom-o') || document) : []; },
    chon(o) {
      $$('.o-nhap.dang-chon').forEach(x => x.classList.remove('dang-chon'));
      this.dangChon = o || null;
      if (o) { o.classList.add('dang-chon'); this.hien(true); }
    },
    chuyen(b) { const ds = this.nhom(), i = ds.indexOf(this.dangChon); if (ds.length) this.chon(ds[(i + b + ds.length) % ds.length]); },
    bam(k) {
      const o = this.dangChon; if (!o || o.classList.contains('khoa')) return;
      T.am.choi('cham');
      if (k === 'ok') { if (o._khiOk) o._khiOk(); return; }
      let s = o.dataset.gt || '';
      if (k === 'xoa') s = s.slice(0, -1);
      else if (s.length < (Number(o.dataset.dai) || 4)) s = (s === '0' ? '' : s) + k;
      o.dataset.gt = s; o.textContent = s; o.classList.remove('sai', 'dung');
      if (o._khiDoi) o._khiDoi(s);
      // tự sang ô kế tiếp khi đã đủ số chữ số của đáp án (nếu biết)
      if (k !== 'xoa' && o.dataset.du && s.length >= Number(o.dataset.du)) {
        const ds = this.nhom(), i = ds.indexOf(o);
        if (i >= 0 && i < ds.length - 1 && !ds[i + 1].dataset.gt) this.chon(ds[i + 1]);
      }
    },
    hien(c) { if (this.goc) this.goc.hidden = !c; document.body.classList.toggle('co-ban-phim', !!c); },
    gan(khung, khiOk) {
      const ds = $$('.o-nhap', khung);
      ds.forEach(o => {
        o._khiOk = khiOk;
        o.addEventListener('pointerdown', e => { e.preventDefault(); this.chon(o); });
        o.addEventListener('focus', () => this.chon(o));
      });
      return ds;
    }
  };

  /* ================= KIỂM TRA ĐÁP ÁN ================= */
  const bang = (a, b) => a.length === b.length && a.every((x, i) => x === b[i]);
  KC.kiem = function (q, v) {
    switch (q.loai) {
      case 'so': case 'chiaDeu': return { dung: v === q.dapAn };
      case 'o': {
        if (q.khongThuTu) {
          const con = q.dapAn.slice(), ct = v.map(x => { const i = con.indexOf(x); if (i >= 0) { con.splice(i, 1); return true; } return false; });
          return { dung: ct.every(Boolean), chiTiet: ct };
        }
        const ds = [q.dapAn].concat(q.dapAnKhac || []);
        const khop = ds.find(d => bang(d, v));
        if (khop) return { dung: true, chiTiet: v.map(() => true) };
        return { dung: false, chiTiet: v.map((x, i) => x === q.dapAn[i] || (q.dapAnKhac || []).some(d => d[i] === x)) };
      }
      case 'chon': return { dung: v === q.dapAn };
      case 'chonNhieu': {
        if (q.kiem === 'tong') { const t = T.tong(v.map(i => q.luaChon[i].gt)); return { dung: t === q.dich, tong: t }; }
        const dung = new Set(q.dung), chon = new Set(v);
        const trung = v.filter(i => dung.has(i)).length, thua = v.length - trung, thieu = q.dung.length - trung;
        return { dung: thua === 0 && thieu === 0, trung, thua, thieu };
      }
      case 'sapXep': { const ct = v.map((x, i) => String(x) === String(q.dapAn[i])); return { dung: ct.every(Boolean) && v.length === q.dapAn.length, chiTiet: ct }; }
      case 'keoTha': {
        const khop = [q.dapAn].concat(q.dapAnKhac || []).find(d => d.every((x, i) => x === v[i]));
        if (khop) return { dung: true, chiTiet: v.map(() => true) };
        const ct = v.map((x, i) => x === q.dapAn[i]); return { dung: false, chiTiet: ct };
      }
      case 'dongHo': return { dung: (v.gio % 12) === (q.dapAn.gio % 12) && v.phut === q.dapAn.phut };
      case 'tuCham': return { dung: !!v };
      default: return { dung: false };
    }
  };

  /* ================= VẼ TỪNG KIỂU ================= */
  const VE = {};
  KC.ve = function (q, khung, ctx) {
    const f = VE[q.loai] || VE.so;
    return f(q, khung, ctx);
  };

  function oNhapChung(q, khung, ctx, dapAnDs) {
    const ds = BP.gan(khung, () => ctx.kiemTra());
    ds.forEach(o => { const i = Number(o.dataset.i); if (dapAnDs && dapAnDs[i] != null) { o.dataset.du = String(dapAnDs[i]).length; o.dataset.dai = Math.max(4, String(dapAnDs[i]).length); } });
    if (ds.length) setTimeout(() => BP.chon(ds.find(o => !o.dataset.gt) || ds[0]), 30);
    return ds;
  }
  const giaTriO = o => o.dataset.gt === '' || o.dataset.gt == null ? null : Number(o.dataset.gt);

  /* --- Điền một số / nhiều ô --- */
  VE.so = VE.o = function (q, khung, ctx) {
    const vung = khung.querySelector('.vung-tra-loi');
    const coO = !!khung.querySelector('.o-nhap');
    if (!coO) vung.innerHTML = KC.oTrong(`<div class="dong-tra-loi"><span>Trả lời:</span> [[0]] ${q.donVi ? `<span class="don-vi">${q.donVi}</span>` : ''}</div>`);
    else if (q.donVi) vung.innerHTML = `<div class="ghi-chu">Đơn vị: ${q.donVi}</div>`;
    const dap = q.loai === 'so' ? [q.dapAn] : q.dapAn;
    const ds = oNhapChung(q, khung, ctx, q.khongThuTu ? null : dap).sort((a, b) => a.dataset.i - b.dataset.i);
    return {
      canKiem: true,
      daDu: () => ds.every(o => giaTriO(o) != null),
      layGiaTri: () => q.loai === 'so' ? giaTriO(ds[0]) : ds.map(giaTriO),
      danhDau(kq) {
        if (q.loai === 'so') { ds[0].classList.add(kq.dung ? 'dung' : 'sai'); return; }
        ds.forEach((o, i) => o.classList.add(kq.dung || (kq.chiTiet && kq.chiTiet[i]) ? 'dung' : 'sai'));
      },
      hienDapAn() { ds.forEach((o, i) => { const v = q.loai === 'so' ? q.dapAn : q.dapAn[i]; o.dataset.gt = v; o.textContent = v; o.classList.remove('sai'); o.classList.add('lo'); }); },
      khoa() { ds.forEach(o => o.classList.add('khoa')); BP.chon(null); }
    };
  };

  /* --- Chọn một đáp án --- */
  VE.chon = function (q, khung, ctx) {
    const vung = khung.querySelector('.vung-tra-loi');
    const thuTu = q._thuTu || (q._thuTu = q.giuThuTu ? q.luaChon.map((_, i) => i) : T.tron(q.luaChon.map((_, i) => i)));
    const cot = q.cot || (q.luaChon.length <= 2 ? 2 : q.luaChon.some(x => String(x).length > 26) ? 1 : 2);
    vung.innerHTML = `<div class="lua-chon cot-${cot}">${thuTu.map((i, k) => `<button class="lc" data-i="${i}"><span class="lc-chu">${String.fromCharCode(65 + k)}</span><span class="lc-nd">${q.luaChon[i]}</span></button>`).join('')}</div>`;
    let daKhoa = false;
    $$('.lc', vung).forEach(b => b.addEventListener('click', () => { if (daKhoa || b.classList.contains('sai')) return; ctx.nop(Number(b.dataset.i), b); }));
    return {
      canKiem: false,
      danhDau(kq, v) { const b = vung.querySelector(`.lc[data-i="${v}"]`); if (b) b.classList.add(kq.dung ? 'dung' : 'sai'); },
      hienDapAn() { const b = vung.querySelector(`.lc[data-i="${q.dapAn}"]`); if (b) b.classList.add('lo'); },
      khoa() { daKhoa = true; $$('.lc', vung).forEach(b => b.classList.add('khoa')); }
    };
  };

  /* --- Chọn nhiều ô (bảng số, hình, tờ tiền) --- */
  VE.chonNhieu = function (q, khung, ctx) {
    const vung = khung.querySelector('.vung-tra-loi');
    const nhan = x => typeof x === 'object' && x ? x.nhan : x;
    vung.innerHTML = `<div class="chon-nhieu${q.nho ? ' nho' : ''}" style="--cot:${q.luoi || 4}">${q.luaChon.map((x, i) => `<button class="cn" data-i="${i}" aria-pressed="false">${nhan(x)}</button>`).join('')}</div><div class="ghi-chu dem-chon">Đã chọn: <b>0</b></div>`;
    const dem = $('.dem-chon b', vung);
    let daKhoa = false;
    $$('.cn', vung).forEach(b => b.addEventListener('click', () => {
      if (daKhoa) return; T.am.choi('cham');
      b.classList.toggle('bat'); b.setAttribute('aria-pressed', b.classList.contains('bat'));
      $$('.cn', vung).forEach(x => x.classList.remove('sai', 'dung'));
      dem.textContent = $$('.cn.bat', vung).length;
    }));
    return {
      canKiem: true,
      daDu: () => $$('.cn.bat', vung).length > 0,
      layGiaTri: () => $$('.cn.bat', vung).map(b => Number(b.dataset.i)),
      danhDau(kq) { if (kq.dung) $$('.cn.bat', vung).forEach(b => b.classList.add('dung')); },
      hienDapAn() {
        if (q.kiem === 'tong') return;
        $$('.cn', vung).forEach(b => { const i = Number(b.dataset.i); b.classList.toggle('bat', q.dung.includes(i)); if (q.dung.includes(i)) b.classList.add('lo'); });
      },
      khoa() { daKhoa = true; }
    };
  };

  /* --- Sắp xếp: chạm thẻ để đưa lên hàng trả lời --- */
  VE.sapXep = function (q, khung, ctx) {
    const vung = khung.querySelector('.vung-tra-loi');
    vung.innerHTML = `<div class="hang-xep dich" aria-label="Hàng trả lời">${q.dapAn.map(() => '<span class="cho-trong"></span>').join('')}</div><div class="hang-xep nguon">${q.luaChon.map((x, i) => `<button class="the-xep" data-i="${i}">${x}</button>`).join('')}</div><div class="ghi-chu">Chạm vào số theo thứ tự. Chạm lại để bỏ ra.</div>`;
    const dich = $('.dich', vung), nguon = $('.nguon', vung);
    let daKhoa = false;

    $$('.the-xep', vung).forEach(b => b.addEventListener('click', () => {

  /* --- Kéo thả thẻ vào ô (có thể chạm thẻ rồi chạm ô) --- */
  VE.keoTha = function (q, khung, ctx) {
    const vung = khung.querySelector('.vung-tra-loi');

    const oDs = $$('.o-tha', khung).sort((a, b) => a.dataset.i - b.dataset.i);
    let dangCam = null, daKhoa = false;
    const datVao = (o, the) => {
      if (daKhoa) return;
      if (o.dataset.gt && !dungLai && o._the) o._the.hidden = false;
      o.dataset.gt = the.dataset.gt; o.textContent = the.dataset.gt; o._the = the; o.classList.remove('sai', 'dung'); o.classList.add('co');
      if (!dungLai) the.hidden = true;
      T.am.choi('cham');
      $$('.the-tha.cam', vung).forEach(x => x.classList.remove('cam')); dangCam = null;
    };
    oDs.forEach(o => o.addEventListener('click', () => {
      if (daKhoa) return;
      if (dangCam) { datVao(o, dangCam); return; }
      if (o.dataset.gt) { if (!dungLai && o._the) o._the.hidden = false; o.dataset.gt = ''; o.textContent = ''; o.classList.remove('co', 'sai', 'dung'); }
    }));
    $$('.the-tha', vung).forEach(the => {
      the.addEventListener('pointerdown', e => {
        if (daKhoa) return;
        e.preventDefault();
        const x0 = e.clientX, y0 = e.clientY; let bong = null;
        const di = ev => {
          if (!bong && Math.hypot(ev.clientX - x0, ev.clientY - y0) > 6) { bong = the.cloneNode(true); bong.classList.add('bong'); document.body.appendChild(bong); }
          if (bong) { bong.style.left = ev.clientX + 'px'; bong.style.top = ev.clientY + 'px'; oDs.forEach(o => o.classList.remove('sap-tha')); const d = document.elementFromPoint(ev.clientX, ev.clientY); const o = d && d.closest('.o-tha'); if (o) o.classList.add('sap-tha'); }
        };
        const tha = ev => {
          window.removeEventListener('pointermove', di); window.removeEventListener('pointerup', tha); window.removeEventListener('pointercancel', tha);
          oDs.forEach(o => o.classList.remove('sap-tha'));
          if (bong) { bong.remove(); const d = document.elementFromPoint(ev.clientX, ev.clientY); const o = d && d.closest('.o-tha'); if (o && khung.contains(o)) datVao(o, the); }
          else { const dang = the.classList.contains('cam'); $$('.the-tha.cam', vung).forEach(x => x.classList.remove('cam')); if (!dang) { the.classList.add('cam'); dangCam = the; } else dangCam = null; }
        };
        window.addEventListener('pointermove', di); window.addEventListener('pointerup', tha); window.addEventListener('pointercancel', tha);
      });
    });
    return {
      canKiem: true,
      daDu: () => oDs.every(o => o.dataset.gt),
      layGiaTri: () => oDs.map(o => o.dataset.gt),
      danhDau(kq) { oDs.forEach((o, i) => o.classList.add(kq.dung || kq.chiTiet[i] ? 'dung' : 'sai')); },

      khoa() { daKhoa = true; }

  };

  /* --- Đồng hồ kéo kim --- */
  VE.dongHo = function (q, khung, ctx) {
    const vung = khung.querySelector('.vung-tra-loi');
    const buoc = q.buocPhut || 5;
    const st = { gio: 12, phut: 0 };
    vung.innerHTML = `<div class="dh-tuong-tac"><div class="dh-khung"></div>
      <div class="dh-nut"><div><span>Giờ</span><button data-k="g-">−</button><b class="dh-g">12</b><button data-k="g+">+</button></div>
      <div><span>Phút</span><button data-k="p-">−</button><b class="dh-p">00</b><button data-k="p+">+</button></div></div></div>`;
    const kh = $('.dh-khung', vung);
    let daKhoa = false;
    const ve = () => { kh.innerHTML = HV.dongHoSvg(st.gio, st.phut, 220); $('.dh-g', vung).textContent = st.gio; $('.dh-p', vung).textContent = String(st.phut).padStart(2, '0'); };
    ve();
    $$('.dh-nut button', vung).forEach(b => b.addEventListener('click', () => {
      if (daKhoa) return; T.am.choi('cham');
      const k = b.dataset.k;
      if (k === 'g+') st.gio = st.gio % 12 + 1; if (k === 'g-') st.gio = (st.gio + 10) % 12 + 1;
      if (k === 'p+') st.phut = (st.phut + buoc) % 60; if (k === 'p-') st.phut = (st.phut - buoc + 60) % 60;
      ve();
    }));
    let keo = null;
    kh.addEventListener('pointerdown', e => {
      if (daKhoa) return;
      const r = kh.getBoundingClientRect(), x = e.clientX - r.left - r.width / 2, y = e.clientY - r.top - r.height / 2;
      keo = Math.hypot(x, y) < r.width * 0.27 ? 'gio' : 'phut'; kh.setPointerCapture(e.pointerId); e.preventDefault();
    });
    kh.addEventListener('pointermove', e => {
      if (!keo) return;
      const r = kh.getBoundingClientRect(), x = e.clientX - r.left - r.width / 2, y = e.clientY - r.top - r.height / 2;
      let goc = Math.atan2(x, -y) * 180 / Math.PI; if (goc < 0) goc += 360;
      if (keo === 'phut') st.phut = (Math.round(goc / 6 / buoc) * buoc) % 60;
      else { st.gio = Math.round(goc / 30) % 12 || 12; }
      ve();
    });
    kh.addEventListener('pointerup', () => { keo = null; });
    return {
      canKiem: true, daDu: () => true,
      layGiaTri: () => ({ gio: st.gio, phut: st.phut }),
      danhDau(kq) { kh.classList.add(kq.dung ? 'dung' : 'sai'); setTimeout(() => kh.classList.remove('sai'), 700); },
      hienDapAn() { st.gio = q.dapAn.gio % 12 || 12; st.phut = q.dapAn.phut; ve(); kh.classList.add('dung'); },
      khoa() { daKhoa = true; }
    };
  };

  /* --- Chia đều vào đĩa (đồ dùng trực quan) + ô trả lời --- */
  VE.chiaDeu = function (q, khung, ctx) {

      <div class="ghi-chu">Chạm vào đĩa để cho thêm 1 ${q.vat}. Chạm vào ${q.vat} trong đĩa để lấy lại.</div></div>` + KC.oTrong(`<div class="dong-tra-loi"><span>Mỗi đĩa có:</span> [[0]]</div>`);
    const dong = $('.cd-dong', vung);

      $$('.cd-dia', vung).forEach((d, i) => { d.innerHTML = `<span>${Array(dem[i]).fill(`<i>${q.vat}</i>`).join('')}</span><small>${dem[i]}</small>`; });
    };

    $$('.cd-dia', vung).forEach(d => d.addEventListener('click', e => {
      const i = Number(d.dataset.i);

      T.am.choi('cham'); ve();
    }));
    const ds = oNhapChung(q, vung, ctx, [q.dapAn]);
    return {
      canKiem: true,
      daDu: () => giaTriO(ds[0]) != null,
      layGiaTri: () => giaTriO(ds[0]),
      danhDau(kq) { ds[0].classList.add(kq.dung ? 'dung' : 'sai'); },
      hienDapAn() { dem.fill(q.dapAn); con = 0; ve(); ds[0].dataset.gt = q.dapAn; ds[0].textContent = q.dapAn; ds[0].classList.add('lo'); },
      khoa() { ds.forEach(o => o.classList.add('khoa')); BP.chon(null); }
    };
  };

  /* --- Tự chấm: bài làm ra vở --- */
  VE.tuCham = function (q, khung, ctx) {
    const vung = khung.querySelector('.vung-tra-loi');
    vung.innerHTML = `<div class="tu-cham"><p>Con làm bài này ra vở hoặc giấy nháp. Làm xong thì bấm nút dưới đây để so với đáp án.</p>
      <button class="nut nut-phu xem-da">Con làm xong rồi · Xem đáp án</button><div class="tc-da" hidden></div></div>`;
    const da = $('.tc-da', vung);
    $('.xem-da', vung).addEventListener('click', e => {
      e.currentTarget.hidden = true; da.hidden = false;
      da.innerHTML = `<div class="tc-dap"><b>Đáp án:</b> ${T.esc(q.dapAnChu || '')}</div><p>Con so sánh với bài của mình nhé.</p><div class="tc-nut"><button class="nut nut-dung" data-v="1">✓ Con làm đúng</button><button class="nut nut-phu" data-v="0">✗ Con làm chưa đúng</button></div>`;
      $$('.tc-nut button', da).forEach(b => b.addEventListener('click', () => ctx.nop(b.dataset.v === '1', b)));
    });
    return { canKiem: false, danhDau() { }, hienDapAn() { }, khoa() { $$('button', vung).forEach(b => { b.disabled = true; }); } };
  };

  g.KC = KC;
})(typeof window !== 'undefined' ? window : globalThis);

<script>
/* ---- js/ung-dung.js ---- */
/* Ứng dụng: màn hình, màn chơi, chấm sao, gợi ý từng bước, sổ ôn lỗi, góc phụ huynh. */
(function () {
  'use strict';
  const { $, $$, el, esc, luu } = T;
  const BP = KC.banPhim;

  /* ===================================================================
     KHO TIẾN ĐỘ (lưu trong trình duyệt)
     =================================================================== */
  const MAC_HO_SO = { ten: '', avatar: '🐯', xu: 0, sticker: [], chuoi: { ngay: '', so: 0 }, caiDat: { soCau: 6, moKhoa: false, docTo: false, amThanh: true } };
  const TD = {
    hs: Object.assign({}, MAC_HO_SO, luu.doc('hoSo', {})),
    man: luu.doc('man', {}),            // 'dang:cap' | 'phieu:id' → {sao, lan, dung, tong}
    tk: luu.doc('thongKe', {}),         // dang → {dung, tong, goiY, sai}
    soLoi: luu.doc('soLoi', []),
    nhatKy: luu.doc('nhatKy', []),

    kyLuc: luu.doc('kyLuc', {}),
    daXemBK: luu.doc('daXemBK', {}),
    ghi() {
      luu.ghi('hoSo', this.hs); luu.ghi('man', this.man); luu.ghi('thongKe', this.tk); luu.ghi('soLoi', this.soLoi.slice(0, 80));
      luu.ghi('nhatKy', this.nhatKy.slice(0, 400)); luu.ghi('thuThach', this.thuThach); luu.ghi('kyLuc', this.kyLuc); luu.ghi('daXemBK', this.daXemBK);
    },

  };
  TD.hs.caiDat = Object.assign({}, MAC_HO_SO.caiDat, TD.hs.caiDat || {});

  const AVATAR = ['🐯', '🐼', '🐰', '🦊', '🐸', '🐵', '🦄', '🐧'];

  /* Phiếu: phiếu có sẵn + phiếu phụ huynh thêm trong ứng dụng */
  let PHIEU = { ds: [], loi: [] };
  /* Nhóm phiếu theo tên (phần trước dấu “·”). */
  const NHOM_PHIEU = [
    ['on-he', 'Ôn tập hè', '☀️', /^Ôn hè/],
    ['nc-he', 'Nâng cao hè', '🌻', /^Nâng cao hè/],
    ['tuan', 'Phiếu tuần · Kiểm tra cuối tuần', '🗓️', /^(Lớp 2 ·|Lớp 2Q|OLM|Cuối tuần|Kiểm tra cuối tuần)/],
    ['nc', 'Phiếu nâng cao lớp 2Q', '🚀', /^(Nâng cao lớp 2Q|Nâng cao Khối 2|Tăng cường|Tuần \d|Phiếu tự luận)/],
    ['cd', 'Chuyên đề', '🎯', /^Chuyên đề/],
    ['lt', 'Phiếu luyện tập', '✏️', /^(Luyện tập|Mathematics)/],
    ['td', 'Toán tư duy', '🧩', /^Tư duy/],
    ['th', 'Ôn tập tổng hợp', '🏆', /^Ôn tập tổng hợp/],
    ['them', 'Bài bố mẹ thêm', '👪', /./]
  ];
  const CO_PHAN = 10;                         // phiếu dài được chia thành từng phần ≤ 10 câu
  function chiaPhan(p) {
    const n = p.cau.length, soPhan = Math.max(1, Math.ceil(n / CO_PHAN)), co = Math.ceil(n / soPhan), ds = [];
    for (let i = 0; i < n; i += co) ds.push([i, Math.min(n, i + co)]);
    return ds;
  }
  function khoaPhan(p, k) { return chiaPhan(p).length > 1 ? `phieu:${p.id}:${k}` : 'phieu:' + p.id; }

  const tenNgan = p => p.id.startsWith('lop-') ? p.ten.replace(/^[^·]*·\s*/, '') : p.ten;
  function napPhieu() {

    PHIEU.ds.forEach(p => { if (!p.nhom) p.nhom = NHOM_PHIEU.find(n => n[3].test(p.ten))[0]; });

  /* ===================================================================
     TIỆN ÍCH GIAO DIỆN
     =================================================================== */
  const app = () => $('#app');
  function man(html, lop) {

  }
  const saoHtml = (s, max) => Array.from({ length: max || 3 }, (_, i) => `<i class="${i < s ? 'co' : ''}">★</i>`).join('');
  function hopThoai(html, lop) {
    const h = el(`<div class="hop-thoai-nen" role="dialog" aria-modal="true"><div class="hop-thoai ${lop || ''}"><button class="ht-dong" aria-label="Đóng">✕</button>${html}</div></div>`);
    document.body.appendChild(h);

    h.addEventListener('click', e => { if (e.target === h || e.target.closest('.ht-dong')) dong(); });
    return { goc: h, dong };
  }
  const BON_BUOC = `<div class="bon-buoc"><b>Bốn bước suy nghĩ</b><ol>
    <li><b>Đọc</b> đề hai lần. Bấm 🔊 để nghe nếu cần.</li>
    <li><b>Hiểu</b>: bài cho biết gì? hỏi gì? Có số đặc biệt nào cần tìm trước không?</li>
    <li><b>Làm</b> từng bước nhỏ. Ra nháp nếu số lớn.</li>
    <li><b>Kiểm tra</b>: thử lại kết quả, xem có hợp lí không.</li></ol></div>`;
  const nguonNgan = p => (p.nguon || '').split(/\.\s+(?=Kiến thức|Cách giải|Bỏ |Ví dụ|New words|Dạng)/)[0];
  const kienThucPhieu = p => { const t = (p.nguon || '').slice(nguonNgan(p).length).replace(/^\.\s*/, ''); return /Kiến thức|Cách giải|Ví dụ|New words|Dạng/.test(t) ? t.replace(/Bỏ [^.]*vì cần hình gốc\.?/g, '').trim() : ''; };
  function moBiKip(idDang) {
    const d = CT.dang[idDang];
    const p = !d && P && P.spec.kieu === 'phieu' ? PHIEU.ds.find(x => x.id === P.spec.id) : null;
    const kt = p ? kienThucPhieu(p) : '';
    hopThoai(`<h2>📖 Bí kíp${d ? ': ' + d.ten : p ? ': ' + esc(tenNgan(p)) : ''}</h2>${d ? `<div class="bk-noi-dung">${d.ghiNho}</div>` : ''}${kt ? `<div class="bk-noi-dung"><p><b>Kiến thức trên phiếu của cô</b></p><p>${esc(kt)}</p></div>` : ''}${BON_BUOC}`, 'bk');
    if (d) { TD.daXemBK[idDang] = true; TD.ghi(); }
  }
  function capNhatChuoi() {
    const h = T.homNay(), c = TD.hs.chuoi;
    if (c.ngay === h) return;
    const d = new Date(Date.now() - 864e5);
    const homQua = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    c.so = c.ngay === homQua ? c.so + 1 : 1; c.ngay = h;

  /* ===================================================================
     MỞ KHOÁ MÀN
     =================================================================== */
  function moKhoa(idDang, cap) {
    if (TD.hs.caiDat.moKhoa) return true;
    const d = CT.dang[idDang], dao = CT.timDao(d.dao), vt = dao.dang.indexOf(idDang);
    if (cap === 1) return vt === 0 || TD.sao(dao.dang[vt - 1] + ':1') >= 1;
    return TD.sao(idDang + ':' + (cap - 1)) >= 1;
  }
  function tienDoDao(dao) {
    const max = dao.dang.length * 9;
    const co = dao.dang.reduce((s, id) => s + [1, 2, 3].reduce((t, c) => t + TD.sao(id + ':' + c), 0), 0);
    return { co, max };
  }

  /* ===================================================================
     MÀN HÌNH: HỒ SƠ LẦN ĐẦU
     =================================================================== */
  function veHoSo(sua) {
    man(`<div class="khung hop-giua"><div class="the-lon chao">
      <div class="logo-dao" aria-hidden="true">🏝️</div>
      <h1>Đảo Toán Lớp 2</h1>
      <p>Mỗi hòn đảo là một chủ đề trong sách Toán 2. Con giải toán để nhận sao, mở màn mới và sưu tập thú cưng.</p>
      <label for="ten-be">Con tên là gì?</label>
      <input id="ten-be" maxlength="20" value="${esc(TD.hs.ten)}" placeholder="Ví dụ: Minh Anh" autocomplete="off">

  /* ===================================================================
     MÀN HÌNH: TRANG CHỦ
     =================================================================== */
  function veTrangChu() {
    napPhieu();
    const h = TD.hs, homNay = T.homNay(), daThuThach = TD.thuThach[homNay];
    const thang = new Date().getMonth() + 1, hkNay = thang >= 8 || thang <= 1 ? 1 : 2;
    man(`<div class="khung">
      <header class="dau-trang">
        <button class="ho-so-nho" id="nut-ho-so" aria-label="Đổi tên, đổi bạn đồng hành"><span class="av-to">${h.avatar}</span><span><b>${esc(h.ten)}</b><small>Học kì ${hkNay} · lớp 2</small></span></button>

        <div class="hero-nut">
          <button class="the-nhanh tt" id="nut-thu-thach"><span class="tn-bieu">🎯</span><b>Thử thách hôm nay</b><small>${daThuThach != null ? 'Đã làm · ' + saoHtml(daThuThach) : '8 câu trộn: dạng bài và đề trên lớp'}</small></button>
          <button class="the-nhanh pc" id="nut-phieu"><span class="tn-bieu">📄</span><b>Phiếu trên lớp</b><small>${PHIEU.ds.length} phiếu · ${PHIEU.ds.reduce((s, p) => s + p.cau.length, 0)} câu đề thật</small></button>
          <button class="the-nhanh ol" id="nut-loi"><span class="tn-bieu">🩹</span><b>Ôn lỗi sai</b><small>${TD.soLoi.length ? TD.soLoi.length + ' câu cần ôn' : 'Chưa có câu nào'}</small></button>

      </section>
      <h2 class="tieu-de-muc">Bản đồ các đảo</h2>
      <div class="ban-do">${CT.dao.map(d => { const t = tienDoDao(d); return `<button class="dao-the${d.hk === hkNay ? ' hk-nay' : ''}" data-id="${d.id}" style="--mau:${d.mau}">

        ${d.hk ? `<span class="nhan-hk">HK${d.hk}</span>` : '<span class="nhan-hk tt">Tư duy</span>'}</button>`; }).join('')}</div>
      <div class="hang-phu">
        <button class="nut-phu-to" id="nut-tia-chop">⚡ Tia chớp tính nhẩm</button>
        <button class="nut-phu-to" id="nut-bi-kip">📖 Sổ bí kíp</button>
        <button class="nut-phu-to" id="nut-album">🎁 Bộ sưu tập</button>

      </div>
      <footer class="chan">Bám theo chương trình Toán 2 (Cánh Diều) và các phiếu nâng cao bé được giao trên lớp.</footer>
    </div>`, 'man-chu');
    $$('.dao-the').forEach(b => b.addEventListener('click', () => veDao(b.dataset.id)));
    $('#nut-ho-so').addEventListener('click', () => veHoSo(true));
    $('#nut-thu-thach').addEventListener('click', () => batDau({ kieu: 'ngay' }));
    $('#nut-phieu').addEventListener('click', veDsPhieu);
    $('#nut-loi').addEventListener('click', () => { if (TD.soLoi.length) batDau({ kieu: 'loi' }); else thongBao('Chưa có câu nào cần ôn. Giỏi quá!'); });
    $('#nut-tia-chop').addEventListener('click', veTiaChopChon);
    $('#nut-bi-kip').addEventListener('click', veSoBiKip);
    $('#nut-album').addEventListener('click', veAlbum);
    $('#nut-phu-huynh').addEventListener('click', cuaPhuHuynh);
